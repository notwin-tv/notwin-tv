
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05050b">
<title>NOTWIN TV</title>
<style>
:root{--bg:#05050b;--card:#11101c;--purple:#8068ff;--text:#f6f3ff;--muted:#aaa4c2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}
header{position:sticky;top:0;z-index:5;background:#090811f5;border-bottom:1px solid #29213e;padding:15px 5%;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.logo{font-size:24px;font-weight:900;white-space:nowrap}.logo span{color:#9c87ff}
input{background:#151322;border:1px solid #34294f;color:white;padding:12px;border-radius:12px;outline:none}
#search{width:min(100%,360px)}
main{max-width:1150px;margin:auto;padding:22px 5% 100px}
.hero{padding:25px;border:1px solid #33254f;border-radius:20px;background:linear-gradient(125deg,#251742,#111020 70%,#090811);margin-bottom:25px}
.hero h1{margin:0 0 10px;font-size:28px}.hero p{line-height:1.8;color:#d0c9e5;margin:0}
h2{font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.card{background:var(--card);border:1px solid #262039;border-radius:15px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{border-color:var(--purple);transform:translateY(-3px)}
.poster{height:205px;background:linear-gradient(145deg,#302050,#11101c);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:10px;color:#d9d0ff;font-weight:bold}
.poster img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:14px;line-height:1.5;margin:10px}
.card p{font-size:12px;color:var(--muted);margin:0 10px 12px}
button,.link{border:0;border-radius:10px;padding:11px 15px;background:var(--purple);color:white;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
.secondary{background:#211b35;border:1px solid #41345f}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}
.detail{display:grid;grid-template-columns:200px 1fr;gap:22px}
.detail .poster{height:280px;border-radius:15px}
.detail p{line-height:1.9;color:#d4cfe4}
.episodes{display:grid;gap:10px}
.episode{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid #29213f;border-radius:12px;padding:14px}
.episode small{display:block;color:var(--muted);margin-top:6px}
.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;margin-top:15px}
.player iframe,.player video{width:100%;height:100%;border:0}
.notice{padding:15px;border:1px solid #3b3057;background:#151222;border-radius:12px;line-height:1.8;color:#ddd5f5;margin-top:15px}
.empty{text-align:center;padding:30px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:space-around;background:#0b0914f5;border-top:1px solid #2b2341;padding:12px 5%;padding-bottom:max(12px,env(safe-area-inset-bottom))}
nav button{background:none;color:#c7c0df}
nav button.active{color:#a998ff}
@media(max-width:550px){header{padding:12px 4%}#search{width:100%;max-width:none}main{padding:18px 4% 95px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.poster{height:190px}.detail{grid-template-columns:1fr}.detail .poster{max-width:220px;height:270px}.hero h1{font-size:24px}}
</style>
</head>
<body>
<header>
  <div class="logo">NOTWIN <span>TV</span></div>
  <input id="search" type="search" placeholder="ابحث عن مسلسل..." aria-label="البحث">
</header>

<main id="app">
  <div class="empty">جاري تحميل المسلسلات...</div>
</main>

<nav>
  <button class="active" data-page="home">🏠 الرئيسية</button>
  <button data-page="favorites">💜 المفضّلة</button>
</nav>

<script>
const titles=[
"Squid Game","Queen of Tears","Crash Landing on You",
"Business Proposal","All of Us Are Dead","True Beauty",
"Goblin","The Glory","Lovely Runner","Vincenzo",
"Descendants of the Sun","Extraordinary Attorney Woo",
"My Demon","King the Land","Weak Hero","Moving",
"Marry My Husband","Twenty Five Twenty One",
"Hometown Cha-Cha-Cha","It's Okay to Not Be Okay"
];

// تقدر تزيد هنا روابط الفيديوهات الرسمية المرخّصة.
// مثال: "Squid Game": {1:"https://example.com/video.mp4"}
const licensedVideos={};

const app=document.getElementById("app");
const search=document.getElementById("search");
let shows=[];
let page="home";
let selectedShow=null;
let searchTimer;
let searchRequest=0;
let favorites=[];
try{favorites=JSON.parse(localStorage.getItem("notwinFavorites")||"[]");}catch(e){favorites=[];}

function safe(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function imageHTML(show){
  const image=show.image?.medium||show.image?.original;
  if(!image)return safe(show.name);
  return `<img src="${safe(image)}" alt="${safe(show.name)}" loading="lazy" onerror="this.style.display='none';this.parentElement.textContent='${safe(show.name).replace(/'/g,"&#39;")}'">`;
}

function card(show){
  return `<article class="card" data-show="${show.id}">
    <div class="poster">${imageHTML(show)}</div>
    <h3>${safe(show.name)}</h3>
    <p>${safe(show.premiered?.slice(0,4)||"دراما")}</p>
  </article>`;
}

function renderHome(){
  page="home";
  app.innerHTML=`
  <section class="hero">
    <h1>مرحبا بك في NOTWIN TV 💜</h1>
    <p>اكتشف الدراما الكورية، تعرّف على المسلسلات والحلقات، واحفظ أعمالك المفضّلة.</p>
  </section>
  <div class="row"><h2>مسلسلات مقترحة</h2><span>${shows.length} مسلسل</span></div>
  ${shows.length?`<div class="grid">${shows.map(card).join("")}</div>`:`<div class="empty">ما قدرناش نحمّلو المسلسلات.</div>`}
  <p class="notice">المعلومات والصور من TVmaze. توفر الصور والحلقات يعتمد على مصدر البيانات.</p>`;
}

function renderFavorites(){
  page="favorites";
  const list=shows.filter(show=>favorites.includes(show.id));
  app.innerHTML=`<button class="secondary" id="back">← الرئيسية</button>
  <div class="row"><h2>💜 المفضّلة</h2></div>
  ${list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty">ما زدت حتى مسلسل للمفضّلة.</div>`}`;
}

async function openShow(id){
  const show=shows.find(item=>item.id===Number(id));
  if(!show)return;
  selectedShow=show;
  page="details";
  app.innerHTML='<div class="empty">جاري تحميل تفاصيل المسلسل والحلقات...</div>';

  let episodes=[];
  try{
    const response=await fetch(`https://api.tvmaze.com/shows/${show.id}/episodes`);
    if(response.ok)episodes=await response.json();
  }catch(e){}

  if(!selectedShow||selectedShow.id!==show.id)return;

  const summary=(show.summary||"لا توجد نبذة متوفرة.")
    .replace(/<[^>]*>/g," ").trim();
  const isFav=favorites.includes(show.id);

  app.innerHTML=`
  <button class="secondary" id="back">← رجوع</button>
  <section class="detail" style="margin-top:18px">
    <div class="poster">${imageHTML(show)}</div>
    <div>
      <h1>${safe(show.name)}</h1>
      <p>${safe(summary)}</p>
      <p>سنة الإصدار: ${safe(show.premiered?.slice(0,4)||"غير متوفرة")}</p>
      <p>التقييم: ${safe(show.rating?.average??"غير متوفر")}</p>
      <div class="actions">
        <button id="favorite">${isFav?"💜 إزالة من المفضّلة":"♡ أضف للمفضّلة"}</button>
        <button class="secondary" id="jump">قائمة الحلقات ↓</button>
      </div>
    </div>
  </section>
  <div class="row" id="episodeHeading"><h2>الحلقات</h2><span>${episodes.length} حلقة</span></div>
  ${episodes.length?`<div class="episodes">${episodes.map((ep,index)=>`
    <div class="episode">
      <div><strong>${safe(ep.name||"الحلقة "+(index+1))}</strong>
      <small>الموسم ${safe(ep.season)} · الحلقة ${safe(ep.number??index+1)}</small></div>
      <button data-episode="${safe(ep.number??index+1)}">▶ مشاهدة</button>
    </div>`).join("")}</div>`:`<div class="notice">تعذّر تحميل قائمة الحلقات حاليًا.</div>`}
  <div id="playerArea"></div>`;

  document.getElementById("back").onclick=goBack;
  document.getElementById("jump").onclick=()=>document.getElementById("episodeHeading").scrollIntoView({behavior:"smooth"});
  document.getElementById("favorite").onclick=()=>{
    favorites=favorites.includes(show.id)?favorites.filter(x=>x!==show.id):[...favorites,show.id];
    localStorage.setItem("notwinFavorites",JSON.stringify(favorites));
    openShow(show.id);
  };
  app.querySelectorAll("[data-episode]").forEach(button=>{
    button.onclick=()=>playEpisode(show,Number(button.dataset.episode));
  });
}

function playEpisode(show,number){
  const area=document.getElementById("playerArea");
  const url=licensedVideos[show.name]?.[number];
  if(!url){
    area.innerHTML=`<div class="notice">ما عندناش رابط فيديو مرخّص لهذه الحلقة بعد. نقدروا نشغّلوا هنا فيديو رسمي يسمح صاحبه بالتضمين، لكن بيانات الحلقات وحدها ما توفّرش الفيديو.</div>`;
    area.scrollIntoView({behavior:"smooth"});
    return;
  }

  let parsed;
  try{parsed=new URL(url);}catch(e){parsed=null;}
  if(!parsed||parsed.protocol!=="https:"){
    area.innerHTML='<div class="notice">رابط الفيديو غير صالح.</div>';
    return;
  }

  area.innerHTML=`<h2>مشاهدة ${safe(show.name)} — الحلقة ${number}</h2>
  <div class="player"><video controls playsinline preload="metadata">
    <source src="${safe(url)}">
    المتصفح لا يدعم تشغيل هذا الفيديو.
  </video></div>`;
  area.scrollIntoView({behavior:"smooth"});
}

function goBack(){
  if(search.value.trim())runSearch(search.value);
  else if(page==="details")renderHome();
  else renderHome();
}

async function runSearch(query){
  const token=++searchRequest;
  if(!query.trim()){renderHome();return;}
  page="search";
  app.innerHTML='<div class="empty">جاري البحث...</div>';
  try{
    const response=await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query)}`);
    if(!response.ok)throw new Error();
    const results=await response.json();
    if(token!==searchRequest)return;
    const found=results.map(item=>item.show).filter(Boolean);
    app.innerHTML=found.length
      ?`<div class="row"><h2>نتائج البحث</h2></div><div class="grid">${found.map(card).join("")}</div>`
      :'<div class="empty">ما لقيناش نتائج لهذا البحث.</div>';
  }catch(e){
    if(token===searchRequest)app.innerHTML='<div class="notice">تعذّر الاتصال. تأكد من الإنترنت وجرب مرة أخرى.</div>';
  }
}

app.addEventListener("click",event=>{
  const item=event.target.closest("[data-show]");
  if(item)openShow(item.dataset.show);
  if(event.target.id==="back")goBack();
});

search.addEventListener("input",()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>runSearch(search.value),400);
});

document.querySelectorAll("nav button").forEach(button=>{
  button.onclick=()=>{
    document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");
    if(button.dataset.page==="favorites")renderFavorites();
    else{search.value="";renderHome();}
    window.scrollTo({top:0,behavior:"smooth"});
  };
});

async function init(){
  app.innerHTML='<div class="empty">جاري تحميل المسلسلات...</div>';
  const results=await Promise.allSettled(titles.map(async title=>{
    const response=await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(title)}`);
    if(!response.ok)throw new Error();
    const data=await response.json();
    const match=data.find(item=>item.show?.name?.toLowerCase()===title.toLowerCase());
    return match?.show||null;
  }));
  shows=results.filter(r=>r.status==="fulfilled"&&r.value).map(r=>r.value)
    .filter((show,index,array)=>array.findIndex(s=>s.id===show.id)===index);
  if(!shows.length){
    app.innerHTML='<div class="notice">ما قدرناش نحمّلو المسلسلات. تحقق من الإنترنت وحاول مرة أخرى.<br><button id="retry">إعادة المحاولة</button></div>';
    document.getElementById("retry").onclick=init;
    return;
  }
  renderHome();
}

init();
</script>
</body>
</html>
