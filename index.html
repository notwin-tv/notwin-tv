<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>NOTWIN TV</title>
<style>
:root{
  --bg:#080808;
  --card:#121212;
  --red:#d00018;
  --red2:#f0182c;
  --text:#f5f5f5;
  --muted:#858585;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
header{
  position:sticky;top:0;z-index:20;
  background:#090909f5;border-bottom:1px solid #222;
  backdrop-filter:blur(12px);
}
.topbar{
  max-width:1250px;margin:auto;padding:13px 18px;
  display:flex;align-items:center;gap:16px;
}
.logo{font-size:24px;font-weight:900;white-space:nowrap}
.logo span{color:var(--red)}
.search{flex:1}
.search input{
  width:100%;background:#151515;border:1px solid #303030;
  color:white;padding:12px 14px;border-radius:9px;outline:none;
}
.search input:focus{border-color:var(--red)}
.icon-btn{
  background:#171717;border:1px solid #333;color:white;
  padding:10px 13px;border-radius:9px;
}
.hero{
  max-width:1250px;margin:20px auto;padding:0 18px;
}
.hero-box{
  min-height:245px;border:1px solid #2a1719;border-radius:14px;
  display:flex;align-items:center;overflow:hidden;
  background:
  linear-gradient(90deg,transparent,#080808 95%),
  radial-gradient(ellipse at 20% 40%,#5d0712 0,transparent 48%),
  linear-gradient(135deg,#1d1113,#0b0b0b 65%);
}
.hero-content{padding:30px;max-width:650px}
.hero-label{
  display:inline-block;background:var(--red);color:white;
  padding:5px 9px;border-radius:5px;font-size:12px;font-weight:bold;
}
.hero h1{font-size:clamp(28px,5vw,43px);margin:14px 0}
.hero p{color:#bbb;line-height:1.8;margin:0 0 18px}
.primary{
  background:var(--red);color:white;border:0;
  padding:12px 18px;border-radius:8px;font-weight:bold;
}
.primary:hover{background:var(--red2)}
main{max-width:1250px;margin:auto;padding:0 18px 90px}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin:26px 0 17px;
}
.section-head h2{font-size:23px;margin:0}
.tabs,.filters{display:flex;gap:9px;flex-wrap:wrap}
.tab,.filter{
  padding:11px 16px;border-radius:13px;
  border:1px solid #303030;background:#131313;color:#ccc;
}
.tab.active,.filter.active{background:var(--red);border-color:var(--red);color:white}
.filters{margin-bottom:20px}
.grid{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px;
}
.movie-card{
  min-width:0;overflow:hidden;background:var(--card);
  border:1px solid #292929;border-radius:13px;cursor:pointer;
  transition:transform .2s,border-color .2s;
}
.movie-card:hover{transform:translateY(-3px);border-color:#84202a}
.poster{position:relative;aspect-ratio:2/3;background:#191919;overflow:hidden}
.poster img{display:block;width:100%;height:100%;object-fit:cover}
.no-poster{
  width:100%;height:100%;display:flex;align-items:center;
  justify-content:center;color:#777;font-weight:bold;
}
.rating{
  position:absolute;top:9px;right:9px;
  background:#000c;padding:6px 8px;border-radius:7px;font-size:12px;
}
.type-tag{
  position:absolute;bottom:9px;right:9px;
  background:var(--red);padding:6px 9px;border-radius:7px;font-size:12px;
}
.fav{
  position:absolute;top:9px;left:9px;width:38px;height:38px;
  border:0;border-radius:50%;background:#000b;color:white;font-size:22px;
}
.fav.saved{color:#ff3547}
.card-info{padding:12px}
.card-info h3{
  font-size:15px;margin:0 0 9px;direction:ltr;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.meta{display:flex;gap:9px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.message{grid-column:1/-1;text-align:center;color:#aaa;padding:38px 12px;line-height:1.9}
.more-row{text-align:center;padding:26px}
.secondary{
  background:#191919;border:1px solid #393939;color:white;
  border-radius:9px;padding:12px 18px;
}
.bottom-nav{
  position:fixed;z-index:25;bottom:0;left:0;right:0;
  display:flex;justify-content:space-around;
  background:#0b0b0bf5;border-top:1px solid #292929;
  padding:9px 5px calc(9px + env(safe-area-inset-bottom));
}
.bottom-nav button{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:0;color:#999;font-size:12px;min-width:58px;
}
.bottom-nav button.active{color:var(--red)}
.bottom-nav .nav-icon{font-size:20px}
footer{text-align:center;color:#666;padding:20px 15px 100px;font-size:12px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:700px){
  .topbar{padding:11px 12px;gap:9px}
  .logo{font-size:20px}
  .search input{padding:10px;font-size:13px}
  .icon-btn{display:none}
  .hero{padding:0 12px;margin-top:13px}
  .hero-box{min-height:220px}
  .hero-content{padding:21px}
  .hero p{font-size:13px}
  main{padding:0 12px 25px}
  .section-head h2{font-size:21px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card-info{padding:10px}
  .card-info h3{font-size:13px}
  .tab,.filter{padding:10px 12px;font-size:14px}
}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="logo">NOTWIN <span>TV</span></div>
    <div class="search">
      <input id="searchInput" type="search" placeholder="Search movies & series..." autocomplete="off">
    </div>
    <button class="icon-btn" id="favoritesButton">♥ Favorites</button>
  </div>
</header>

<section class="hero">
  <div class="hero-box">
    <div class="hero-content">
      <span class="hero-label">WELCOME TO NOTWIN TV</span>
      <h1>Movies & Series</h1>
      <p>Discover popular movies and series, explore new stories, and find your next favorite.</p>
      <button class="primary" id="exploreButton">Explore Library ←</button>
    </div>
  </div>
</section>

<main id="library">
  <div class="section-head">
    <h2 id="sectionTitle">Most Popular</h2>
    <div class="tabs">
      <button class="tab active" data-type="all">All</button>
      <button class="tab" data-type="movie">Movies</button>
      <button class="tab" data-type="tv">Series</button>
    </div>
  </div>

  <div class="filters">
    <button class="filter active" data-filter="popular">Popular</button>
    <button class="filter" data-filter="top">Top Rated</button>
    <button class="filter" data-filter="favorites">♥ Favorites</button>
  </div>

  <div id="grid" class="grid">
    <div class="message">Loading NOTWIN TV...</div>
  </div>
  <div class="more-row">
    <button class="secondary" id="loadMore">Load More</button>
  </div>
</main>

<footer>NOTWIN TV © <span id="year"></span></footer>

<nav class="bottom-nav">
  <button class="active" data-bottom="home"><span class="nav-icon">⌂</span>Home</button>
  <button data-bottom="movie"><span class="nav-icon">▣</span>Movies</button>
  <button data-bottom="tv"><span class="nav-icon">▤</span>Series</button>
  <button data-bottom="favorites"><span class="nav-icon">♥</span>Favorites</button>
</nav>

<script>
(() => {
  "use strict";

  const API_KEY = "26c5ad9f51818e110945285552c11a75";
  const API = "https://api.themoviedb.org/3";
  const IMAGE = "https://image.tmdb.org/t/p/w500";

  const grid = document.getElementById("grid");
  const searchInput = document.getElementById("searchInput");

  let type = "all";
  let filter = "popular";
  let page = 1;
  let items = [];
  let displayed = [];
  let query = "";
  let timer;
  let requestNumber = 0;

  let favorites = new Set();
  try {
    favorites = new Set(JSON.parse(localStorage.getItem("notwin_favorites") || "[]"));
  } catch (e) {}

  document.getElementById("year").textContent = new Date().getFullYear();

  function titleOf(item) {
    return item.title || item.name || "Unknown Title";
  }

  function keyOf(item) {
    return item.media_type + "-" + item.id;
  }

  function yearOf(item) {
    const date = item.release_date || item.first_air_date || "";
    return date.slice(0, 4) || "—";
  }

  function safe(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  async function api(path, params = {}) {
    const url = new URL(API + path);
    url.searchParams.set("api_key", API_KEY);
    url.searchParams.set("language", "en-US");
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
    const response = await fetch(url);
    if (!response.ok) throw new Error("API request failed");
    return response.json();
  }

  function card(item) {
    const key = keyOf(item);
    const title = safe(titleOf(item));
    const score = Number(item.vote_average || 0).toFixed(1);
    const label = item.media_type === "movie" ? "Movie" : "Series";
    const poster = item.poster_path
      ? `<img loading="lazy" src="${IMAGE}${item.poster_path}" alt="${title}">`
      : `<div class="no-poster">NOTWIN TV</div>`;

    return `
      <article class="movie-card" data-key="${safe(key)}" tabindex="0">
        <div class="poster">
          ${poster}
          <span class="rating">★ ${score}</span>
          <span class="type-tag">${label}</span>
          <button class="fav ${favorites.has(key) ? "saved" : ""}"
            data-fav="${safe(key)}" aria-label="Favorite">${favorites.has(key) ? "♥" : "♡"}</button>
        </div>
        <div class="card-info">
          <h3 lang="en">${title}</h3>
          <div class="meta"><span>${yearOf(item)}</span><span>★ ${score}</span></div>
        </div>
      </article>`;
  }

  function render(list) {
    displayed = list;
    if (!list.length) {
      grid.innerHTML = `<div class="message">No results found. Try another search.</div>`;
      return;
    }
    grid.innerHTML = list.map(card).join("");
  }

  function applyFilter() {
    let result = [...items];
    if (filter === "favorites") {
      result = result.filter(item => favorites.has(keyOf(item)));
    }
    if (filter === "top") {
      result.sort((a,b) => (b.vote_average || 0) - (a.vote_average || 0));
    }
    render(result);
  }

  async function load(append = false) {
    const current = ++requestNumber;
    if (!append) {
      page = 1;
      grid.innerHTML = `<div class="message">Loading movies and series...</div>`;
    } else {
      page++;
    }

    try {
      let results = [];
      const ranking = filter === "top" ? "top_rated" : "popular";

      if (query) {
        if (type === "all" || type === "movie") {
          const data = await api("/search/movie", {query, page});
          results.push(...(data.results || []).map(x => ({...x, media_type:"movie"})));
        }
        if (type === "all" || type === "tv") {
          const data = await api("/search/tv", {query, page});
          results.push(...(data.results || []).map(x => ({...x, media_type:"tv"})));
        }
      } else {
        if (type === "all" || type === "movie") {
          const data = await api("/movie/" + ranking, {page});
          results.push(...(data.results || []).map(x => ({...x, media_type:"movie"})));
        }
        if (type === "all" || type === "tv") {
          const data = await api("/tv/" + ranking, {page});
          results.push(...(data.results || []).map(x => ({...x, media_type:"tv"})));
        }
      }

      if (current !== requestNumber) return;

      // Prioritize Venom in the mixed movie/series library.
      if (!append && !query && (type === "all" || type === "movie")) {
        try {
          const data = await api("/search/movie", {query:"Venom"});
          const venom = (data.results || []).find(x => /venom/i.test(x.title || ""));
          if (venom && current === requestNumber) {
            results = results.filter(x => !(x.media_type === "movie" && x.id === venom.id));
            results.unshift({...venom, media_type:"movie"});
          }
        } catch (e) {}
      }

      if (current !== requestNumber) return;
      items = append ? items.concat(results) : results;
      applyFilter();
    } catch (e) {
      if (current === requestNumber) {
        grid.innerHTML = `<div class="message">Could not load the library. Check your connection and try again.<br><button class="secondary" onclick="location.reload()">Retry</button></div>`;
      }
    }
  }

  function saveFavorites() {
    localStorage.setItem("notwin_favorites", JSON.stringify([...favorites]));
  }

  function toggleFavorite(key) {
    if (favorites.has(key)) favorites.delete(key);
    else favorites.add(key);
    saveFavorites();
    applyFilter();
  }

  grid.addEventListener("click", event => {
    const fav = event.target.closest("[data-fav]");
    if (fav) {
      event.stopPropagation();
      toggleFavorite(fav.dataset.fav);
      return;
    }

    const article = event.target.closest("[data-key]");
    if (!article) return;
    const item = displayed.find(x => keyOf(x) === article.dataset.key);
    if (!item) return;

    // Send the selected movie/series to the existing watch page.
    // watch.html must later be updated to handle both types correctly.
    location.href = `watch.html?id=${encodeURIComponent(item.id)}&type=${encodeURIComponent(item.media_type)}`;
  });

  grid.addEventListener("keydown", event => {
    if (event.key !== "Enter") return;
    const article = event.target.closest("[data-key]");
    if (!article) return;
    const item = displayed.find(x => keyOf(x) === article.dataset.key);
    if (item) {
      location.href = `watch.html?id=${encodeURIComponent(item.id)}&type=${encodeURIComponent(item.media_type)}`;
    }
  });

  document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => {
      type = button.dataset.type;
      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === button));
      document.querySelectorAll(".bottom-nav button").forEach(x =>
        x.classList.toggle("active",
          (type === "all" && x.dataset.bottom === "home") || x.dataset.bottom === type
        )
      );
      document.getElementById("sectionTitle").textContent =
        type === "movie" ? "Popular Movies" :
        type === "tv" ? "Popular Series" : "Most Popular";
      load();
    });
  });

  document.querySelectorAll(".filter").forEach(button => {
    button.addEventListener("click", () => {
      filter = button.dataset.filter;
      document.querySelectorAll(".filter").forEach(x => x.classList.toggle("active", x === button));
      if (filter === "favorites") applyFilter();
      else load();
    });
  });

  document.querySelectorAll(".bottom-nav button").forEach(button => {
    button.addEventListener("click", () => {
      const target = button.dataset.bottom;
      document.querySelectorAll(".bottom-nav button").forEach(x => x.classList.toggle("active", x === button));

      if (target === "favorites") {
        filter = "favorites";
        document.querySelectorAll(".filter").forEach(x => x.classList.toggle("active", x.dataset.filter === "favorites"));
        document.getElementById("sectionTitle").textContent = "Favorites";
        applyFilter();
        return;
      }

      type = target === "home" ? "all" : target;
      filter = "popular";
      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x.dataset.type === type));
      document.querySelectorAll(".filter").forEach(x => x.classList.toggle("active", x.dataset.filter === "popular"));
      document.getElementById("sectionTitle").textContent =
        type === "movie" ? "Popular Movies" :
        type === "tv" ? "Popular Series" : "Most Popular";
      load();
    });
  });

  document.getElementById("favoritesButton").addEventListener("click", () => {
    filter = "favorites";
    document.querySelectorAll(".filter").forEach(x => x.classList.toggle("active", x.dataset.filter === "favorites"));
    document.getElementById("sectionTitle").textContent = "Favorites";
    applyFilter();
    document.getElementById("library").scrollIntoView({behavior:"smooth"});
  });

  searchInput.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      query = searchInput.value.trim();
      load();
    }, 400);
  });

  document.getElementById("loadMore").addEventListener("click", () => {
    if (filter !== "favorites") load(true);
  });

  document.getElementById("exploreButton").addEventListener("click", () => {
    document.getElementById("library").scrollIntoView({behavior:"smooth"});
  });

  load();
})();
</script>
</body>
        </html>
