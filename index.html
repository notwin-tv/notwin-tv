
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080610">
<title>NOTWIN TV</title>
<style>
:root{--bg:#080610;--panel:#120e20;--purple:#9b6cff;--text:#f7f1ff;--muted:#a99dbb;--line:#ffffff14}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}
button,input{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 5%;background:#080610ed;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;text-decoration:none;color:white}
.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(140deg,#b18aff,#5222a0)}
.brand span{color:var(--purple)}
.btn,.secondary{border:1px solid var(--line);background:#ffffff08;color:white;padding:10px 14px;border-radius:12px}
.primary{background:linear-gradient(135deg,#a87aff,#7046cf);border:0;color:white;padding:13px 18px;border-radius:12px;font-weight:bold}
button:disabled{opacity:.55;cursor:wait}
main{max-width:1250px;margin:auto;padding:22px 5% 95px}
.hero{min-height:320px;padding:28px;display:flex;align-items:center;border:1px solid #a477ff25;border-radius:24px;background:linear-gradient(90deg,#080610ef,#10091c88),linear-gradient(0deg,#080610,transparent),url("sakura-bg.png") center/cover no-repeat}
.hero>div{max-width:570px}.eyebrow,.pill{font-size:12px;color:#d5bdff;border:1px solid #9b6cff45;background:#9b6cff19;border-radius:99px;padding:7px 11px}
.hero h1{font-size:clamp(32px,6vw,56px);margin:18px 0 12px}.hero h1 span{color:#b99aff}
.hero p{color:#d0c5dc;line-height:1.9}
.search{display:flex;gap:8px;margin:22px 0}
.search input{flex:1;min-width:0;background:#130e20;border:1px solid var(--line);border-radius:13px;padding:14px;color:white}
.section{margin-top:28px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-head h2{font-size:21px;margin:0}.section-head p{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 0 15px}
.filters button{white-space:nowrap;background:#ffffff08;border:1px solid var(--line);color:#c8bdd6;border-radius:99px;padding:9px 14px}
.filters button.active{background:#8e5df32b;border-color:var(--purple);color:white}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}
.card{min-width:0;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:var(--panel);cursor:pointer;transition:transform .18s,border-color .18s}
.card:hover{transform:translateY(-3px);border-color:#9b6cff80}
.card:focus-visible{outline:2px solid var(--purple);outline-offset:3px}
.poster{aspect-ratio:2/2.8;background:#201530}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.placeholder{height:100%;min-height:150px;display:grid;place-items:center;color:#b99aff;font-size:38px}
.info{padding:10px}.title{font-size:13px;line-height:1.5;font-weight:bold;min-height:39px}
.meta,.rating{font-size:11px;color:var(--muted);margin-top:7px}
.rating{color:#f4cf83}
.description{font-size:11px;color:#c9bdd7;line-height:1.6;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fav{position:absolute;top:7px;left:7px;z-index:2;border:1px solid #ffffff25;background:#080610df;color:white;border-radius:50%;width:33px;height:33px;font-size:18px}
.fav.saved{color:#ff78ad}.lang{position:absolute;right:7px;top:7px;background:#080610df;border-radius:7px;padding:5px;font-size:10px}
.status{text-align:center;color:var(--muted);padding:30px 10px;line-height:1.9}
.status strong{display:block;color:white}
.load{text-align:center;margin:20px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:9;display:flex;justify-content:center;background:#080610ed;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.bottom button{flex:1;max-width:180px;background:transparent;border:0;color:var(--muted);padding:9px}
.bottom button.active{color:#d8c6ff;background:#9b6cff1d;border-radius:10px}
footer{text-align:center;color:#786b89;font-size:11px;margin:28px 0}
footer a{color:#b99aff}
@media(max-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:700px){header{padding:10px 4%}main{padding:15px 4% 90px}.hero{min-height:285px;padding:20px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.info{padding:8px}.title{font-size:12px}.search{flex-wrap:wrap}.search .primary{width:100%}}
@media(max-width:390px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<a class="brand" href="#" id="homeLink">
<div class="logo">NT</div><div>NOTWIN <span>TV</span></div>
</a>
<div><button class="btn" id="searchTop" aria-label="البحث">⌕</button> <button class="btn" id="favTop" aria-label="المفضلة">♡</button></div>
</header>

<main>
<section class="hero"><div>
<span class="eyebrow">YOUR NEXT STORY STARTS HERE</span>
<h1>عالمك، <span>قصتك.</span></h1>
<p>اكتشف المسلسلات والأفلام الآسيوية، وابدأ من صفحة المسلسل بضغطة واحدة.</p>

<button class="primary" id="searchBtn">بحث</button>
</div>

<section class="section">
<div class="section-head">
<div><h2 id="heading">اكتشف المسلسلات</h2><p id="subheading">بيانات من مكتبة TVmaze</p></div>

</div>

<div class="filters" id="filters">
<button class="active" data-f="all">الكل</button>
<button data-f="Korean">كوري</button>
<button data-f="Japanese">ياباني</button>
<button data-f="Chinese">صيني</button>
<button data-f="Drama">دراما</button>
<button data-f="Romance">رومانسي</button>
<button data-f="Action">أكشن</button>
<button data-f="Thriller">تشويق</button>
<button data-f="Fantasy">خيال</button>
<button data-f="School">مدرسي</button>
</div>

<div id="status" class="status"><strong>جارٍ تحميل المكتبة...</strong>لحظة من فضلك.</div>

<p id="loadText"></p>
</div>
</section>

<footer>معلومات المسلسلات من <a href="https://www.tvmaze.com/api" target="_blank" rel="noopener">TVmaze</a>. معرّفات المسلسلات من TMDB. التوفر يعتمد على المصادر الخارجية.</footer>
</main>

<nav class="bottom">
<button class="active" id="navHome">⌂<br>الرئيسية</button>
<button id="navSearch">⌕<br>اكتشف</button>
<button id="navFav">♡<br>المفضلة</button>
</nav>

<script>
"use strict";

const API="https://api.tvmaze.com";
const TMDB_API="https://api.themoviedb.org/3";

/*
  ملاحظة:
  مفتاح TMDB في كود الموقع العام سيكون مرئيًا للزوار.
  لا تضع هنا أي مفتاح سري أو كلمة مرور.
*/
const TMDB_KEY="26c5ad9f51818e110945285552c11a75";
const MAX_PAGES=40;
const $=id=>document.getElementById(id);

let shows=[],page=0,filter="all",mode="library",results=[];
let loading=false,end=false,searchToken=0,categoryToken=0;
let favs=new Set();
let watchCache=new Map();
let openingShowId=null;

try{
  favs=new Set(JSON.parse(localStorage.getItem("notwin-tv-saved-v6")||"[]").map(Number));
}catch(e){}

function esc(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function plain(html){
  const div=document.createElement("div");
  div.innerHTML=html||"";
  return (div.textContent||"").trim();
}

function imageOf(show){
  return show?.image?.original||show?.image?.medium||"";
}

function yearOf(show){
  return show?.premiered?.slice(0,4)||"غير معروف";
}

function languageName(language){
  return ({
    Korean:"كوري",Japanese:"ياباني",Chinese:"صيني",
    English:"إنجليزي",Turkish:"تركي",Spanish:"إسباني",
    Arabic:"عربي",French:"فرنسي",Hindi:"هندي"
  })[language]||language||"غير محدد";
}

async function api(path){
  const r=await fetch(API+path);
  if(!r.ok)throw Error("TVmaze HTTP "+r.status);
  return r.json();
}

function normalize(item){return item?.show||item}

function merge(items){
  const m=new Map(shows.map(s=>[s.id,s]));
  items.map(normalize).filter(s=>s?.id).forEach(s=>m.set(s.id,s));
  shows=[...m.values()];
}

function matches(s,f){
  if(["Korean","Japanese","Chinese"].includes(f))
    return String(s.language||"").toLowerCase()===f.toLowerCase();

  if(f==="School")
    return (s.genres||[]).some(g=>/school|teen|youth/i.test(g))||
      /school|high school|teen|youth/i.test(plain((s.name||"")+" "+(s.summary||"")));

  if(f==="all")return true;
  return (s.genres||[]).some(g=>g.toLowerCase()===f.toLowerCase());
}

function filtered(list){
  let a=list.filter(s=>filter==="all"||matches(s,filter));
  if(mode==="favorites")a=a.filter(s=>favs.has(s.id));
  return a;
}

function setStatus(title,msg=""){
  const b=$("status");
  b.hidden=false;
  b.replaceChildren();
  const st=document.createElement("strong");
  st.textContent=title;
  b.append(st,document.createTextNode(msg));
}

function hideStatus(){$("status").hidden=true}

function render(list=shows){
  const items=filtered(list);
  $("grid").replaceChildren();

  if(!items.length){
    setStatus(mode==="favorites"?"المفضلة فارغة":"ما لقيناش نتائج",
      " جرّب تصنيفًا آخر أو ابحث باسم المسلسل.");
    $("count").textContent="0 نتيجة";
    return;
  }

  hideStatus();
  const frag=document.createDocumentFragment();
  items.forEach(s=>frag.appendChild(makeCard(s)));
  $("grid").appendChild(frag);
  $("count").textContent=items.length+" نتيجة";
}

/* تطبيع الأسماء لتسهيل مطابقة نتائج TMDB */
function normalizeName(value){
  return String(value||"")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\p{L}\p{N}]+/gu," ")
    .trim();
}

/*
  تحويل مسلسل TVmaze إلى معرّف TMDB.
  لا نستعمل رقم TVmaze كأنه رقم TMDB.
*/
async function findTmdbShow(show){
  if(watchCache.has(show.id))return watchCache.get(show.id);

  const task=(async()=>{
    const url=new URL(TMDB_API+"/search/tv");
    url.searchParams.set("api_key",TMDB_KEY);
    url.searchParams.set("query",show.name||"");
    if(show.language==="Korean")url.searchParams.set("language","en-US");

    const response=await fetch(url.toString());
    if(!response.ok){
      if(response.status===401)throw Error("مفتاح TMDB غير صالح أو غير مفعّل.");
      throw Error("تعذر الاتصال بـ TMDB ("+response.status+").");
    }

    const data=await response.json();
    const candidates=data.results||[];
    if(!candidates.length)throw Error("لم نجد هذا المسلسل في TMDB.");

    const wanted=normalizeName(show.name);
    const exact=candidates.find(item=>
      normalizeName(item.name)===wanted||
      normalizeName(item.original_name)===wanted
    );

    /*
      إذا لم توجد مطابقة واضحة، لا نختار نتيجة عشوائية
      عندما تكون هناك عدة نتائج متشابهة.
    */
    const chosen=exact||(candidates.length===1?candidates[0]:null);

    if(!chosen){
      throw Error("وجدنا عدة أعمال متشابهة. يلزم ربط هذا المسلسل بمعرّف TMDB يدويًا.");
    }

    return {
      id:chosen.id,
      name:chosen.name||show.name,
      original_name:chosen.original_name||"",
      poster_path:chosen.poster_path||null
    };
  })();

  watchCache.set(show.id,task);

  try{
    return await task;
  }catch(error){
    watchCache.delete(show.id);
    throw error;
  }
}

async function openWatch(show){
  if(openingShowId!==null)return;

  openingShowId=show.id;
  const card=[...document.querySelectorAll(".card")]
    .find(el=>el.getAttribute("aria-label")==="شاهد "+(show.name||"المسلسل"));

  if(card){
    card.style.opacity=".65";
    card.setAttribute("aria-busy","true");
  }

  $("count").textContent="جارٍ الربط...";
  try{
    const tmdb=await findTmdbShow(show);

    const params=new URLSearchParams({
      id:String(tmdb.id),
      title:show.name||tmdb.name,
      type:"tv",
      season:"1",
      episode:"1"
    });

    window.location.href="./watch.html?"+params.toString();
  }catch(error){
    console.error("NOTWIN TV TMDB link error:",error);
    alert(
      (error.message||"تعذر إيجاد معرّف المسلسل.")+
      "\n\nيمكنك تجربة مسلسل آخر أو إضافة معرّف TMDB الصحيح لهذا العمل."
    );
    $("count").textContent="جاهز";
  }finally{
    openingShowId=null;
    if(card){
      card.style.opacity="";
      card.removeAttribute("aria-busy");
    }
  }
}

function makeCard(show){
  const card=document.createElement("article");
  card.className="card";
  card.tabIndex=0;
  card.setAttribute("role","link");
  card.setAttribute("aria-label","شاهد "+(show.name||"المسلسل"));

  const image=imageOf(show);
  const saved=favs.has(show.id);
  const genres=(show.genres||[]).slice(0,2).join(" • ")||languageName(show.language);

  card.innerHTML=`
    <button class="fav ${saved?"saved":""}" aria-label="${saved?"إزالة من المفضلة":"إضافة للمفضلة"}">${saved?"♥":"♡"}</button>
    <span class="lang">${esc(languageName(show.language))}</span>
    <div class="poster">
      ${image?`<img loading="lazy" alt="${esc(show.name||"غلاف المسلسل")}" src="${esc(image)}">`:'<div class="placeholder">NT</div>'}
    </div>
    <div class="info">
      <div class="title">${esc(show.name||"بدون عنوان")}</div>
      <div class="meta">${esc(yearOf(show))} • ${esc(genres)}</div>
      <div class="rating">★ ${esc(show.rating?.average??"—")}</div>
      <div class="description">${esc(plain(show.summary)||"لا يوجد وصف متاح.")}</div>
    </div>`;

  const img=card.querySelector("img");
  if(img)img.onerror=()=>{
    const p=img.parentElement;
    p.innerHTML='<div class="placeholder">NT</div>';
  };

  card.querySelector(".fav").onclick=e=>{
    e.stopPropagation();
    toggleFavorite(show);
  };

  card.onclick=()=>openWatch(show);
  card.onkeydown=e=>{
    if(e.key==="Enter"||e.key===" "){
      e.preventDefault();
      openWatch(show);
    }
  };

  return card;
}

function toggleFavorite(show){
  if(favs.has(show.id))favs.delete(show.id);
  else favs.add(show.id);

  try{
    localStorage.setItem("notwin-tv-saved-v6",JSON.stringify([...favs]));
  }catch(e){}

  render(mode==="search"||mode==="category"?results:shows);
}

async function loadLibrary(reset=false){
  if(loading||(end&&!reset))return;

  loading=true;
  $("loadMore").disabled=true;
  $("loadMore").textContent="جارٍ التحميل...";

  if(reset){
    page=0;end=false;shows=[];results=[];
    $("grid").replaceChildren();
    setStatus("جارٍ تحميل المكتبة..."," يتم جلب المسلسلات.");
  }

  try{
    const data=await api("/shows?page="+page);

    if(!Array.isArray(data)||!data.length){
      end=true;
      if(!shows.length)setStatus("وصلنا لنهاية البيانات");
      else render(shows);
      return;
    }

    merge(data);
    page++;
    mode="library";
    filter="all";
    results=[];
    $("loadWrap").hidden=false;
    $("heading").textContent="اكتشف المسلسلات";
    $("subheading").textContent="حمّل صفحات إضافية لتوسيع المكتبة";
    render(shows);
    $("loadText").textContent="تم تحميل "+shows.length+" مسلسل";
  }catch(e){
    console.error(e);
    if(!shows.length)setStatus("تعذّر الاتصال بالمكتبة"," تحقق من الإنترنت وحاول مجددًا.");
    else render(shows);
  }finally{
    loading=false;
    $("loadMore").disabled=false;
    $("loadMore").textContent="تحميل المزيد";
  }
}

async function searchShows(){
  const q=$("query").value.trim();
  const token=++searchToken;

  if(!q){goHome();return}

  categoryToken++;
  mode="search";
  filter="all";
  results=[];
  $("heading").textContent="نتائج البحث";
  $("subheading").textContent="نتائج من TVmaze";
  $("loadWrap").hidden=true;
  $("grid").replaceChildren();
  setStatus("جارٍ البحث..."," نبحث عن المسلسلات.");

  try{
    const data=await api("/search/shows?q="+encodeURIComponent(q));
    if(token!==searchToken)return;

    results=data.map(normalize).filter(Boolean);
    merge(results);
    render(results);
  }catch(e){
    if(token===searchToken)setStatus("فشل البحث"," تحقق من الإنترنت وجرب مجددًا.");
  }
}

async function loadCategory(f){
  const token=++categoryToken;
  searchToken++;
  filter=f;
  mode="category";
  results=[];
  $("loadWrap").hidden=true;

  const names={
    Korean:"المسلسلات الكورية",Japanese:"المسلسلات اليابانية",
    Chinese:"المسلسلات الصينية",Drama:"مسلسلات الدراما",
    Romance:"المسلسلات الرومانسية",Action:"مسلسلات الأكشن",
    Thriller:"مسلسلات التشويق",Fantasy:"مسلسلات الخيال",
    School:"المسلسلات المدرسية"
  };

  $("heading").textContent=names[f]||"المسلسلات";
  $("subheading").textContent="البحث في مكتبة TVmaze";
  $("grid").replaceChildren();
  setStatus("جارٍ البحث في المكتبة..."," قد يستغرق ذلك بعض الوقت.");

  const found=new Map();
  let checked=0;

  try{
    for(let p=0;p<MAX_PAGES;p++){
      if(token!==categoryToken)return;

      const data=await api("/shows?page="+p);
      if(!Array.isArray(data)||!data.length)break;
      checked++;

      for(const s of data){
        if(matches(s,f))found.set(s.id,s);
      }

      $("count").textContent=found.size+" نتيجة";

      if(found.size){
        merge([...found.values()]);
        results=[...found.values()];
        render(results);
      }

      if(found.size>=60)break;
    }

    if(token!==categoryToken)return;
    results=[...found.values()];

    if(results.length){
      render(results);
      $("subheading").textContent="تم البحث في "+checked+" صفحة";
      $("loadText").textContent="لقينا "+results.length+" نتيجة.";
    }else{
      setStatus("ما لقيناش نتائج"," جرّب البحث باسم المسلسل.");
    }

    $("loadWrap").hidden=false;
    $("loadMore").textContent="العودة إلى المكتبة";
  }catch(e){
    if(token===categoryToken){
      setStatus("تعذّر تحميل التصنيف"," تحقق من الإنترنت وجرب مجددًا.");
      $("loadWrap").hidden=false;
      $("loadMore").textContent="العودة إلى المكتبة";
    }
  }finally{
    $("loadMore").disabled=false;
  }
}

async function showFavorites(){
  categoryToken++;
  searchToken++;
  mode="favorites";
  filter="all";
  results=[];
  setNav("navFav");
  $("heading").textContent="المفضلة";
  $("subheading").textContent="المسلسلات المحفوظة على هذا الجهاز";
  $("loadWrap").hidden=true;
  render(shows);

  const missing=[...favs].filter(id=>!shows.some(s=>s.id===id)).slice(0,40);

  if(missing.length){
    setStatus("جارٍ استرجاع المفضلة...","");
    const got=await Promise.allSettled(missing.map(id=>api("/shows/"+id)));
    merge(got.filter(x=>x.status==="fulfilled").map(x=>x.value));
    if(mode==="favorites")render(shows);
  }
}

function setNav(id){
  ["navHome","navSearch","navFav"].forEach(n=>
    $(n).classList.toggle("active",n===id)
  );
}

function goHome(){
  categoryToken++;
  searchToken++;
  mode="library";
  filter="all";
  results=[];
  $("query").value="";
  $("heading").textContent="اكتشف المسلسلات";
  $("subheading").textContent="بيانات من مكتبة TVmaze";
  $("loadWrap").hidden=false;
  $("loadMore").textContent="تحميل المزيد";
  setNav("navHome");

  document.querySelectorAll("[data-f]").forEach(b=>
    b.classList.toggle("active",b.dataset.f==="all")
  );

  render(shows);
  window.scrollTo({top:0,behavior:"smooth"});
}

function focusSearch(){
  setNav("navSearch");
  $("searchArea").scrollIntoView({behavior:"smooth",block:"center"});
  setTimeout(()=>$("query").focus(),200);
}

$("searchBtn").onclick=searchShows;
$("query").addEventListener("keydown",e=>{
  if(e.key==="Enter")searchShows();
});

let searchTimer;
$("query").addEventListener("input",()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    if($("query").value.trim().length>=3)searchShows();
    else if(!$("query").value.trim()&&mode==="search")goHome();
  },650);
});

$("filters").onclick=async e=>{
  const b=e.target.closest("[data-f]");
  if(!b)return;

  document.querySelectorAll("[data-f]").forEach(x=>
    x.classList.toggle("active",x===b)
  );

  if(b.dataset.f==="all"){goHome();return}
  await loadCategory(b.dataset.f);
};

$("loadMore").onclick=()=>{
  if(mode==="category"||mode==="search"||mode==="favorites"){
    goHome();
    return;
  }
  loadLibrary(false);
};

$("homeLink").onclick=e=>{e.preventDefault();goHome()};
$("navHome").onclick=goHome;
$("navSearch").onclick=focusSearch;
$("navFav").onclick=showFavorites;
$("searchTop").onclick=focusSearch;
$("favTop").onclick=showFavorites;
$("discover").onclick=focusSearch;

loadLibrary(true);
</script>
</body>
</html>
