
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>NOTWIN TV | عالم الدراما</title>
<style>
:root{--bg:#080808;--card:#141112;--red:#b51f30;--red2:#e63b4d;--text:#f8f4f4;--muted:#a99d9e;--line:#ffffff14}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid var(--line);background:#090909;position:sticky;top:0;z-index:10}
.logo{font-size:22px;font-weight:900;direction:ltr;white-space:nowrap}
.logo span{color:var(--red2)}
.header-actions{display:flex;gap:9px}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:#171314;color:white;border-radius:12px;font-size:18px;cursor:pointer}
main{max-width:1200px;margin:auto;padding:22px 4% 100px}
.hero{position:relative;min-height:290px;border:1px solid #9e263244;border-radius:22px;overflow:hidden;padding:32px;display:flex;align-items:center;background:linear-gradient(90deg,#080808 0%,#16090b 65%,#3b0c13 130%);margin-bottom:28px}
.hero:after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;background:#d3213520;filter:blur(40px);left:-30px;top:15px}
.hero-content{position:relative;z-index:1;max-width:580px}
.eyebrow{color:#f16b79;font-size:12px;letter-spacing:2px;font-weight:bold}
.hero h1{font-size:clamp(30px,5vw,49px);line-height:1.25;margin:12px 0}
.hero h1 span{color:var(--red2)}
.hero p{color:#c1b5b7;line-height:1.9;font-size:14px;max-width:500px}
.primary{border:0;background:linear-gradient(135deg,#d32b40,#8b1423);padding:13px 19px;border-radius:12px;color:white;font-weight:bold;cursor:pointer}
.secondary{border:1px solid #ffffff25;background:#171112;padding:12px 16px;border-radius:12px;color:white;cursor:pointer}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.search-wrap{display:flex;gap:9px;margin:0 0 23px}
.search-wrap input{min-width:0;flex:1;background:#131011;border:1px solid var(--line);border-radius:13px;padding:15px;color:white;outline:none}
.search-wrap input:focus{border-color:#b82b3c}
.search-wrap button{border:0;border-radius:12px;background:var(--red);color:white;padding:0 18px;cursor:pointer}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 17px}
.section-head h2{font-size:21px;margin:0;border-right:4px solid var(--red2);padding-right:12px}
.small{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;margin-bottom:8px}
.chip{flex-shrink:0;background:#151213;color:#cfc4c5;border:1px solid var(--line);border-radius:22px;padding:9px 15px;cursor:pointer}
.chip.active{background:#57121b;color:white;border-color:#a82a3a}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px 13px}
.card{min-width:0;cursor:pointer}
.poster-wrap{position:relative;overflow:hidden;aspect-ratio:2/3;border-radius:13px;background:#191415;border:1px solid #ffffff0c}
.poster{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.card:hover .poster{transform:scale(1.045)}
.rating{position:absolute;top:8px;right:8px;background:#090909dc;padding:5px 7px;border-radius:7px;font-size:11px}
.fav{position:absolute;top:7px;left:7px;width:31px;height:31px;border:0;border-radius:50%;background:#080808d9;color:white;font-size:17px;cursor:pointer}
.fav.saved{color:#ff5969}
.type{position:absolute;bottom:8px;right:8px;background:#9f1c2bdc;color:white;padding:5px 7px;border-radius:6px;font-size:10px}
.card h3{font-size:13px;line-height:1.5;margin:9px 0 4px;direction:ltr;text-align:right}
.card p{margin:0;color:var(--muted);font-size:11px}
.load-wrap{text-align:center;margin:28px 0}
.empty{grid-column:1/-1;padding:35px 15px;text-align:center;background:var(--card);border-radius:15px;color:var(--muted);line-height:1.9}
.bottom-nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#0c0a0bf5;border-top:1px solid var(--line);padding:10px 4% calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}
.nav-btn{background:none;border:0;color:#a99d9e;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;cursor:pointer}
.nav-btn span:first-child{font-size:20px}
.nav-btn.active{color:#ff5365}
footer{text-align:center;color:#6f6667;font-size:11px;padding:20px}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:600px){header{height:60px;padding:0 4%}.logo{font-size:19px}main{padding:15px 4% 95px}.hero{min-height:265px;padding:23px 19px}.hero p{font-size:13px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 10px}.card h3{font-size:12px}.section-head h2{font-size:18px}}
@media(max-width:370px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">NOTWIN <span>TV</span></a>
  <div class="header-actions">
    <button class="icon-btn" id="focusSearch" aria-label="بحث">⌕</button>
    <button class="icon-btn" id="showFavorites" aria-label="المفضلة">♡</button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-content">
      <div class="eyebrow">NOTWIN TV · YOUR NEXT OBSESSION</div>
      <h1>تستحق أن <span>تُعاش.</span></h1>
      <p>اكتشف عالمًا من القصص، من الدراما الآسيوية إلى أشهر الأفلام والمسلسلات. اختار عملك القادم وخليه ضمن قائمتك الخاصة.</p>
      <div class="hero-actions">
        <button class="primary" id="discover">اكتشف الأعمال ←</button>
        <button class="secondary" id="heroFavorites">قائمتك الخاصة ♡</button>
      </div>
    </div>
  </section>

  <div class="search-wrap" id="searchArea">
    <input id="searchInput" type="search" placeholder="ابحث عن فيلم أو مسلسل بالاسم الإنجليزي..." autocomplete="off">
    <button id="searchButton">بحث</button>
  </div>

  <div class="section-head">
    <h2 id="sectionTitle">الأعمال الرائجة</h2>
    <span class="small" id="resultCount"></span>
  </div>

  <div class="filters" id="genreFilters">
    <button class="chip active" data-genre="all">الكل</button>
    <button class="chip" data-genre="28">Action</button>
    <button class="chip" data-genre="18">Drama</button>
    <button class="chip" data-genre="10749">Romance</button>
    <button class="chip" data-genre="53">Thriller</button>
    <button class="chip" data-genre="35">Comedy</button>
    <button class="chip" data-genre="80">Crime</button>
    <button class="chip" data-genre="878">Sci-Fi</button>
    <button class="chip" data-genre="27">Horror</button>
    <button class="chip" data-genre="16">Animation</button>
  </div>

  <div class="grid" id="catalog">
    <div class="empty">جاري تحميل المكتبة...</div>
  </div>

  <div class="load-wrap">
    <button class="secondary" id="loadMore">تحميل المزيد</button>
  </div>
  <footer>NOTWIN TV · Discover your next story</footer>
</main>

<nav class="bottom-nav">
  <button class="nav-btn active" id="navHome"><span>⌂</span><span>الرئيسية</span></button>
  <button class="nav-btn" id="navSearch"><span>⌕</span><span>البحث</span></button>
  <button class="nav-btn" id="navFav"><span>♡</span><span>المفضلة</span></button>
</nav>

<script>
"use strict";

/* مفتاح TMDB */
const API_KEY = "26c5ad9f51818e110945285552c11a75";
const API = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";

const $ = id => document.getElementById(id);
const catalog = $("catalog");
let page = 1;
let mode = "trending";
let activeGenre = "all";
let searchTerm = "";
let busy = false;
let requestId = 0;
let results = [];
let favorites = loadFavorites();

function loadFavorites(){
  try{
    const value = JSON.parse(localStorage.getItem("notwin-tv-favorites") || "[]");
    return Array.isArray(value) ? value : [];
  }catch(e){return []}
}
function saveFavorites(){
  localStorage.setItem("notwin-tv-favorites", JSON.stringify(favorites));
}
function titleOf(item){return item.title || item.name || "Untitled"}
function yearOf(item){return (item.release_date || item.first_air_date || "").slice(0,4)}
function typeOf(item){return item.media_type || (item.title ? "movie" : "tv")}
function isFavorite(item){return favorites.some(x => x.id === item.id && x.type === typeOf(item))}
function escapeHTML(s){
  return String(s ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
async function api(path, params={}){
  const url = new URL(API + path);
  url.searchParams.set("api_key",API_KEY);
  url.searchParams.set("language","en-US");
  Object.entries(params).forEach(([k,v])=>{
    if(v !== undefined && v !== null && v !== "") url.searchParams.set(k,v);
  });
  const response = await fetch(url);
  if(!response.ok) throw new Error("TMDB API error " + response.status);
  return response.json();
}

function setActiveNav(id){
  ["navHome","navSearch","navFav"].forEach(key=>{
    $(key).classList.toggle("active",key===id);
  });
}
function setActiveGenre(genre){
  activeGenre = String(genre);
  document.querySelectorAll(".chip").forEach(button=>{
    button.classList.toggle("active",button.dataset.genre===activeGenre);
  });
}
function render(items, append=false){
  if(!append) catalog.innerHTML = "";
  if(!items.length && !append){
    catalog.innerHTML = '<div class="empty">ما لقيناش أعمال هنا. جرّب اسمًا آخر بالإنجليزية.</div>';
    $("resultCount").textContent = "0";
    return;
  }
  const frag = document.createDocumentFragment();
  items.forEach(item=>{
    if(!item || !item.id || typeOf(item)==="person") return;
    const type = typeOf(item);
    const title = titleOf(item);
    const year = yearOf(item);
    const saved = isFavorite(item);
    const card = document.createElement("article");
    card.className = "card";
    card.tabIndex = 0;
    card.setAttribute("role","link");
    card.setAttribute("aria-label","Open "+title);
    const poster = item.poster_path ? IMG+item.poster_path : "";
    card.innerHTML = `
      <div class="poster-wrap">
        ${poster ? `<img class="poster" loading="lazy" src="${poster}" alt="${escapeHTML(title)}">` : `<div class="poster" style="display:grid;place-items:center;color:#877">No Poster</div>`}
        <span class="rating">★ ${Number(item.vote_average||0).toFixed(1)}</span>
        <button class="fav ${saved?"saved":""}" aria-label="المفضلة" title="أضف للمفضلة">${saved?"♥":"♡"}</button>
        <span class="type">${type==="movie"?"MOVIE":"SERIES"}</span>
      </div>
      <h3>${escapeHTML(title)}</h3>
      <p>${escapeHTML(year || "—")}</p>`;
    const open = ()=>{location.href="watch.html?id="+encodeURIComponent(item.id)+"&type="+type};
    card.addEventListener("click",open);
    card.addEventListener("keydown",event=>{
      if(event.key==="Enter") open();
    });
    const favButton = card.querySelector(".fav");
    favButton.addEventListener("click",event=>{
      event.stopPropagation();
      toggleFavorite(item);
    });
    frag.appendChild(card);
  });
  catalog.appendChild(frag);
  $("resultCount").textContent = mode==="favorites" ? favorites.length+" محفوظ" : "";
}

function toggleFavorite(item){
  const type = typeOf(item);
  const exists = favorites.some(x=>x.id===item.id && x.type===type);
  if(exists){
    favorites = favorites.filter(x=>!(x.id===item.id && x.type===type));
  }else{
    favorites.unshift({
      id:item.id,type,title:titleOf(item),
      poster_path:item.poster_path||"",
      vote_average:item.vote_average||0,
      release_date:item.release_date||item.first_air_date||"",
      media_type:type
    });
  }
  saveFavorites();
  if(mode==="favorites") showFavorites();
  else render(results);
}

async function loadCatalog(append=false){
  if(busy) return;
  busy = true;
  const myRequest = ++requestId;
  if(!append){
    page = 1;
    catalog.innerHTML='<div class="empty">جاري تحميل الأعمال...</div>';
  }
  try{
    let data;
    if(mode==="search"){
      data = await api("/search/multi",{query:searchTerm,page,include_adult:"false"});
    }else if(mode==="genre"){
      const movieData = await api("/discover/movie",{with_genres:activeGenre,sort_by:"popularity.desc",page});
      const tvData = await api("/discover/tv",{with_genres:activeGenre,sort_by:"popularity.desc",page});
      data = {results:[
        ...(movieData.results||[]).map(x=>({...x,media_type:"movie"})),
        ...(tvData.results||[]).map(x=>({...x,media_type:"tv"}))
      ].sort((a,b)=>(b.popularity||0)-(a.popularity||0))};
    }else{
      data = await api("/trending/all/week",{page});
    }
    if(myRequest!==requestId) return;
    let items = (data.results||[]).filter(x=>typeOf(x)!=="person");
    if(mode==="search") items=items.filter(x=>x.media_type==="movie"||x.media_type==="tv");
    if(append) results = results.concat(items);
    else results = items;
    render(items,append);
    $("loadMore").style.display = (data.results||[]).length ? "inline-block" : "none";
  }catch(error){
    if(!append){
      catalog.innerHTML='<div class="empty">ما قدرناش نحمّل المكتبة. تأكد من الاتصال ومفتاح TMDB ثم أعد المحاولة.</div>';
    }
  }finally{
    busy = false;
  }
}

function runSearch(){
  const value = $("searchInput").value.trim();
  if(!value) return;
  searchTerm = value;
  mode = "search";
  setActiveGenre("all");
  $("sectionTitle").textContent = "نتائج البحث";
  setActiveNav("navSearch");
  loadCatalog();
}
function showHome(){
  mode="trending";
  searchTerm="";
  $("searchInput").value="";
  $("sectionTitle").textContent="الأعمال الرائجة";
  $("genreFilters").style.display="flex";
  setActiveGenre("all");
  setActiveNav("navHome");
  loadCatalog();
}
function showFavorites(){
  mode="favorites";
  $("sectionTitle").textContent="قائمتك الخاصة";
  $("genreFilters").style.display="none";
  setActiveNav("navFav");
  results=favorites.map(item=>({...item,media_type:item.type}));
  render(results);
  $("loadMore").style.display="none";
}
function showGenre(genre){
  mode="genre";
  searchTerm="";
  $("searchInput").value="";
  $("sectionTitle").textContent="اكتشف حسب النوع";
  $("genreFilters").style.display="flex";
  setActiveGenre(genre);
  setActiveNav("navHome");
  loadCatalog();
}

$("searchButton").addEventListener("click",runSearch);
$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")runSearch()});
$("focusSearch").addEventListener("click",()=>{
  $("searchArea").scrollIntoView({behavior:"smooth"});
  $("searchInput").focus();
});
$("discover").addEventListener("click",()=>{
  $("catalog").scrollIntoView({behavior:"smooth"});
});
$("showFavorites").addEventListener("click",showFavorites);
$("heroFavorites").addEventListener("click",showFavorites);
$("navHome").addEventListener("click",showHome);
$("navSearch").addEventListener("click",()=>{
  $("searchArea").scrollIntoView({behavior:"smooth"});
  $("searchInput").focus();
  setActiveNav("navSearch");
});
$("navFav").addEventListener("click",showFavorites);
$("loadMore").addEventListener("click",()=>{
  if(mode==="favorites") return;
  page++;
  loadCatalog(true);
});
document.querySelectorAll(".chip").forEach(button=>{
  button.addEventListener("click",()=>{
    const genre=button.dataset.genre;
    if(genre==="all") showHome();
    else showGenre(genre);
  });
});

loadCatalog();
</script>
</body>
</html>
