<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>NOTWIN TV | عالم المسلسلات والأفلام</title>
<style>
:root{
  --bg:#090909;
  --panel:#141414;
  --panel2:#1c1c1c;
  --red:#e50914;
  --red2:#ff2934;
  --text:#f5f5f5;
  --muted:#a5a5a5;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
header{
  position:sticky;top:0;z-index:10;
  background:rgba(9,9,9,.96);
  border-bottom:1px solid #252525;
  backdrop-filter:blur(12px);
}
.nav{
  max-width:1250px;margin:auto;padding:14px 18px;
  display:flex;align-items:center;gap:18px;
}
.logo{font-size:25px;font-weight:900;white-space:nowrap}
.logo span{color:var(--red)}
.search{flex:1;position:relative}
.search input{
  width:100%;padding:12px 15px;border-radius:10px;
  border:1px solid #333;background:#171717;color:white;outline:none;
}
.search input:focus{border-color:var(--red)}
.navbtn,.tab,.filterbtn{
  border:1px solid #333;background:#171717;color:#ddd;
  padding:10px 13px;border-radius:9px;white-space:nowrap;
}
.navbtn:hover,.tab.active,.filterbtn.active{
  background:var(--red);border-color:var(--red);color:white;
}
.hero{
  max-width:1250px;margin:20px auto;padding:0 18px;
}
.hero-inner{
  min-height:280px;border-radius:18px;overflow:hidden;
  position:relative;display:flex;align-items:end;
  background:linear-gradient(0deg,#090909 0%,rgba(0,0,0,.5) 55%,rgba(0,0,0,.08)),
  linear-gradient(110deg,#3b080b,#161616 55%,#29090b);
  border:1px solid #2b2020;
}
.hero-content{padding:30px;max-width:650px}
.tag{
  display:inline-block;background:var(--red);color:white;
  border-radius:5px;padding:5px 9px;font-size:12px;font-weight:bold;
}
.hero h1{font-size:clamp(27px,5vw,44px);margin:14px 0 10px}
.hero p{color:#ccc;line-height:1.8;margin:0 0 18px}
.primary{
  border:0;background:var(--red);color:white;
  padding:12px 18px;border-radius:9px;font-weight:bold;
}
.primary:hover{background:var(--red2)}
main{max-width:1250px;margin:auto;padding:0 18px 90px}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin:25px 0 16px;
}
.section-head h2{font-size:21px;margin:0}
.section-head h2:before{
  content:"";display:inline-block;width:4px;height:21px;
  background:var(--red);margin-left:10px;vertical-align:middle;border-radius:3px;
}
.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters{margin-bottom:18px}
.grid{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px;
}
.card{
  min-width:0;background:var(--panel);border:1px solid #242424;
  border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s;
}
.card:hover{transform:translateY(-4px);border-color:#6e2024}
.poster{
  position:relative;aspect-ratio:2/3;background:#202020;overflow:hidden;
}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .missing{
  height:100%;display:flex;align-items:center;justify-content:center;
  padding:12px;text-align:center;color:#777;
}
.rating{
  position:absolute;top:8px;right:8px;background:#000d;
  padding:5px 7px;border-radius:5px;font-size:12px;
}
.kind{
  position:absolute;bottom:8px;right:8px;background:var(--red);
  padding:5px 7px;border-radius:5px;font-size:11px;
}
.favorite{
  position:absolute;top:8px;left:8px;border:0;
  background:#000b;color:white;width:34px;height:34px;
  border-radius:50%;font-size:18px;
}
.favorite.on{color:#ff3440}
.card-info{padding:11px}
.card-info h3{
  font-size:14px;margin:0 0 8px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.meta{color:var(--muted);font-size:12px;display:flex;gap:7px;flex-wrap:wrap}
.empty,.loading,.error{
  padding:35px 15px;text-align:center;color:var(--muted);
  grid-column:1/-1;line-height:1.8;
}
.loadrow{text-align:center;margin:25px 0}
footer{
  border-top:1px solid #222;text-align:center;padding:24px 15px;
  color:#777;font-size:13px;
}
.bottom{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:15;
  background:#101010f5;border-top:1px solid #303030;
  padding:9px 6px calc(9px + env(safe-area-inset-bottom));
  justify-content:space-around;
}
.bottom button{
  background:none;border:0;color:#aaa;font-size:12px;
  display:flex;flex-direction:column;gap:4px;align-items:center;
}
.bottom button.active{color:var(--red)}
.modal{
  display:none;position:fixed;inset:0;z-index:30;
  background:#000d;overflow:auto;padding:22px;
  align-items:center;justify-content:center;
}
.modal.open{display:flex}
.modal-box{
  width:min(700px,100%);background:#151515;border:1px solid #333;
  border-radius:15px;overflow:hidden;position:relative;
}
.modal-top{display:grid;grid-template-columns:170px 1fr;gap:20px;padding:22px}
.modal-top img{width:100%;border-radius:9px}
.modal-info h2{margin:8px 0}
.modal-info p{color:#ccc;line-height:1.8;font-size:14px}
.close{
  position:absolute;top:10px;left:10px;background:#000b;color:white;
  border:1px solid #555;border-radius:50%;width:35px;height:35px;font-size:20px;
}
.modal-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.secondary{
  background:#252525;color:white;border:1px solid #444;
  padding:11px 14px;border-radius:8px;text-decoration:none;
}
@media(max-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:700px){
  .nav{gap:10px;padding:12px}
  .logo{font-size:21px}
  .navbtn{display:none}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  main{padding:0 12px 95px}
  .hero{padding:0 12px}
  .hero-inner{min-height:245px}
  .hero-content{padding:20px}
  .hero p{font-size:13px}
  .card-info{padding:8px}
  .card-info h3{font-size:12px}
  .meta{font-size:11px}
  .bottom{display:flex}
  .modal{padding:10px}
  .modal-top{grid-template-columns:105px 1fr;gap:13px;padding:16px}
  .modal-info h2{font-size:18px}
  .modal-info p{font-size:12px}
}
@media(max-width:370px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="nav">
    <div class="logo">NOTWIN <span>TV</span></div>
    <div class="search">
      <input id="searchInput" type="search" placeholder="ابحث عن فيلم أو مسلسل..." autocomplete="off">
    </div>
    <button class="navbtn" id="favoritesNav">♥ المفضلة</button>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-content">
      <span class="tag">NOTWIN TV ORIGINAL EXPERIENCE</span>
      <h1>عالمك من الأفلام والمسلسلات</h1>
      <p>اكتشف أعمالًا جديدة، تصفّح الأفلام والمسلسلات، وابحث عن المفضلة تاعك في مكان واحد.</p>
      <button class="primary" id="exploreBtn">اكتشف المكتبة ←</button>
    </div>
  </div>
</section>

<main id="catalog">
  <div class="section-head">
    <h2 id="sectionTitle">الأكثر شهرة</h2>
    <div class="tabs">
      <button class="tab active" data-type="all">الكل</button>
      <button class="tab" data-type="movie">أفلام</button>
      <button class="tab" data-type="tv">مسلسلات</button>
    </div>
  </div>

  <div class="filters">
    <button class="filterbtn active" data-filter="popular">الأكثر شهرة</button>
    <button class="filterbtn" data-filter="top">الأعلى تقييماً</button>
    <button class="filterbtn" data-filter="favorites">المفضلة ♥</button>
  </div>

  <div id="grid" class="grid">
    <div class="loading">جاري تحميل مكتبة NOTWIN TV...</div>
  </div>
  <div class="loadrow">
    <button id="loadMore" class="secondary">تحميل المزيد</button>
  </div>
</main>

<footer>NOTWIN TV © <span id="year"></span> — مكتبتك الترفيهية</footer>

<nav class="bottom">
  <button class="active" data-bottom="all"><span>⌂</span>الرئيسية</button>
  <button data-bottom="movie"><span>▣</span>أفلام</button>
  <button data-bottom="tv"><span>▤</span>مسلسلات</button>
  <button data-bottom="favorites"><span>♥</span>المفضلة</button>
</nav>

<div class="modal" id="detailsModal">
  <div class="modal-box">
    <button class="close" id="closeModal" aria-label="إغلاق">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // مفتاح TMDB الذي وضعته في نسختك السابقة
  const TMDB_KEY = "26c5ad9f51818e110945285552c11a75";
  const TMDB = "https://api.themoviedb.org/3";
  const IMG = "https://image.tmdb.org/t/p/w500";
  const ORIGINAL = "https://image.tmdb.org/t/p/original";

  const grid = document.getElementById("grid");
  const searchInput = document.getElementById("searchInput");
  const modal = document.getElementById("detailsModal");
  const modalContent = document.getElementById("modalContent");

  let activeType = "all";
  let activeFilter = "popular";
  let page = 1;
  let allItems = [];
  let shownItems = [];
  let searchTimer = null;
  let requestId = 0;
  let currentSearch = "";

  const favorites = new Set(
    JSON.parse(localStorage.getItem("notwin_favorites") || "[]")
  );

  document.getElementById("year").textContent = new Date().getFullYear();

  function saveFavorites() {
    localStorage.setItem("notwin_favorites", JSON.stringify([...favorites]));
  }

  function escapeHTML(value = "") {
    return String(value).replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[ch]));
  }

  function getTitle(item) {
    return item.title || item.name || "بدون عنوان";
  }

  function getYear(item) {
    const date = item.release_date || item.first_air_date || "";
    return date ? date.slice(0, 4) : "غير معروف";
  }

  function itemKey(item) {
    return item.media_type + "-" + item.id;
  }

  async function api(path, params = {}) {
    const url = new URL(TMDB + path);
    url.searchParams.set("api_key", TMDB_KEY);
    url.searchParams.set("language", "ar");
    Object.entries(params).forEach(([key, value]) => {
      if (value !== undefined && value !== null && value !== "") {
        url.searchParams.set(key, value);
      }
    });
    const response = await fetch(url);
    if (!response.ok) throw new Error("TMDB API error: " + response.status);
    return response.json();
  }

  function normalize(item, type) {
    return {...item, media_type: type};
  }

  function posterHTML(item) {
    if (item.poster_path) {
      return `<img loading="lazy" src="${IMG}${item.poster_path}"
        alt="${escapeHTML(getTitle(item))}"
        onerror="this.parentElement.innerHTML='<div class=&quot;missing&quot;>لا توجد صورة</div>'">`;
    }
    return `<div class="missing">NOTWIN TV</div>`;
  }

  function cardHTML(item) {
    const key = itemKey(item);
    const title = escapeHTML(getTitle(item));
    const rating = Number(item.vote_average || 0).toFixed(1);
    const typeName = item.media_type === "movie" ? "فيلم" : "مسلسل";
    return `
      <article class="card" data-key="${escapeHTML(key)}" tabindex="0"
        aria-label="${title}">
        <div class="poster">
          ${posterHTML(item)}
          <span class="rating">★ ${rating}</span>
          <span class="kind">${typeName}</span>
          <button class="favorite ${favorites.has(key) ? "on" : ""}"
            data-fav="${escapeHTML(key)}" aria-label="إضافة للمفضلة">
            ${favorites.has(key) ? "♥" : "♡"}
          </button>
        </div>
        <div class="card-info">
          <h3>${title}</h3>
          <div class="meta"><span>${getYear(item)}</span><span>★ ${rating}</span></div>
        </div>
      </article>`;
  }

  function render(items) {
    shownItems = items;
    if (!items.length) {
      grid.innerHTML = `<div class="empty">ما لقيناش نتائج هنا. جرّب كلمة بحث أخرى.</div>`;
      return;
    }
    grid.innerHTML = items.map(cardHTML).join("");
  }

  async function loadCatalog(append = false) {
    const thisRequest = ++requestId;
    if (!append) {
      page = 1;
      grid.innerHTML = `<div class="loading">جاري تحميل المحتوى...</div>`;
    } else {
      page++;
      document.getElementById("loadMore").textContent = "جاري التحميل...";
    }

    try {
      let results = [];

      if (currentSearch.trim()) {
        if (activeType === "all" || activeType === "movie") {
          const data = await api("/search/movie", {query: currentSearch, page});
          results.push(...(data.results || []).map(x => normalize(x, "movie")));
        }
        if (activeType === "all" || activeType === "tv") {
          const data = await api("/search/tv", {query: currentSearch, page});
          results.push(...(data.results || []).map(x => normalize(x, "tv")));
        }
      } else {
        const suffix = activeFilter === "top" ? "top_rated" : "popular";
        if (activeType === "all" || activeType === "movie") {
          const data = await api("/movie/" + suffix, {page});
          results.push(...(data.results || []).map(x => normalize(x, "movie")));
        }
        if (activeType === "all" || activeType === "tv") {
          const data = await api("/tv/" + suffix, {page});
          results.push(...(data.results || []).map(x => normalize(x, "tv")));
        }
      }

      if (thisRequest !== requestId) return;

      // عند فتح المكتبة العامة نضيف Venom بوضوح إلى أول النتائج
      if (!append && !currentSearch && (activeType === "all" || activeType === "movie")) {
        try {
          const venom = await api("/search/movie", {query:"Venom"});
          const match = (venom.results || []).find(x =>
            /venom/i.test(x.title || "")
          );
          if (match && thisRequest === requestId) {
            results = results.filter(x => !(x.media_type === "movie" && x.id === match.id));
            results.unshift(normalize(match, "movie"));
          }
        } catch (e) {
          // إذا تعذر البحث عن Venom، تبقى المكتبة العادية متاحة.
        }
      }

      if (thisRequest !== requestId) return;
      allItems = append ? allItems.concat(results) : results;
      applyFilter();
    } catch (error) {
      if (thisRequest !== requestId) return;
      if (!append) {
        grid.innerHTML = `<div class="error">تعذّر تحميل المحتوى. تأكد من الإنترنت ومفتاح TMDB ثم أعد المحاولة.<br><button class="secondary" onclick="location.reload()">إعادة المحاولة</button></div>`;
      }
    } finally {
      document.getElementById("loadMore").textContent = "تحميل المزيد";
    }
  }

  function applyFilter() {
    let items = [...allItems];
    if (activeFilter === "favorites") {
      items = items.filter(item => favorites.has(itemKey(item)));
    } else if (activeFilter === "top") {
      items.sort((a, b) => (b.vote_average || 0) - (a.vote_average || 0));
    }
    render(items);
  }

  async function openDetails(item) {
    const isMovie = item.media_type === "movie";
    const title = escapeHTML(getTitle(item));
    const overview = escapeHTML(item.overview || "لا يوجد وصف متاح باللغة العربية لهذا العمل.");
    const key = itemKey(item);
    const poster = item.poster_path
      ? `<img src="${IMG}${item.poster_path}" alt="${title}">`
      : `<div class="missing">NOTWIN TV</div>`;

    modalContent.innerHTML = `
      <div class="modal-top">
        <div>${poster}</div>
        <div class="modal-info">
          <span class="tag">${isMovie ? "فيلم" : "مسلسل"}</span>
          <h2>${title}</h2>
          <div class="meta"><span>${getYear(item)}</span>
            <span>★ ${Number(item.vote_average || 0).toFixed(1)}</span></div>
          <p>${overview}</p>
          <div class="modal-actions">
            <button class="primary" id="modalFavorite">${favorites.has(key) ? "♥ في المفضلة" : "♡ أضف للمفضلة"}</button>
            ${isMovie
              ? `<a class="secondary" href="https://www.themoviedb.org/movie/${encodeURIComponent(item.id)}" target="_blank" rel="noopener">صفحة الفيلم ↗</a>`
              : `<button class="primary" id="watchSeries">فتح صفحة المشاهدة</button>`}
          </div>
          ${isMovie ? `<p>مشاهدة الأفلام مباشرة غير مفعّلة بعد في مشغّل الموقع الحالي.</p>` : ""}
        </div>
      </div>`;

    modal.classList.add("open");

    document.getElementById("modalFavorite").onclick = () => {
      toggleFavorite(key);
      document.getElementById("modalFavorite").textContent =
        favorites.has(key) ? "♥ في المفضلة" : "♡ أضف للمفضلة";
      applyFilter();
    };

    const watchButton = document.getElementById("watchSeries");
    if (watchButton) {
      watchButton.onclick = async () => {
        watchButton.disabled = true;
        watchButton.textContent = "جاري فتح المسلسل...";
        try {
          // إيجاد معرّف TMDB الصحيح بالاسم حتى يبقى watch.html الحالي متوافقاً.
          const data = await api("/search/tv", {query: getTitle(item)});
          const match = (data.results || []).find(x => x.name === getTitle(item)) || data.results?.[0];
          if (match) {
            location.href = `watch.html?id=${encodeURIComponent(match.id)}&type=tv`;
          } else {
            alert("ما لقيناش صفحة المشاهدة لهذا المسلسل.");
            watchButton.disabled = false;
            watchButton.textContent = "فتح صفحة المشاهدة";
          }
        } catch (e) {
          alert("تعذر فتح المسلسل. تأكد من الإنترنت.");
          watchButton.disabled = false;
          watchButton.textContent = "فتح صفحة المشاهدة";
        }
      };
    }
  }

  function toggleFavorite(key) {
    if (favorites.has(key)) favorites.delete(key);
    else favorites.add(key);
    saveFavorites();
  }

  grid.addEventListener("click", event => {
    const favButton = event.target.closest("[data-fav]");
    if (favButton) {
      event.stopPropagation();
      const key = favButton.dataset.fav;
      toggleFavorite(key);
      applyFilter();
      return;
    }
    const card = event.target.closest("[data-key]");
    if (card) {
      const item = shownItems.find(x => itemKey(x) === card.dataset.key);
      if (item) openDetails(item);
    }
  });

  grid.addEventListener("keydown", event => {
    if (event.key !== "Enter") return;
    const card = event.target.closest("[data-key]");
    if (!card) return;
    const item = shownItems.find(x => itemKey(x) === card.dataset.key);
    if (item) openDetails(item);
  });

  document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => {
      activeType = button.dataset.type;
      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === button));
      document.querySelectorAll(".bottom button").forEach(x =>
        x.classList.toggle("active", x.dataset.bottom === activeType)
      );
      document.getElementById("sectionTitle").textContent =
        activeType === "movie" ? "الأفلام" :
        activeType === "tv" ? "المسلسلات" : "الأكثر شهرة";
      loadCatalog();
    });
  });

  document.querySelectorAll(".filterbtn").forEach(button => {
    button.addEventListener("click", () => {
      activeFilter = button.dataset.filter;
      document.querySelectorAll(".filterbtn").forEach(x => x.classList.toggle("active", x === button));
      if (activeFilter === "favorites") {
        applyFilter();
      } else {
        loadCatalog();
      }
    });
  });

  document.querySelectorAll("[data-bottom]").forEach(button => {
    button.addEventListener("click", () => {
      const value = button.dataset.bottom;
      if (value === "favorites") {
        activeFilter = "favorites";
        document.querySelectorAll(".filterbtn").forEach(x =>
          x.classList.toggle("active", x.dataset.filter === "favorites")
        );
        applyFilter();
        document.getElementById("sectionTitle").textContent = "المفضلة";
        return;
      }
      activeType = value;
      activeFilter = "popular";
      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x.dataset.type === value));
      document.querySelectorAll(".filterbtn").forEach(x => x.classList.toggle("active", x.dataset.filter === "popular"));
      loadCatalog();
    });
  });

  document.getElementById("favoritesNav").addEventListener("click", () => {
    activeFilter = "favorites";
    document.querySelectorAll(".filterbtn").forEach(x => x.classList.toggle("active", x.dataset.filter === "favorites"));
    applyFilter();
    document.getElementById("sectionTitle").textContent = "المفضلة";
    document.getElementById("catalog").scrollIntoView({behavior:"smooth"});
  });

  searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      currentSearch = searchInput.value.trim();
      loadCatalog();
    }, 450);
  });

  document.getElementById("loadMore").addEventListener("click", () => loadCatalog(true));
  document.getElementById("exploreBtn").addEventListener("click", () =>
    document.getElementById("catalog").scrollIntoView({behavior:"smooth"})
  );
  document.getElementById("closeModal").addEventListener("click", () => modal.classList.remove("open"));
  modal.addEventListener("click", event => {
    if (event.target === modal) modal.classList.remove("open");
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") modal.classList.remove("open");
  });

  loadCatalog();
})();
</script>
</body>
      </html>
