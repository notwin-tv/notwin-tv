
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05050b">
<title>NOTWIN TV</title>

<style>
:root{
  --bg:#05050b;
  --panel:#0b0912;
  --player:#100e16;
  --purple:#b49dff;
  --purple2:#7061ff;
  --text:#f2efff;
  --muted:#aaa4bc;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
}
button,select{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

.page{
  width:min(100%,900px);
  min-height:100vh;
  margin:auto;
  padding:24px 20px;
  background:#07060d;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:35px;
}
#showTitle{
  font-size:clamp(18px,4vw,30px);
  font-weight:500;
  color:#d5d0e2;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.logo{
  flex-shrink:0;
  font-size:clamp(22px,4.5vw,34px);
  font-weight:900;
  color:var(--purple);
}
.player-card{
  background:#000;
  border-radius:27px;
  padding:18px;
  overflow:hidden;
}
.player-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}
.episode-label{
  font-size:clamp(17px,3.6vw,27px);
  color:#d8d2e4;
}
.fullscreen{
  width:34px;
  height:34px;
  padding:0;
  display:grid;
  place-items:center;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#eee;
  font-size:24px;
  line-height:1;
}
.fullscreen:active{background:#21182e}

.video-box{
  width:100%;
  aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
  background:var(--player);
  border-radius:23px;
}
#videoFrame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:var(--player);
}
.loading{
  position:absolute;
  inset:0;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:18px;
  background:var(--player);
  color:#bdb5ca;
  font-size:clamp(17px,3.5vw,27px);
  text-align:center;
  pointer-events:none;
}
.loading.hidden{display:none}
.play-icon{
  display:grid;
  place-items:center;
  width:68px;
  height:68px;
  border-radius:50%;
  background:#a982e7;
  color:#100b18;
  font-size:30px;
}
.controls{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-top:30px;
}
.control{
  min-height:125px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:17px;
  padding:15px 5px;
  background:#191025;
  color:#e7defa;
  border:1px solid #20152d;
  border-radius:22px;
  font-size:clamp(15px,3vw,23px);
}
.control svg{
  width:35px;
  height:35px;
  stroke:var(--purple);
  stroke-width:2.5;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.control:active{background:#28183c}
.control:disabled{opacity:.35;cursor:not-allowed}

.episode-panel{
  display:none;
  margin-top:18px;
  padding:16px;
  border:1px solid #282039;
  border-radius:18px;
  background:#0d0b14;
}
.episode-panel.open{display:block}
.episode-panel label{
  display:block;
  margin-bottom:8px;
  color:var(--muted);
  font-size:14px;
}
#seasonSelect,#episodeSelect{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  color:var(--text);
  background:#171121;
  border:1px solid #302341;
  border-radius:12px;
}
#status{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}
#status:empty{display:none}
.error{color:#ff9dbb!important}

#videoBox:fullscreen{
  width:100vw;
  height:100vh;
  aspect-ratio:auto;
  background:#000;
  border-radius:0;
}
#videoBox:fullscreen #videoFrame{
  width:100%;
  height:100%;
}
#videoBox:-webkit-full-screen{
  width:100vw;
  height:100vh;
  aspect-ratio:auto;
  border-radius:0;
}
#videoBox:-webkit-full-screen #videoFrame{
  width:100%;
  height:100%;
}
body.fullscreen-fallback{
  overflow:hidden;
}
body.fullscreen-fallback .page{
  position:fixed;
  inset:0;
  z-index:9999;
  width:100%;
  max-width:none;
  padding:0;
  background:#000;
}
body.fullscreen-fallback .topbar,
body.fullscreen-fallback .controls,
body.fullscreen-fallback .episode-panel,
body.fullscreen-fallback #status{
  display:none!important;
}
body.fullscreen-fallback .player-card{
  position:absolute;
  inset:0;
  padding:0;
  border-radius:0;
  background:#000;
}
body.fullscreen-fallback .player-head{
  position:absolute;
  top:env(safe-area-inset-top,0px);
  right:12px;
  left:12px;
  z-index:3;
  margin:0;
}
body.fullscreen-fallback .video-box{
  width:100%;
  height:100%;
  aspect-ratio:auto;
  border-radius:0;
  background:#000;
}
body.fullscreen-fallback #videoFrame{
  width:100%;
  height:100%;
}

@media(max-width:480px){
  .page{padding:20px 14px}
  .topbar{margin-bottom:30px}
  .player-card{padding:13px;border-radius:23px}
  .player-head{margin-bottom:15px}
  .video-box{border-radius:19px}
  .controls{gap:10px;margin-top:23px}
  .control{min-height:105px;border-radius:18px;gap:14px}
  .control svg{width:30px;height:30px}
}
</style>
</head>

<body>
<div class="page">
  <header class="topbar">
    <div id="showTitle">جاري التحميل...</div>
    <a class="logo" href="./index.html">notwin tv</a>
  </header>

  <section class="player-card">
    <div class="player-head">
      <button class="fullscreen" id="fullscreenBtn"
        aria-label="ملء الشاشة بالعرض" title="ملء الشاشة">⛶</button>
      <div class="episode-label" id="episodeLabel">الحلقة 1</div>
    </div>

    <div class="video-box" id="videoBox">
      <iframe id="videoFrame"
        title="مشغل الفيديو"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"></iframe>

      <div class="loading" id="loading">
        <span class="play-icon">▶</span>
        <span id="loadingText">مشغل الفيديو</span>
      </div>
    </div>
  </section>

  <div class="controls">
    <button class="control" id="nextBtn">
      <svg viewBox="0 0 24 24">
        <path d="M5 5v14l10-7z"></path>
        <path d="M19 5v14"></path>
      </svg>
      <span>التالية</span>
    </button>

    <button class="control" id="episodesBtn">
      <svg viewBox="0 0 24 24">
        <path d="M4 5h16M4 11h11M4 17h11"></path>
        <path d="m17 14 4 3-4 3z"></path>
      </svg>
      <span>الحلقات</span>
    </button>

    <button class="control" id="previousBtn">
      <svg viewBox="0 0 24 24">
        <path d="M19 5v14L9 12z"></path>
        <path d="M5 5v14"></path>
      </svg>
      <span>السابقة</span>
    </button>
  </div>

  <section class="episode-panel" id="episodePanel">
    <label for="seasonSelect">الموسم</label>
    <select id="seasonSelect"></select>
    <label for="episodeSelect">الحلقة</label>
    <select id="episodeSelect"></select>
  </section>

  <div id="status"></div>
</div>

<script>
"use strict";

const TMDB_API_KEY = "26c5ad9f51818e110945285552c11a75";
const TMDB_API = "https://api.themoviedb.org/3";
const PLAYER_URL = "https://cinesrc.st/embed/tv/";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const showId = Number(params.get("id"));

let show = null;
let seasons = [];
let episodes = [];
let seasonNumber = Number(params.get("season")) || 1;
let episodeNumber = Number(params.get("episode")) || 1;
let seasonRequest = 0;
let fallbackFullscreen = false;

async function api(path){
  const url = new URL(TMDB_API + path);
  url.searchParams.set("api_key", TMDB_API_KEY);
  url.searchParams.set("language", "ar-SA");

  const response = await fetch(url);
  if(!response.ok){
    throw new Error(
      response.status === 404
        ? "لم يتم العثور على المسلسل أو الحلقة."
        : response.status === 401
        ? "مفتاح TMDB غير صالح."
        : "تعذر تحميل البيانات. تحقق من الإنترنت."
    );
  }
  return response.json();
}

function status(message, isError=false){
  $("status").textContent = message;
  $("status").classList.toggle("error", isError);
}

function setLoading(message){
  $("loadingText").textContent = message;
  $("loading").classList.remove("hidden");
}

function updateAddress(){
  const url = new URL(location.href);
  url.searchParams.set("id", showId);
  url.searchParams.set("season", seasonNumber);
  url.searchParams.set("episode", episodeNumber);
  history.replaceState(null, "", url);
}

function playEpisode(){
  $("episodeLabel").textContent = "الحلقة " + episodeNumber;
  setLoading("جاري تجهيز الفيديو...");

  $("videoFrame").src =
    PLAYER_URL + encodeURIComponent(String(showId)) +
    "?s=" + encodeURIComponent(String(seasonNumber)) +
    "&e=" + encodeURIComponent(String(episodeNumber));

  updateAddress();
  $("previousBtn").disabled = !hasPrevious();
  $("nextBtn").disabled = !hasNext();
}

function hasPrevious(){
  return episodes.some(ep => ep.episode_number === episodeNumber - 1)
    || seasons.some(s => s.season_number < seasonNumber);
}

function hasNext(){
  return episodes.some(ep => ep.episode_number === episodeNumber + 1)
    || seasons.some(s => s.season_number > seasonNumber);
}

async function loadSeason(number, requestedEpisode){
  const request = ++seasonRequest;
  seasonNumber = number;
  $("episodeSelect").disabled = true;
  $("episodeSelect").replaceChildren();
  setLoading("جاري تحميل الحلقة...");

  try{
    const data = await api("/tv/" + showId + "/season/" + number);
    if(request !== seasonRequest) return;

    episodes = data.episodes || [];
    if(!episodes.length){
      throw new Error("لا توجد حلقات لهذا الموسم.");
    }

    const selected = episodes.some(
      ep => ep.episode_number === requestedEpisode
    ) ? requestedEpisode : episodes[0].episode_number;

    episodeNumber = selected;

    for(const ep of episodes){
      const option = document.createElement("option");
      option.value = ep.episode_number;
      option.textContent = "الحلقة " + ep.episode_number +
        (ep.name ? " — " + ep.name : "");
      $("episodeSelect").appendChild(option);
    }

    $("episodeSelect").value = String(episodeNumber);
    $("episodeSelect").disabled = false;
    playEpisode();
    status("");
  }catch(error){
    if(request !== seasonRequest) return;
    setLoading("تعذر تحميل الحلقة");
    status(error.message, true);
  }
}

async function changeEpisode(direction){
  const currentIndex = episodes.findIndex(
    ep => ep.episode_number === episodeNumber
  );
  const target = episodes[currentIndex + direction];

  if(target){
    episodeNumber = target.episode_number;
    $("episodeSelect").value = String(episodeNumber);
    playEpisode();
    return;
  }

  const otherSeasons = seasons
    .filter(s => s.season_number > 0)
    .sort((a,b) => a.season_number - b.season_number);

  const currentSeasonIndex = otherSeasons.findIndex(
    s => s.season_number === seasonNumber
  );
  const otherSeason = otherSeasons[currentSeasonIndex + direction];

  if(!otherSeason) return;

  try{
    const data = await api(
      "/tv/" + showId + "/season/" + otherSeason.season_number
    );
    const otherEpisodes = data.episodes || [];
    if(!otherEpisodes.length) return;

    const targetEpisode = direction > 0
      ? otherEpisodes[0].episode_number
      : otherEpisodes[otherEpisodes.length - 1].episode_number;

    await loadSeason(otherSeason.season_number, targetEpisode);
    $("seasonSelect").value = String(seasonNumber);
  }catch(error){
    status(error.message, true);
  }
}

$("videoFrame").addEventListener("load", () => {
  $("loading").classList.add("hidden");
});

$("videoFrame").addEventListener("error", () => {
  setLoading("تعذر تحميل الفيديو");
});

$("episodesBtn").addEventListener("click", () => {
  $("episodePanel").classList.toggle("open");
});

$("previousBtn").addEventListener("click", () => changeEpisode(-1));
$("nextBtn").addEventListener("click", () => changeEpisode(1));

$("seasonSelect").addEventListener("change", event => {
  loadSeason(Number(event.target.value), 1);
});

$("episodeSelect").addEventListener("change", event => {
  episodeNumber = Number(event.target.value);
  playEpisode();
});

async function enterFullscreen(){
  const box = $("videoBox");

  try{
    if(box.requestFullscreen){
      await box.requestFullscreen();
    }else if(box.webkitRequestFullscreen){
      box.webkitRequestFullscreen();
    }else{
      fallbackFullscreen = true;
      document.body.classList.add("fullscreen-fallback");
    }

    if(screen.orientation?.lock){
      try{ await screen.orientation.lock("landscape"); }
      catch(_){}
    }
  }catch(_){
    status("تعذر فتح ملء الشاشة في هذا المتصفح.", true);
  }
}

async function leaveFullscreen(){
  try{
    if(document.fullscreenElement && document.exitFullscreen){
      await document.exitFullscreen();
    }else if(document.webkitFullscreenElement &&
             document.webkitExitFullscreen){
      document.webkitExitFullscreen();
    }
  }catch(_){}

  fallbackFullscreen = false;
  document.body.classList.remove("fullscreen-fallback");

  if(screen.orientation?.unlock){
    try{ screen.orientation.unlock(); }catch(_){}
  }
}

$("fullscreenBtn").addEventListener("click", async () => {
  const active = document.fullscreenElement ||
    document.webkitFullscreenElement || fallbackFullscreen;

  if(active) await leaveFullscreen();
  else await enterFullscreen();
});

document.addEventListener("fullscreenchange", () => {
  if(!document.fullscreenElement && screen.orientation?.unlock){
    try{ screen.orientation.unlock(); }catch(_){}
  }
});

async function init(){
  if(!Number.isInteger(showId) || showId <= 0){
    $("showTitle").textContent = "NOTWIN TV";
    setLoading("المسلسل غير محدد");
    status("افتح المسلسل من رابط يحتوي على معرّف TMDB.", true);
    return;
  }

  try{
    show = await api("/tv/" + showId);
    $("showTitle").textContent = show.name || show.original_name || "NOTWIN TV";
    document.title = $("showTitle").textContent + " | NOTWIN TV";

    seasons = (show.seasons || []).filter(s => s.season_number > 0);
    if(!seasons.length) throw new Error("لا توجد مواسم لهذا المسلسل.");

    const seasonSelect = $("seasonSelect");
    seasonSelect.replaceChildren();

    for(const season of seasons){
      const option = document.createElement("option");
      option.value = season.season_number;
      option.textContent = season.name || "الموسم " + season.season_number;
      seasonSelect.appendChild(option);
    }

    if(!seasons.some(s => s.season_number === seasonNumber)){
      seasonNumber = seasons[0].season_number;
    }

    seasonSelect.value = String(seasonNumber);
    await loadSeason(seasonNumber, episodeNumber);
  }catch(error){
    $("showTitle").textContent = "NOTWIN TV";
    setLoading("تعذر تحميل المسلسل");
    status(error.message || "حدث خطأ أثناء التحميل.", true);
  }
}

init();
</script>
</body>
</html>
