
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>المشاهدة | NOTWIN TV</title>

  <style>
    :root {
      --bg: #080808;
      --card: #151515;
      --red: #e50914;
      --text: #fff;
      --muted: #aaa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      color: white;
      border-radius: 8px;
      padding: 11px 14px;
      background: var(--card);
    }

    button:active {
      transform: scale(.97);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid #242424;
    }

    .logo {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: .5px;
    }

    .logo span {
      color: var(--red);
    }

    .home-btn {
      background: var(--red);
      font-weight: bold;
    }

    main {
      width: 100%;
      max-width: 950px;
      margin: auto;
      padding: 16px 12px 28px;
    }

    .title {
      margin: 3px 0 14px;
      font-size: 20px;
      line-height: 1.5;
    }

    .player-shell {
      background: #000;
      border: 1px solid #292929;
      border-radius: 12px;
      overflow: hidden;
    }

    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .player iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .player-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      text-align: center;
      background: radial-gradient(ellipse, #241010 0%, #080808 72%);
    }

    .play-symbol {
      width: 65px;
      height: 65px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--red);
      font-size: 27px;
      padding-left: 4px;
    }

    .player-placeholder p {
      color: var(--muted);
      margin: 0;
      font-size: 13px;
    }

    .main-actions {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 8px;
      padding: 10px;
      background: #101010;
    }

    .main-actions button {
      min-height: 42px;
      font-size: 13px;
      font-weight: bold;
    }

    .watch-btn {
      background: var(--red);
    }

    .favorite-btn.saved {
      color: #ff424b;
      border: 1px solid var(--red);
    }

    .episode-nav {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .episode-nav button {
      padding: 10px 5px;
      font-size: 12px;
      background: #171717;
      border: 1px solid #292929;
    }

    .episode-nav button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .episodes-panel {
      display: none;
      margin-top: 12px;
      padding: 13px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 10px;
    }

    .episodes-panel.open {
      display: block;
    }

    .season-select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: #202020;
      color: white;
      border: 1px solid #383838;
      border-radius: 8px;
      font-size: 14px;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 8px;
    }

    .episode-btn {
      padding: 12px 5px;
      background: #202020;
      border: 1px solid #333;
    }

    .episode-btn.active {
      background: var(--red);
      border-color: var(--red);
    }

    .message {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      margin: 12px 2px 0;
    }

    /* ملء الشاشة يشمل المشغّل وأزراره فقط */
    .player-shell:fullscreen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border: 0;
      border-radius: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .player-shell:fullscreen .player {
      width: 100%;
      height: calc(100vh - 62px);
      max-height: 100vh;
      aspect-ratio: auto;
      flex: 1;
    }

    .player-shell:fullscreen .main-actions {
      flex: 0 0 auto;
      padding: 6px;
    }

    .player-shell:fullscreen .main-actions button {
      min-height: 38px;
    }

    .player-shell:fullscreen .player-placeholder {
      position: absolute;
    }

    .player-shell:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      border: 0;
      border-radius: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .player-shell:-webkit-full-screen .player {
      width: 100%;
      height: calc(100vh - 62px);
      aspect-ratio: auto;
      flex: 1;
    }

    @media (max-width: 420px) {
      .main-actions {
        gap: 6px;
        padding: 8px;
      }

      .main-actions button {
        padding: 10px 5px;
        font-size: 12px;
      }

      .title {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="logo">NOTWIN <span>TV</span></div>
    <button class="home-btn" id="homeBtn">الرئيسية</button>
  </header>

  <main>
    <h1 class="title" id="contentTitle">المشاهدة</h1>

    <section class="player-shell" id="playerShell">
      <div class="player" id="player">
        <div class="player-placeholder" id="placeholder">
          <div class="play-symbol">▶</div>
          <strong>NOTWIN TV</strong>
          <p>اضغط على «المشاهدة داخل الموقع» لفتح المشغّل</p>
        </div>
      </div>

      <div class="main-actions">
        <button class="watch-btn" id="watchBtn">▶ المشاهدة داخل الموقع</button>
        <button id="fullscreenBtn">⛶ ملء الشاشة</button>
        <button class="favorite-btn" id="favoriteBtn">♡ المفضلة</button>
      </div>
    </section>

    <div class="episode-nav">
      <button id="previousBtn">السابقة</button>
      <button id="episodesBtn">الحلقات</button>
      <button id="nextBtn">التالية</button>
    </div>

    <section class="episodes-panel" id="episodesPanel">
      <select class="season-select" id="seasonSelect" aria-label="اختيار الموسم"></select>
      <div class="episodes-grid" id="episodesGrid"></div>
    </section>

    <p class="message" id="message" hidden></p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const contentId = params.get("id");
    const contentType = params.get("type") === "tv" ? "tv" : "movie";

    const playerShell = document.getElementById("playerShell");
    const player = document.getElementById("player");
    const placeholder = document.getElementById("placeholder");
    const titleElement = document.getElementById("contentTitle");
    const watchBtn = document.getElementById("watchBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const favoriteBtn = document.getElementById("favoriteBtn");
    const episodesBtn = document.getElementById("episodesBtn");
    const episodesPanel = document.getElementById("episodesPanel");
    const seasonSelect = document.getElementById("seasonSelect");
    const episodesGrid = document.getElementById("episodesGrid");
    const previousBtn = document.getElementById("previousBtn");
    const nextBtn = document.getElementById("nextBtn");
    const message = document.getElementById("message");

    let season = 1;
    let episode = 1;
    let totalSeasons = 1;
    let currentSeasonEpisodeCount = 24;
    let playerLoaded = false;

    const API_KEY = "26c5ad9f51818e110945285552c11a75";
    const API_BASE = "https://api.themoviedb.org/3";

    function showMessage(text) {
      message.textContent = text;
      message.hidden = false;
    }

    function hideMessage() {
      message.hidden = true;
      message.textContent = "";
    }

    function getEmbedUrl() {
      if (contentType === "tv") {
        return `https://cinesrc.st/embed/tv/${encodeURIComponent(contentId)}?s=${season}&e=${episode}`;
      }
      return `https://cinesrc.st/embed/movie/${encodeURIComponent(contentId)}`;
    }

    function loadPlayer() {
      if (!contentId) {
        showMessage("رابط المشاهدة ناقصه معرّف العمل. ارجع للرئيسية واختار العمل من جديد.");
        return;
      }

      hideMessage();
      placeholder.style.display = "none";

      let iframe = document.getElementById("videoFrame");
      if (!iframe) {
        iframe = document.createElement("iframe");
        iframe.id = "videoFrame";
        iframe.title = "مشغّل الفيديو";
        iframe.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media";
        iframe.allowFullscreen = true;
        iframe.referrerPolicy = "no-referrer";
        iframe.setAttribute("allow", "fullscreen");
        player.appendChild(iframe);
      }

      iframe.src = getEmbedUrl();
      playerLoaded = true;
    }

    watchBtn.addEventListener("click", loadPlayer);

    document.getElementById("homeBtn").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    async function enterFullscreen() {
      const target = playerShell;

      try {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
          return;
        }

        if (!playerLoaded) loadPlayer();

        if (target.requestFullscreen) {
          await target.requestFullscreen();
        } else if (target.webkitRequestFullscreen) {
          target.webkitRequestFullscreen();
        } else {
          showMessage("المتصفح هذا ما يدعمش ملء الشاشة للمشغّل. جرّب تفتح الموقع في Chrome.");
          return;
        }

        if (screen.orientation && screen.orientation.lock) {
          try {
            await screen.orientation.lock("landscape");
          } catch (_) {
            /* بعض الهواتف تسمح بالوضع الأفقي يدوياً فقط */
          }
        }
      } catch (_) {
        showMessage("ما قدرناش نفعّل ملء الشاشة. جرّب تدوّر الهاتف أفقياً أو تستعمل Chrome.");
      }
    }

    fullscreenBtn.addEventListener("click", enterFullscreen);

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch (_) {}
      }
    });

    document.addEventListener("webkitfullscreenchange", () => {
      if (!document.webkitFullscreenElement && screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch (_) {}
      }
    });

    function readFavorites() {
      try {
        return JSON.parse(localStorage.getItem("notwin_tv_favorites") || "[]");
      } catch (_) {
        return [];
      }
    }

    function favoriteKey() {
      return `${contentType}-${contentId}`;
    }

    function updateFavoriteButton() {
      const saved = readFavorites().some(item => item.key === favoriteKey());
      favoriteBtn.classList.toggle("saved", saved);
      favoriteBtn.textContent = saved ? "♥ في المفضلة" : "♡ المفضلة";
    }

    favoriteBtn.addEventListener("click", () => {
      if (!contentId) {
        showMessage("ما قدرناش نحفظو العمل: الرابط ناقص.");
        return;
      }

      const favorites = readFavorites();
      const index = favorites.findIndex(item => item.key === favoriteKey());

      if (index >= 0) {
        favorites.splice(index, 1);
      } else {
        favorites.push({
          key: favoriteKey(),
          id: contentId,
          type: contentType,
          title: titleElement.textContent
        });
      }

      try {
        localStorage.setItem("notwin_tv_favorites", JSON.stringify(favorites));
        updateFavoriteButton();
        hideMessage();
      } catch (_) {
        showMessage("المتصفح منع حفظ المفضلة.");
      }
    });

    async function loadContentInfo() {
      if (!contentId) {
        titleElement.textContent = "المشاهدة";
        showMessage("ما لقيناش معرّف العمل في الرابط. ارجع للرئيسية واختار العمل.");
        return;
      }

      titleElement.textContent = "جاري تحميل العنوان…";

      try {
        const response = await fetch(
          `${API_BASE}/${contentType}/${encodeURIComponent(contentId)}?api_key=${API_KEY}&language=ar`
        );

        if (!response.ok) throw new Error("TMDB request failed");

        const data = await response.json();
        titleElement.textContent = data.title || data.name || "المشاهدة";

        if (contentType === "tv") {
          totalSeasons = Math.max(1, Number(data.number_of_seasons) || 1);
          buildSeasonOptions();
          await loadSeasonInfo();
        } else {
          previousBtn.disabled = true;
          nextBtn.disabled = true;
          episodesBtn.disabled = true;
        }

        updateFavoriteButton();
      } catch (_) {
        titleElement.textContent = "المشاهدة";
        if (contentType === "tv") {
          buildSeasonOptions();
          renderEpisodes(currentSeasonEpisodeCount);
        } else {
          previousBtn.disabled = true;
          nextBtn.disabled = true;
          episodesBtn.disabled = true;
        }
        updateFavoriteButton();
      }
    }

    function buildSeasonOptions() {
      seasonSelect.innerHTML = "";

      for (let number = 1; number <= totalSeasons; number++) {
        const option = document.createElement("option");
        option.value = number;
        option.textContent = `الموسم ${number}`;
        seasonSelect.appendChild(option);
      }

      seasonSelect.value = String(season);
    }

    async function loadSeasonInfo() {
      if (contentType !== "tv") return;

      try {
        const response = await fetch(
          `${API_BASE}/tv/${encodeURIComponent(contentId)}/season/${season}?api_key=${API_KEY}&language=ar`
        );

        if (!response.ok) throw new Error("Season request failed");

        const data = await response.json();
        currentSeasonEpisodeCount = Array.isArray(data.episodes) && data.episodes.length
          ? data.episodes.length
          : 24;

        renderEpisodes(currentSeasonEpisodeCount);
      } catch (_) {
        currentSeasonEpisodeCount = 24;
        renderEpisodes(currentSeasonEpisodeCount);
      }

      seasonSelect.value = String(season);
      previousBtn.disabled = season === 1 && episode === 1;
      nextBtn.disabled = season === totalSeasons && episode >= currentSeasonEpisodeCount;
    }

    function renderEpisodes(count) {
      episodesGrid.innerHTML = "";

      for (let number = 1; number <= count; number++) {
        const button = document.createElement("button");
        button.className = "episode-btn";
        button.textContent = number;
        button.title = `الحلقة ${number}`;

        if (number === episode) button.classList.add("active");

        button.addEventListener("click", () => {
          episode = number;
          renderEpisodes(currentSeasonEpisodeCount);
          loadPlayer();
          previousBtn.disabled = season === 1 && episode === 1;
          nextBtn.disabled = season === totalSeasons && episode >= currentSeasonEpisodeCount;
        });

        episodesGrid.appendChild(button);
      }
    }

    episodesBtn.addEventListener("click", async () => {
      if (contentType !== "tv") return;

      episodesPanel.classList.toggle("open");

      if (episodesPanel.classList.contains("open")) {
        await loadSeasonInfo();
      }
    });

    seasonSelect.addEventListener("change", async () => {
      season = Number(seasonSelect.value) || 1;
      episode = 1;
      await loadSeasonInfo();
      previousBtn.disabled = season === 1 && episode === 1;
      nextBtn.disabled = season === totalSeasons && episode >= currentSeasonEpisodeCount;
    });

    previousBtn.addEventListener("click", async () => {
      if (contentType !== "tv") return;

      if (episode > 1) {
        episode--;
      } else if (season > 1) {
        season--;
        episode = 1;
      } else {
        return;
      }

      await loadSeasonInfo();
      loadPlayer();
    });

    nextBtn.addEventListener("click", async () => {
      if (contentType !== "tv") return;

      if (episode < currentSeasonEpisodeCount) {
        episode++;
      } else if (season < totalSeasons) {
        season++;
        episode = 1;
      } else {
        return;
      }

      await loadSeasonInfo();
      loadPlayer();
    });

    if (contentType === "movie") {
      episodesBtn.disabled = true;
      previousBtn.disabled = true;
      nextBtn.disabled = true;
    }

    updateFavoriteButton();
    loadContentInfo();
  </script>
</body>
</html>
