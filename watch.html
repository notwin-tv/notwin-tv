
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05050b">
<title>المشاهدة | NOTWIN TV</title>

<style>
:root {
  --bg:#05050b;
  --card:#0d0d18;
  --purple:#7061ff;
  --light:#b49dff;
  --text:#f4f1ff;
  --muted:#a5a0bc;
  --border:#25213a;
}
* { box-sizing:border-box; }

html,body {
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
}
body { padding-bottom:20px; }
a { color:inherit;text-decoration:none; }
button,select {
  font:inherit;
  color:var(--text);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
}
button { cursor:pointer; }
button:focus-visible,select:focus-visible {
  outline:2px solid var(--light);
  outline-offset:2px;
}
header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:17px 5%;
  background:#090811;
  border-bottom:1px solid var(--border);
}
.logo { font-size:23px;font-weight:900; }
.logo span { color:var(--light); }
.home { color:var(--muted);font-size:14px; }

main {
  width:min(100%,1000px);
  margin:auto;
  padding:20px 14px;
}
.heading { margin-bottom:14px; }
h1 { font-size:21px;margin:0 0 7px; }
#meta { color:var(--muted);font-size:12px; }

.player-card {
  background:#000;
  border:1px solid var(--border);
  border-radius:17px;
  padding:8px;
  overflow:hidden;
}
.player-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:4px 3px 10px;
}
#episodeLabel { font-size:14px;color:var(--muted); }
.fullscreen-btn {
  width:42px;
  height:38px;
  padding:0;
  display:grid;
  place-items:center;
  background:#171121;
  color:var(--light);
  border:1px solid #33254b;
  font-size:22px;
}
#player {
  width:100%;
  aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
  border-radius:12px;
  background:#100e16;
}
#player iframe {
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#100e16;
}
.player-message {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:20px;
  text-align:center;
  color:var(--muted);
  line-height:1.8;
}
.play-icon {
  display:grid;
  place-items:center;
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--light);
  color:#100b1b;
  font-size:26px;
}
.player-note {
  margin:10px 3px 3px;
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
}
.selectors {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.field label {
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:7px;
}
select { width:100%;min-width:0; }
#status {
  color:var(--muted);
  font-size:13px;
  line-height:1.8;
  margin-top:14px;
}
.error { color:#ff9dbb!important; }

.details {
  margin-top:18px;
  padding:15px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
}
.details h2 { font-size:16px;margin:0 0 8px; }
#overview {
  color:var(--muted);
  font-size:13px;
  line-height:1.9;
  margin:0;
}
footer {
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:20px 10px;
}

/* واجهة المشاهدة الأفقية */
#player:fullscreen {
  width:100vw;
  height:100vh;
  max-width:none;
  max-height:none;
  aspect-ratio:auto;
  border-radius:0;
  background:#000;
}
#player:fullscreen iframe {
  width:100%;
  height:100%;
}
#player:fullscreen .player-message {
  background:#000;
}
#player:-webkit-full-screen {
  width:100vw;
  height:100vh;
  aspect-ratio:auto;
  border-radius:0;
}
#player:-webkit-full-screen iframe {
  width:100%;
  height:100%;
}

@media(max-width:520px) {
  header { padding:14px; }
  main { padding:15px 10px; }
  h1 { font-size:19px; }
  .player-card { padding:6px; }
  .selectors { gap:8px; }
  select { padding:11px 7px;font-size:13px; }
}

/* أثناء ملء الشاشة نخفي كل ما هو خارج الفيديو */
body.watching-fullscreen header,
body.watching-fullscreen main > .heading,
body.watching-fullscreen main > .selectors,
body.watching-fullscreen main > #status,
body.watching-fullscreen main > .details,
body.watching-fullscreen footer {
  display:none!important;
}
body.watching-fullscreen main {
  width:100%;
  max-width:none;
  margin:0;
  padding:0;
}
body.watching-fullscreen .player-card {
  position:fixed;
  inset:0;
  z-index:9999;
  padding:0;
  border:0;
  border-radius:0;
  background:#000;
}
body.watching-fullscreen .player-top {
  position:absolute;
  top:env(safe-area-inset-top, 0px);
  right:12px;
  left:12px;
  z-index:2;
  pointer-events:none;
}
body.watching-fullscreen .player-top > * {
  pointer-events:auto;
}
body.watching-fullscreen #player {
  width:100%;
  height:100%;
  aspect-ratio:auto;
  border-radius:0;
}
body.watching-fullscreen #player iframe {
  width:100%;
  height:100%;
}
body.watching-fullscreen .player-note {
  display:none;
}
</style>
</head>

<body>
<header>
  <a class="logo" href="./index.html">NOTWIN <span>TV</span></a>
  <a class="home" href="./index.html">الرئيسية ←</a>
</header>

<main>
  <section class="heading">
    <h1 id="title">جاري تحميل المسلسل...</h1>
    <div id="meta"></div>
  </section>

  <section class="player-card" id="playerCard">
    <div class="player-top">
      <span id="episodeLabel">الحلقة 1</span>
      <button
        class="fullscreen-btn"
        id="fullscreenBtn"
        type="button"
        aria-label="ملء الشاشة بالعرض"
        title="ملء الشاشة بالعرض">⛶</button>
    </div>

    <div id="player">
      <div class="player-message">
        <span class="play-icon">▶</span>
        <span>جاري تجهيز مشغّل الفيديو...</span>
      </div>
    </div>

    <p class="player-note">
      إذا لم يبدأ الفيديو، انتظر قليلًا أو تحقق من اتصال الإنترنت.
    </p>
  </section>

  <section class="selectors">
    <div class="field">
      <label for="season">الموسم</label>
      <select id="season" disabled>
        <option>تحميل...</option>
      </select>
    </div>

    <div class="field">
      <label for="episode">الحلقة</label>
      <select id="episode" disabled>
        <option>تحميل...</option>
      </select>
    </div>
  </section>

  <div id="status">جاري الاتصال...</div>

  <section class="details">
    <h2>عن المسلسل</h2>
    <p id="overview">جاري تحميل المعلومات...</p>
  </section>
</main>

<footer>
  NOTWIN TV © <span id="year"></span>
  <br>
  معلومات المسلسلات من TMDB. الموقع غير معتمد من TMDB.
</footer>

<script>
"use strict";

const TMDB_API_KEY = "26c5ad9f51818e110945285552c11a75";
const TMDB_API = "https://api.themoviedb.org/3";
const TMDB_IMAGES = "https://image.tmdb.org/t/p/w500";
const CINESRC_PLAYER = "https://cinesrc.st/embed/tv/";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

const showId = Number(params.get("id"));
let seasonNumber = Number(params.get("season")) || 1;
let episodeNumber = Number(params.get("episode")) || 1;
let show = null;
let seasonData = null;
let loadVersion = 0;
let fullscreenActive = false;

$("year").textContent = new Date().getFullYear();

function setStatus(message, error = false) {
  $("status").textContent = message;
  $("status").classList.toggle("error", error);
}

async function tmdb(path) {
  const url = new URL(TMDB_API + path);
  url.searchParams.set("api_key", TMDB_API_KEY);
  url.searchParams.set("language", "ar-SA");

  const response = await fetch(url);

  if (!response.ok) {
    if (response.status === 401) {
      throw new Error("مفتاح TMDB غير صالح.");
    }
    if (response.status === 404) {
      throw new Error("المسلسل أو الموسم غير موجود.");
    }
    if (response.status === 429) {
      throw new Error("طلبات كثيرة. حاول بعد قليل.");
    }
    throw new Error("تعذر الاتصال. رمز الخطأ: " + response.status);
  }

  return response.json();
}

function updateURL() {
  const url = new URL(location.href);
  url.searchParams.set("id", String(show.id));
  url.searchParams.set("season", String(seasonNumber));
  url.searchParams.set("episode", String(episodeNumber));
  history.replaceState(null, "", url);
}

function showPlayerMessage(message) {
  const player = $("player");
  player.replaceChildren();

  const box = document.createElement("div");
  box.className = "player-message";

  const icon = document.createElement("span");
  icon.className = "play-icon";
  icon.textContent = "▶";

  const text = document.createElement("span");
  text.textContent = message;

  box.append(icon, text);
  player.appendChild(box);
}

function renderPlayer() {
  if (!show) return;

  const player = $("player");
  player.replaceChildren();

  const iframe = document.createElement("iframe");
  iframe.src =
    CINESRC_PLAYER + encodeURIComponent(String(show.id)) +
    "?s=" + encodeURIComponent(String(seasonNumber)) +
    "&e=" + encodeURIComponent(String(episodeNumber));

  iframe.title = "مشغل المسلسل";
  iframe.allow = "fullscreen; autoplay; picture-in-picture";
  iframe.allowFullscreen = true;
  iframe.loading = "eager";
  iframe.referrerPolicy = "strict-origin-when-cross-origin";

  player.appendChild(iframe);

  $("episodeLabel").textContent =
    "الموسم " + seasonNumber + " · الحلقة " + episodeNumber;

  updateURL();
}

async function loadSeason(number) {
  const version = ++loadVersion;
  seasonNumber = number;

  $("episode").disabled = true;
  $("episode").replaceChildren();
  showPlayerMessage("جاري تحميل بيانات الحلقات...");

  setStatus("جاري تحميل الحلقات...");

  try {
    const data = await tmdb("/tv/" + show.id + "/season/" + number);
    if (version !== loadVersion) return;

    seasonData = data;
    const episodes = data.episodes || [];
    const select = $("episode");

    if (!episodes.length) {
      showPlayerMessage("لا توجد حلقات لهذا الموسم.");
      setStatus("لم يتم العثور على حلقات.");
      return;
    }

    if (!episodes.some(item => item.episode_number === episodeNumber)) {
      episodeNumber = episodes[0].episode_number;
    }

    for (const item of episodes) {
      const option = document.createElement("option");
      option.value = String(item.episode_number);
      option.textContent =
        "الحلقة " + item.episode_number +
        (item.name ? " — " + item.name : "");
      select.appendChild(option);
    }

    select.value = String(episodeNumber);
    select.disabled = false;

    renderPlayer();
    setStatus("تم تحميل بيانات الحلقات.");
  } catch (error) {
    if (version !== loadVersion) return;
    showPlayerMessage("تعذر تحميل بيانات الحلقات.");
    setStatus(error.message || "حدث خطأ أثناء التحميل.", true);
  }
}

async function init() {
  if (!Number.isSafeInteger(showId) || showId <= 0) {
    $("title").textContent = "المسلسل غير محدد";
    showPlayerMessage("الرابط لا يحتوي على معرّف TMDB صحيح.");
    setStatus("افتح المسلسل من الصفحة الرئيسية.", true);
    return;
  }

  try {
    show = await tmdb("/tv/" + showId);

    $("title").textContent = show.name || show.original_name || "مسلسل";
    $("overview").textContent =
      show.overview || "لا يتوفر وصف باللغة العربية.";

    const year = show.first_air_date
      ? show.first_air_date.slice(0, 4)
      : "—";

    $("meta").textContent =
      year + " · " +
      (show.number_of_seasons || 0) + " موسم · التقييم " +
      (show.vote_average ? show.vote_average.toFixed(1) : "—");

    document.title = $("title").textContent + " | NOTWIN TV";

    const seasonSelect = $("season");
    seasonSelect.replaceChildren();

    const seasons = (show.seasons || []).filter(
      item => item.season_number > 0
    );

    if (!seasons.length) {
      throw new Error("لم يتم العثور على مواسم لهذا المسلسل.");
    }

    for (const item of seasons) {
      const option = document.createElement("option");
      option.value = String(item.season_number);
      option.textContent =
        item.name || "الموسم " + item.season_number;
      seasonSelect.appendChild(option);
    }

    if (!seasons.some(item => item.season_number === seasonNumber)) {
      seasonNumber = seasons[0].season_number;
    }

    seasonSelect.value = String(seasonNumber);
    seasonSelect.disabled = false;

    await loadSeason(seasonNumber);
  } catch (error) {
    $("title").textContent = "تعذر تحميل المسلسل";
    showPlayerMessage("تحقق من الإنترنت وحاول مجددًا.");
    setStatus(error.message || "حدث خطأ غير متوقع.", true);
  }
}

$("season").addEventListener("change", event => {
  episodeNumber = 1;
  loadSeason(Number(event.target.value));
});

$("episode").addEventListener("change", event => {
  episodeNumber = Number(event.target.value);
  renderPlayer();
});

/*
  ملء الشاشة:
  نحاول تدوير الهاتف إلى العرض إذا كان المتصفح يدعم ذلك.
  بعض الهواتف والمتصفحات لا تسمح بقفل الاتجاه من صفحة ويب.
*/
async function enterFullscreen() {
  const player = $("player");

  try {
    if (!document.fullscreenElement) {
      if (player.requestFullscreen) {
        await player.requestFullscreen();
      } else if (player.webkitRequestFullscreen) {
        player.webkitRequestFullscreen();
      } else {
        document.body.classList.add("watching-fullscreen");
        fullscreenActive = true;
      }
    }

    if (screen.orientation && screen.orientation.lock) {
      try {
        await screen.orientation.lock("landscape");
      } catch (_) {
        // بعض المتصفحات تمنع تدوير الشاشة تلقائيًا.
      }
    }
  } catch (_) {
    setStatus(
      "إذا لم يفتح ملء الشاشة، استعمل زر التكبير داخل مشغّل الفيديو."
    );
  }
}

async function exitFullscreen() {
  try {
    if (document.fullscreenElement && document.exitFullscreen) {
      await document.exitFullscreen();
    } else if (document.webkitFullscreenElement &&
               document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  } catch (_) {}

  document.body.classList.remove("watching-fullscreen");
  fullscreenActive = false;

  if (screen.orientation && screen.orientation.unlock) {
    try {
      screen.orientation.unlock();
    } catch (_) {}
  }
}

$("fullscreenBtn").addEventListener("click", async () => {
  const isFullscreen =
    Boolean(document.fullscreenElement) ||
    Boolean(document.webkitFullscreenElement) ||
    fullscreenActive;

  if (isFullscreen) {
    await exitFullscreen();
  } else {
    await enterFullscreen();
  }
});

document.addEventListener("fullscreenchange", () => {
  const active = Boolean(document.fullscreenElement);
  document.body.classList.toggle("watching-fullscreen", active);

  if (!active && screen.orientation && screen.orientation.unlock) {
    try {
      screen.orientation.unlock();
    } catch (_) {}
  }
});

document.addEventListener("webkitfullscreenchange", () => {
  const active = Boolean(document.webkitFullscreenElement);
  document.body.classList.toggle("watching-fullscreen", active);
});

init();
</script>
</body>
</html>
