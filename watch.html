<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080607">
<title>NOTWIN TV | المشاهدة</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080607;color:#fff4f4;font-family:Arial,Tahoma,sans-serif;min-height:100vh}
button,select{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
header{padding:17px 5%;display:flex;align-items:center;justify-content:space-between;background:#10090b;border-bottom:1px solid #291419;position:sticky;top:0;z-index:5}
.logo{font-size:23px;font-weight:900}
.logo span{color:#f04455}
.back{padding:10px 14px;background:#1b0d10;color:white;border:1px solid #392027;border-radius:9px}
main{width:92%;max-width:1100px;margin:24px auto 45px}
.player{background:#000;border:1px solid #38171d;border-radius:12px;overflow:hidden}
.player-header{padding:12px;background:#150b0d;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.player-header h2{font-size:15px}
.player-actions{display:flex;gap:8px;align-items:center}
.player-actions button,.player-actions select{background:#211014;color:white;border:1px solid #432027;padding:9px 10px;border-radius:8px}
#video{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.player-note{padding:12px;font-size:13px;color:#ad999d;line-height:1.8}
.player-note a{color:#ff7986;text-decoration:underline}
.details{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;margin-top:25px}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:#160d0f;border:1px solid #291419}
.tag{display:inline-block;color:#ff7885;background:#c52b3b20;padding:6px 10px;border-radius:7px;margin-bottom:10px;font-size:12px}
h1{font-size:clamp(23px,4vw,32px);margin-bottom:12px}
.meta{display:flex;flex-wrap:wrap;gap:12px;color:#ad999d;font-size:13px;margin-bottom:15px}
.rating{color:#ffd27a}
.overview{color:#c8b8bb;line-height:2;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
.btn{padding:11px 15px;border:0;border-radius:9px;background:#c52b3b;color:white;font-weight:bold}
.btn.secondary{background:#1b0d10;border:1px solid #392027}
.btn:disabled{opacity:.4;cursor:not-allowed}
.section{margin-top:30px}
.section h2{font-size:20px;margin-bottom:14px}
.season-row{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}
.season-btn{background:#140b0d;border:1px solid #392027;color:white;border-radius:9px;padding:10px 13px}
.season-btn.active{background:#c52b3b;border-color:#c52b3b}
.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.episode{text-align:right;background:#140b0d;color:white;border:1px solid #291419;border-radius:10px;padding:13px;line-height:1.6}
.episode.active{background:#c52b3b22;border-color:#c52b3b}
.episode small{display:block;color:#ad999d;margin-top:5px}
.status{color:#ad999d;text-align:center;padding:20px 12px;line-height:1.9}
footer{border-top:1px solid #291419;color:#79696d;text-align:center;padding:22px;font-size:12px}
[hidden]{display:none!important}
@media(max-width:600px){
header{padding:14px 4%}
.logo{font-size:20px}
main{margin-top:15px}
.details{grid-template-columns:105px minmax(0,1fr);gap:13px}
.overview{font-size:13px}
.meta{gap:8px}
.player-header{padding:10px}
.player-actions button,.player-actions select{font-size:12px;padding:8px}
.episodes{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<body>
<header>
<a class="logo" href="./index.html">NOTWIN <span>TV</span></a>
<button class="back" id="backBtn">رجوع ←</button>
</header>

<main>
<section class="player">
<div class="player-header">
<h2 id="playerTitle">جاري تحميل العمل...</h2>
<div class="player-actions">
<select id="quality" aria-label="الجودة">
<option value="480">480p</option>
<option value="720" selected>720p</option>
</select>
<button id="fullscreen">⛶ ملء الشاشة</button>
</div>
</div>

<iframe id="video" src="about:blank" title="مشغل NOTWIN TV" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>

<div class="player-note" id="playerNote">جاري تحميل معلومات العمل...</div>
</section>

<section class="details">
<img class="poster" id="poster" alt="غلاف العمل">

<div>
<span class="tag" id="typeTag">NOTWIN TV</span>
<h1 id="title">جاري التحميل...</h1>

<div class="meta">
<span id="year">—</span>
<span class="rating" id="rating">★ —</span>
<span id="runtime"></span>
<span id="language"></span>
</div>

<p class="overview" id="overview">جاري تحميل القصة...</p>

<div class="actions">
<button class="btn secondary" id="favoriteBtn">♡ أضف للمفضلة</button>
<button class="btn secondary" id="trailerBtn" hidden>▶ الإعلان الرسمي</button>
<button class="btn secondary" id="platformBtn">منصات المشاهدة</button>
</div>
</div>
</section>

<section class="section" id="seasonSection" hidden>
<h2>المواسم</h2>
<div class="season-row" id="seasons"></div>

<h2>الحلقات</h2>
<div class="episodes" id="episodes">
<div class="status">جاري تحميل الحلقات...</div>
</div>

<div class="actions">
<button class="btn secondary" id="prevEpisode">الحلقة السابقة</button>
<button class="btn" id="nextEpisode">الحلقة التالية ←</button>
</div>
</section>

<section class="section" id="errorSection" hidden>
<div class="status" id="errorMessage"></div>
</section>
</main>

<footer>NOTWIN TV © <span id="currentYear"></span></footer>

<script>
"use strict";

/* إعدادات TMDB */
const API_KEY = "26c5ad9f51818e110945285552c11a75";
const API_BASE = "https://api.themoviedb.org/3";
const IMAGE_BASE = "https://image.tmdb.org/t/p/";

const params = new URLSearchParams(location.search);
const itemId = params.get("id");
const type = params.get("type") === "tv" ? "tv" : "movie";

let itemData = null;
let seasonsData = [];
let episodesData = [];
let currentSeason = Number(params.get("s")) || 1;
let currentEpisode = Number(params.get("e")) || 1;
let favoriteItems = [];

const $ = id => document.getElementById(id);

$("currentYear").textContent = new Date().getFullYear();

try {
  const saved = JSON.parse(localStorage.getItem("notwin_favorites") || "[]");
  favoriteItems = Array.isArray(saved) ? saved : [];
} catch {
  favoriteItems = [];
}

$("backBtn").addEventListener("click", () => {
  if (history.length > 1) {
    history.back();
  } else {
    location.href = "./index.html";
  }
});

function imageURL(path, size = "w500") {
  return path ? IMAGE_BASE + size + path : "";
}

async function apiRequest(path) {
  const separator = path.includes("?") ? "&" : "?";
  const url = API_BASE + path + separator +
    "api_key=" + encodeURIComponent(API_KEY) +
    "&language=ar";

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("TMDB request failed: " + response.status);
  }

  return response.json();
}

function showError(message) {
  $("errorSection").hidden = false;
  $("errorMessage").textContent = message;
  $("playerTitle").textContent = "تعذّر تحميل العمل";
  $("playerNote").textContent = message;
}

function updateURL() {
  const url = new URL(location.href);
  url.searchParams.set("id", itemId);
  url.searchParams.set("type", type);

  if (type === "tv") {
    url.searchParams.set("s", currentSeason);
    url.searchParams.set("e", currentEpisode);
  }

  history.replaceState({}, "", url);
}

/*
  مصدر الفيديو الخارجي ليس مضمونًا.
  إذا لم يكن متاحًا أو لم يسمح بالتضمين،
  استعمل مصدرًا رسميًا تملك حق تضمينه.
*/
function setPlayer() {
  if (!itemId || !/^\d+$/.test(itemId)) return;

  const quality = $("quality").value;
  let embedURL;

  if (type === "movie") {
    embedURL = "https://cinesrc.st/embed/movie/" +
      encodeURIComponent(itemId);
  } else {
    embedURL = "https://cinesrc.st/embed/tv/" +
      encodeURIComponent(itemId) +
      "?s=" + encodeURIComponent(currentSeason) +
      "&e=" + encodeURIComponent(currentEpisode);
  }

  $("video").src = embedURL;

  $("playerNote").textContent =
    "إذا لم يعمل الفيديو، فقد يكون مصدر المشاهدة غير متاح أو لا يسمح بالتضمين. تقدر تستعمل الإعلان الرسمي أو تبحث عن منصات المشاهدة.";
}

$("quality").addEventListener("change", () => {
  setPlayer();
});

$("fullscreen").addEventListener("click", async () => {
  try {
    const frame = $("video");

    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else if (frame.requestFullscreen) {
      await frame.requestFullscreen();
    } else {
      await $("video").parentElement.requestFullscreen();
    }
  } catch {
    $("playerNote").textContent =
      "ما قدرناش نفتحو ملء الشاشة. جرّب زر الشاشة الكاملة داخل المشغّل.";
  }
});

/* المفضلة */
function favoriteKey() {
  return type + "-" + itemId;
}

function isFavorite() {
  const key = favoriteKey();

  return favoriteItems.some(item =>
    typeof item === "string"
      ? item === key
      : item && (
          item.key === key ||
          (String(item.id) === String(itemId) && item.type === type)
        )
  );
}

function updateFavoriteButton() {
  $("favoriteBtn").textContent = isFavorite()
    ? "♥ في المفضلة"
    : "♡ أضف للمفضلة";
}

$("favoriteBtn").addEventListener("click", () => {
  if (!itemData) return;

  const key = favoriteKey();

  if (isFavorite()) {
    favoriteItems = favoriteItems.filter(item =>
      typeof item === "string"
        ? item !== key
        : !(item && (
            item.key === key ||
            (String(item.id) === String(itemId) && item.type === type)
          ))
    );
  } else {
    favoriteItems.push({
      key,
      id: String(itemId),
      type,
      title: itemData.title || itemData.name || "",
      poster_path: itemData.poster_path || ""
    });
  }

  try {
    localStorage.setItem("notwin_favorites", JSON.stringify(favoriteItems));
    updateFavoriteButton();
  } catch {
    alert("ما قدرناش نحفظو المفضلة في المتصفح.");
  }
});

/* البحث عن منصات المشاهدة */
$("platformBtn").addEventListener("click", () => {
  const name = itemData
    ? (itemData.title || itemData.name || "")
    : "";

  const query = encodeURIComponent(name + " official streaming");

  window.open(
    "https://www.justwatch.com/search?q=" + query,
    "_blank",
    "noopener,noreferrer"
  );
});

/* جلب معلومات الفيلم أو المسلسل */
async function loadItem() {
  if (!itemId || !/^\d+$/.test(itemId)) {
    $("title").textContent = "رابط غير صالح";
    showError("افتح العمل بالضغط على غلافه من الصفحة الرئيسية.");
    return;
  }

  try {
    itemData = await apiRequest(
      "/" + type + "/" + encodeURIComponent(itemId) +
      "?append_to_response=videos"
    );

    const name = itemData.title || itemData.name || "بدون عنوان";

    document.title = name + " | NOTWIN TV";
    $("title").textContent = name;
    $("playerTitle").textContent = name;
    $("typeTag").textContent = type === "movie" ? "فيلم" : "مسلسل";

    const date = itemData.release_date || itemData.first_air_date || "";
    $("year").textContent = date.slice(0, 4) || "السنة غير معروفة";

    const rating = Number(itemData.vote_average);
    $("rating").textContent = "★ " +
      (Number.isFinite(rating) && rating > 0
        ? rating.toFixed(1) + "/10"
        : "—");

    $("runtime").textContent = itemData.runtime
      ? itemData.runtime + " دقيقة"
      : "";

    $("language").textContent = itemData.original_language
      ? itemData.original_language.toUpperCase()
      : "";

    $("overview").textContent = itemData.overview ||
      "القصة غير متوفرة باللغة العربية حاليًا.";

    $("poster").src = imageURL(itemData.poster_path);
    $("poster").alt = "غلاف " + name;

    $("poster").onerror = () => {
      $("poster").removeAttribute("src");
      $("poster").alt = "الغلاف غير متوفر";
    };

    updateFavoriteButton();

    const videos = itemData.videos?.results || [];

    const trailer = videos.find(video =>
      video.site === "YouTube" && video.type === "Trailer"
    ) || videos.find(video => video.site === "YouTube");

    if (trailer) {
      $("trailerBtn").hidden = false;

      $("trailerBtn").addEventListener("click", () => {
        window.open(
          "https://www.youtube.com/watch?v=" +
            encodeURIComponent(trailer.key),
          "_blank",
          "noopener,noreferrer"
        );
      });
    }

    if (type === "movie") {
      $("seasonSection").hidden = true;
      setPlayer();
    } else {
      $("seasonSection").hidden = false;
      await loadSeasons();
    }
  } catch (error) {
    console.error(error);
    $("title").textContent = "حدث خطأ";
    showError("ما قدرناش نجيبو معلومات العمل. تأكد من الإنترنت وعاود جرّب.");
  }
}

/* المواسم */
async function loadSeasons() {
  $("seasons").replaceChildren();

  seasonsData = (itemData.seasons || []).filter(season =>
    season.season_number > 0
  );

  if (!seasonsData.length) {
    $("episodes").innerHTML =
      '<div class="status">معلومات المواسم غير متوفرة.</div>';
    return;
  }

  if (!seasonsData.some(season =>
    season.season_number === currentSeason
  )) {
    currentSeason = seasonsData[0].season_number;
  }

  seasonsData.forEach(season => {
    const button = document.createElement("button");

    button.className = "season-btn";
    button.textContent = season.name ||
      ("الموسم " + season.season_number);

    if (season.season_number === currentSeason) {
      button.classList.add("active");
    }

    button.addEventListener("click", async () => {
      currentSeason = season.season_number;
      currentEpisode = 1;

      document.querySelectorAll(".season-btn").forEach(btn =>
        btn.classList.remove("active")
      );

      button.classList.add("active");

      await loadEpisodes(currentSeason);
    });

    $("seasons").appendChild(button);
  });

  await loadEpisodes(currentSeason);
}

/* الحلقات */
async function loadEpisodes(seasonNumber) {
  $("episodes").innerHTML =
    '<div class="status">جاري تحميل الحلقات...</div>';

  try {
    const data = await apiRequest(
      "/tv/" + encodeURIComponent(itemId) +
      "/season/" + encodeURIComponent(seasonNumber)
    );

    episodesData = data.episodes || [];
    $("episodes").replaceChildren();

    if (!episodesData.length) {
      $("episodes").innerHTML =
        '<div class="status">معلومات الحلقات غير متوفرة.</div>';
      return;
    }

    if (!episodesData.some(ep =>
      ep.episode_number === currentEpisode
    )) {
      currentEpisode = episodesData[0].episode_number;
    }

    episodesData.forEach(episode => {
      const button = document.createElement("button");
      button.className = "episode";

      if (episode.episode_number === currentEpisode) {
        button.classList.add("active");
      }

      const number = document.createElement("span");
      number.textContent = "الحلقة " + episode.episode_number;

      const name = document.createElement("small");
      name.textContent = episode.name || "بدون عنوان";

      button.append(number, name);

      button.addEventListener("click", () => {
        currentEpisode = episode.episode_number;

        document.querySelectorAll(".episode").forEach(btn =>
          btn.classList.remove("active")
        );

        button.classList.add("active");
        setPlayer();
        updateURL();
        updateEpisodeButtons();

        $("playerTitle").textContent =
          (itemData.name || itemData.title || "المسلسل") +
          " — الموسم " + currentSeason +
          "، الحلقة " + currentEpisode;
      });

      $("episodes").appendChild(button);
    });

    updateURL();
    setPlayer();
    updateEpisodeButtons();

    const selected = episodesData.find(ep =>
      ep.episode_number === currentEpisode
    );

    $("playerTitle").textContent =
      (itemData.name || itemData.title || "المسلسل") +
      " — الموسم " + currentSeason +
      "، الحلقة " + currentEpisode +
      (selected?.name ? " · " + selected.name : "");

  } catch (error) {
    console.error(error);

    $("episodes").innerHTML =
      '<div class="status">تعذّر تحميل الحلقات. جرّب مرة أخرى.</div>';
  }
}

/* أزرار الحلقة السابقة والتالية */
function updateEpisodeButtons() {
  const index = episodesData.findIndex(ep =>
    ep.episode_number === currentEpisode
  );

  $("prevEpisode").disabled = index <= 0;
  $("nextEpisode").disabled =
    index < 0 || index >= episodesData.length - 1;
}

$("prevEpisode").addEventListener("click", async () => {
  const index = episodesData.findIndex(ep =>
    ep.episode_number === currentEpisode
  );

  if (index > 0) {
    currentEpisode = episodesData[index - 1].episode_number;
    await loadEpisodes(currentSeason);
    return;
  }

  const seasonIndex = seasonsData.findIndex(season =>
    season.season_number === currentSeason
  );

  if (seasonIndex > 0) {
    currentSeason = seasonsData[seasonIndex - 1].season_number;

    document.querySelectorAll(".season-btn").forEach((button, i) => {
      button.classList.toggle("active", i === seasonIndex - 1);
    });

    await loadEpisodes(currentSeason);

    if (episodesData.length) {
      currentEpisode = episodesData[episodesData.length - 1].episode_number;
      await loadEpisodes(currentSeason);
    }
  }
});

$("nextEpisode").addEventListener("click", async () => {
  const index = episodesData.findIndex(ep =>
    ep.episode_number === currentEpisode
  );

  if (index >= 0 && index < episodesData.length - 1) {
    currentEpisode = episodesData[index + 1].episode_number;
    await loadEpisodes(currentSeason);
    return;
  }

  const seasonIndex = seasonsData.findIndex(season =>
    season.season_number === currentSeason
  );

  if (seasonIndex >= 0 && seasonIndex < seasonsData.length - 1) {
    currentSeason = seasonsData[seasonIndex + 1].season_number;
    currentEpisode = 1;

    document.querySelectorAll(".season-btn").forEach((button, i) => {
      button.classList.toggle("active", i === seasonIndex + 1);
    });

    await loadEpisodes(currentSeason);
  }
});

loadItem();
</script>
</body>
  </html>
