
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080610">
<title>المشاهدة | notwin tv</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080610;color:#f7f3ff;
 font-family:Arial,Tahoma,sans-serif
}
header{
 padding:16px;background:#100d1b;
 border-bottom:1px solid #30213f;
 display:flex;justify-content:space-between;
 align-items:center;gap:12px
}
.logo{font-size:22px;font-weight:bold;color:#c5a0ff}
a{color:#c5a0ff;text-decoration:none}
main{max-width:1000px;margin:auto;padding:18px}
h1{font-size:24px}
.muted{color:#b8adc9;line-height:1.8}
.player{
 width:100%;aspect-ratio:16/9;background:#000;
 border:1px solid #30213f;border-radius:12px;overflow:hidden
}
iframe{width:100%;height:100%;border:0;display:block}
.controls{
 display:flex;gap:10px;flex-wrap:wrap;margin:18px 0
}
button,select{
 background:#201532;color:#fff;border:1px solid #493363;
 padding:12px 14px;border-radius:9px;font-size:15px
}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
select{background:#100d1b}
.note{
 margin-top:18px;padding:14px;background:#100d1b;
 border:1px solid #30213f;border-radius:10px
}
.primary{background:#392151;border-color:#8b65b5}
#status{overflow-wrap:anywhere}

/* وضع المشاهدة */
body.watching{overflow:hidden}
body.watching header,
body.watching main>*:not(#player):not(#exitWatch){
 display:none!important
}
body.watching main{
 max-width:none;width:100%;height:100dvh;
 padding:0;margin:0
}
body.watching #player{
 position:fixed;inset:0;width:100%;height:100dvh;
 aspect-ratio:auto;border:0;border-radius:0;
 z-index:1000;background:#000
}
body.watching #player iframe{
 width:100%;height:100%
}
#exitWatch{
 display:none;position:fixed;top:12px;right:12px;
 z-index:1002;background:#201532eF;
 border:1px solid #8b65b5;border-radius:10px
}
body.watching #exitWatch{display:block}
@media(max-width:480px){
 main{padding:14px}
 h1{font-size:22px}
 .controls>*{flex:1}
}
</style>
</head>

<body>
<header>
 <a class="logo" href="./index.html">notwin tv</a>
 <a href="./index.html">العودة للرئيسية ←</a>
</header>

<main>
 <h1 id="title">المشاهدة</h1>
 <p class="muted" id="episodeLabel">اختار الموسم والحلقة.</p>

 <div class="player" id="player">
  <p style="padding:20px">اضغط على تحميل المشغّل لبدء المشاهدة.</p>
 </div>

 <button id="exitWatch">✕ الخروج من وضع المشاهدة</button>

 <div class="controls">
  <select id="season" aria-label="الموسم"></select>
  <select id="episode" aria-label="الحلقة"></select>

  <select id="quality" aria-label="جودة الفيديو">
   <option value="480">480p — توفير الإنترنت</option>
   <option value="720">720p — جودة أعلى</option>
  </select>

  <button id="prev">الحلقة السابقة</button>
  <button id="next">الحلقة التالية</button>
  <button id="play" class="primary">تحميل المشغّل</button>
  <button id="watchMode">🎬 وضع المشاهدة</button>
 </div>

 <div class="note muted" id="status">
  المشغّل لا يُحمّل حتى تضغط على الزر.
 </div>

 <p class="muted">
  الترجمة العربية متوفرة فقط إذا كان المصدر يوفّرها.
  الجودة المختارة تفضيل للمشغّل وليست ضمانًا لحدّ استهلاك البيانات.
 </p>
</main>

<script>
const params = new URLSearchParams(location.search);

const CONFIG = {
 id: params.get("id") || "",
 title: params.get("title") || "notwin tv",
 type: params.get("type") === "movie" ? "movie" : "tv",
 seasons: Math.max(1, Number(params.get("seasons")) || 1),
 episodes: Math.max(1, Number(params.get("episodes")) || 16)
};

const $ = id => document.getElementById(id);
const seasonSelect = $("season");
const episodeSelect = $("episode");
const player = $("player");
const statusBox = $("status");

let currentSeason = Math.min(
 CONFIG.seasons, Math.max(1, Number(params.get("s")) || 1)
);
let currentEpisode = Math.max(1, Number(params.get("e")) || 1);
let frame = null;
let quality = "480";

$("title").textContent = CONFIG.title;

function fillSelect(select, count, selected) {
 select.replaceChildren();
 for (let n = 1; n <= count; n++) {
  const option = document.createElement("option");
  option.value = n;
  option.textContent = n;
  option.selected = n === selected;
  select.appendChild(option);
 }
}

function updateLabel() {
 $("episodeLabel").textContent =
  CONFIG.type === "movie"
  ? "فيلم"
  : `الموسم ${currentSeason} — الحلقة ${currentEpisode}`;

 $("prev").disabled =
  CONFIG.type === "movie" ||
  (currentSeason === 1 && currentEpisode === 1);

 $("next").disabled = CONFIG.type === "movie";
}

function buildURL() {
 const color = "%23c5a0ff";

 if (CONFIG.type === "movie") {
  return `https://cinesrc.st/embed/movie/${CONFIG.id}` +
   `?color=${color}&quality=${quality}&autonext=false`;
 }

 return `https://cinesrc.st/embed/tv/${CONFIG.id}` +
  `?s=${currentSeason}&e=${currentEpisode}` +
  `&color=${color}&quality=${quality}&autonext=false`;
}

function loadPlayer() {
 if (!/^\d+$/.test(CONFIG.id)) {
  statusBox.textContent =
   "معرّف TMDB غير صحيح. لازم يكون رقمًا.";
  return;
 }

 frame = document.createElement("iframe");
 frame.src = buildURL();
 frame.title = "مشغّل notwin tv";
 frame.allow = "autoplay; fullscreen; picture-in-picture";
 frame.allowFullscreen = true;
 frame.loading = "eager";
 frame.referrerPolicy = "strict-origin-when-cross-origin";

 player.replaceChildren(frame);

 statusBox.textContent =
  `تم طلب المشغّل بجودة ${quality}p. انتظر تحميل الحلقة.`;

 updateLabel();
}

function changeEpisode(season, episode) {
 currentSeason = season;
 currentEpisode = episode;

 fillSelect(seasonSelect, CONFIG.seasons, currentSeason);
 fillSelect(episodeSelect, CONFIG.episodes, currentEpisode);

 updateLabel();
 loadPlayer();
}

seasonSelect.addEventListener("change", () => {
 changeEpisode(Number(seasonSelect.value), 1);
});

episodeSelect.addEventListener("change", () => {
 changeEpisode(currentSeason, Number(episodeSelect.value));
});

$("quality").addEventListener("change", () => {
 quality = $("quality").value;
 if (frame) loadPlayer();
});

$("play").addEventListener("click", loadPlayer);

$("prev").addEventListener("click", () => {
 if (CONFIG.type === "movie") return;

 if (currentEpisode > 1) {
  changeEpisode(currentSeason, currentEpisode - 1);
 } else if (currentSeason > 1) {
  changeEpisode(currentSeason - 1, CONFIG.episodes);
 }
});

$("next").addEventListener("click", () => {
 if (CONFIG.type === "movie") return;

 if (currentEpisode < CONFIG.episodes) {
  changeEpisode(currentSeason, currentEpisode + 1);
 } else if (currentSeason < CONFIG.seasons) {
  changeEpisode(currentSeason + 1, 1);
 }
});

async function enterWatchMode() {
 document.body.classList.add("watching");

 try {
  if (!document.fullscreenElement &&
      document.documentElement.requestFullscreen) {
   await document.documentElement.requestFullscreen();
  }
 } catch (e) {
  // وضع المشاهدة يبقى متاحًا حتى لو رفض المتصفح ملء الشاشة.
 }

 try {
  if (screen.orientation && screen.orientation.lock) {
   await screen.orientation.lock("landscape");
  }
 } catch (e) {
  statusBox.textContent =
   "وضع المشاهدة مفعّل. إذا لم يدُر الهاتف، دوّره يدويًا.";
 }
}

async function exitWatchMode() {
 document.body.classList.remove("watching");

 try {
  if (screen.orientation && screen.orientation.unlock) {
   screen.orientation.unlock();
  }
 } catch (e) {}

 try {
  if (document.fullscreenElement && document.exitFullscreen) {
   await document.exitFullscreen();
  }
 } catch (e) {}
}

$("watchMode").addEventListener("click", enterWatchMode);
$("exitWatch").addEventListener("click", exitWatchMode);

document.addEventListener("fullscreenchange", () => {
 if (!document.fullscreenElement) {
  document.body.classList.remove("watching");
  try {
   if (screen.orientation && screen.orientation.unlock) {
    screen.orientation.unlock();
   }
  } catch (e) {}
 }
});

fillSelect(seasonSelect, CONFIG.seasons, currentSeason);
fillSelect(episodeSelect, CONFIG.episodes, currentEpisode);
updateLabel();
</script>
</body>
</html>
