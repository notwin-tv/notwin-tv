
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>المشاهدة | NOTWIN TV</title>

<style>
:root {
  --bg: #080808;
  --card: #151515;
  --red: #e50914;
  --text: #fff;
  --muted: #aaa;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Tahoma, sans-serif;
}

button, select { font: inherit; }

button {
  cursor: pointer;
  border: 0;
  color: white;
  border-radius: 8px;
  padding: 10px 12px;
  background: var(--card);
}

button:active { transform: scale(.97); }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px;
  border-bottom: 1px solid #242424;
}

.logo {
  font-size: 23px;
  font-weight: 900;
}

.logo span, .player-brand span { color: var(--red); }

.home-btn {
  background: var(--red);
  font-weight: bold;
}

main {
  width: 100%;
  max-width: 950px;
  margin: auto;
  padding: 16px 12px 28px;
}

.title {
  margin: 3px 0 14px;
  font-size: 20px;
  line-height: 1.5;
}

.player-shell {
  position: relative;
  overflow: hidden;
  background: #000;
  border: 1px solid #292929;
  border-radius: 12px;
}

.player {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  overflow: hidden;
}

.player iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
}

.player-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse, #251010 0%, #080808 75%);
}

.center-play {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 76px;
  height: 76px;
  padding: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 35px #e5091466;
  transition: background .2s, scale .2s;
  z-index: 2;
}

.center-play:hover {
  background: #ff1824;
  scale: 1.08;
}

.center-play span {
  font-size: 34px;
  margin-left: 5px;
}

.player-brand {
  position: absolute;
  bottom: 14px;
  left: 16px;
  font-size: 15px;
  opacity: .8;
  direction: ltr;
}

.main-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 10px;
  background: #101010;
}

.main-actions button {
  min-height: 42px;
  font-size: 13px;
  font-weight: bold;
}

.fullscreen-btn { background: #242424; }

.favorite-btn.saved {
  color: #ff424b;
  border: 1px solid var(--red);
}

.episode-nav {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

.episode-nav button {
  padding: 10px 5px;
  font-size: 12px;
  background: #171717;
  border: 1px solid #292929;
}

button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.episodes-panel {
  display: none;
  margin-top: 12px;
  padding: 13px;
  background: #111;
  border: 1px solid #292929;
  border-radius: 10px;
}

.episodes-panel.open { display: block; }

.season-select {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  background: #202020;
  color: white;
  border: 1px solid #383838;
  border-radius: 8px;
}

.episodes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
  gap: 8px;
}

.episode-btn {
  padding: 12px 5px;
  background: #202020;
  border: 1px solid #333;
}

.episode-btn.active {
  background: var(--red);
  border-color: var(--red);
}

.message {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
  margin: 12px 2px 0;
}

/* المشغّل فقط في ملء الشاشة */
.player-shell:fullscreen,
.player-shell:-webkit-full-screen {
  position: fixed;
  inset: 0;
  z-index: 99999;
  width: 100vw;
  height: 100vh;
  max-width: none;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  overflow: hidden;
  background: #000;
}

.player-shell:fullscreen .player,
.player-shell:-webkit-full-screen .player {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  max-height: none;
  aspect-ratio: auto;
}

.player-shell:fullscreen .main-actions,
.player-shell:-webkit-full-screen .main-actions {
  display: none !important;
}

.player-shell:fullscreen .player iframe,
.player-shell:-webkit-full-screen .player iframe {
  width: 100%;
  height: 100%;
}

@media (max-width: 420px) {
  .title { font-size: 18px; }
  .center-play { width: 66px; height: 66px; }
  .center-play span { font-size: 30px; }
}
</style>
</head>

<body>
<header class="topbar">
  <div class="logo">NOTWIN <span>TV</span></div>
  <button class="home-btn" id="homeBtn">الرئيسية</button>
</header>

<main>
  <h1 class="title" id="contentTitle">المشاهدة</h1>

  <section class="player-shell" id="playerShell">
    <div class="player" id="player">
      <div class="player-placeholder" id="placeholder">
        <button class="center-play" id="centerPlay" aria-label="المشاهدة داخل الموقع">
          <span>▶</span>
        </button>
        <strong class="player-brand">NOTWIN <span>TV</span></strong>
      </div>
    </div>

    <div class="main-actions">
      <button class="fullscreen-btn" id="fullscreenBtn">⛶ ملء الشاشة</button>
      <button class="favorite-btn" id="favoriteBtn">♡ المفضلة</button>
    </div>
  </section>

  <div class="episode-nav">
    <button id="previousBtn">السابقة</button>
    <button id="episodesBtn">الحلقات</button>
    <button id="nextBtn">التالية</button>
  </div>

  <section class="episodes-panel" id="episodesPanel">
    <select class="season-select" id="seasonSelect" aria-label="اختيار الموسم"></select>
    <div class="episodes-grid" id="episodesGrid"></div>
  </section>

  <p class="message" id="message" hidden></p>
</main>

<script>
const params = new URLSearchParams(location.search);
const contentId = params.get("id");
const contentType = params.get("type") === "tv" ? "tv" : "movie";

const API_KEY = "26c5ad9f51818e110945285552c11a75";
const API_BASE = "https://api.themoviedb.org/3";

const playerShell = document.getElementById("playerShell");
const player = document.getElementById("player");
const placeholder = document.getElementById("placeholder");
const titleElement = document.getElementById("contentTitle");
const centerPlay = document.getElementById("centerPlay");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const favoriteBtn = document.getElementById("favoriteBtn");
const episodesBtn = document.getElementById("episodesBtn");
const episodesPanel = document.getElementById("episodesPanel");
const seasonSelect = document.getElementById("seasonSelect");
const episodesGrid = document.getElementById("episodesGrid");
const previousBtn = document.getElementById("previousBtn");
const nextBtn = document.getElementById("nextBtn");
const message = document.getElementById("message");

let season = 1;
let episode = 1;
let totalSeasons = 1;
let currentEpisodeCount = 24;
let playerLoaded = false;

function showMessage(text) {
  message.textContent = text;
  message.hidden = false;
}

function hideMessage() {
  message.hidden = true;
  message.textContent = "";
}

document.getElementById("homeBtn").addEventListener("click", () => {
  location.href = "index.html";
});

function getEmbedUrl() {
  if (contentType === "tv") {
    return `https://cinesrc.st/embed/tv/${encodeURIComponent(contentId)}?s=${season}&e=${episode}`;
  }
  return `https://cinesrc.st/embed/movie/${encodeURIComponent(contentId)}`;
}

function loadPlayer() {
  if (!contentId) {
    showMessage("رابط العمل غير صحيح. ارجع للرئيسية واختار العمل من جديد.");
    return;
  }

  hideMessage();
  placeholder.style.display = "none";

  let iframe = document.getElementById("videoFrame");

  if (!iframe) {
    iframe = document.createElement("iframe");
    iframe.id = "videoFrame";
    iframe.title = "مشغّل الفيديو";
    iframe.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media";
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = "no-referrer";
    player.appendChild(iframe);
  }

  iframe.src = getEmbedUrl();
  playerLoaded = true;
}

centerPlay.addEventListener("click", loadPlayer);

async function toggleFullscreen() {
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
      return;
    }

    if (!playerLoaded) loadPlayer();

    if (playerShell.requestFullscreen) {
      await playerShell.requestFullscreen();
    } else if (playerShell.webkitRequestFullscreen) {
      playerShell.webkitRequestFullscreen();
    } else {
      showMessage("متصفحك لا يدعم ملء الشاشة هنا. جرّب Chrome أو دوّر الهاتف أفقياً.");
      return;
    }

    if (screen.orientation && screen.orientation.lock) {
      try {
        await screen.orientation.lock("landscape");
      } catch (_) {
        /* بعض المتصفحات لا تسمح بقفل اتجاه الشاشة */
      }
    }
  } catch (_) {
    showMessage("تعذّر تشغيل ملء الشاشة. جرّب تدوير الهاتف أفقياً.");
  }
}

fullscreenBtn.addEventListener("click", toggleFullscreen);

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && screen.orientation?.unlock) {
    try { screen.orientation.unlock(); } catch (_) {}
  }
});

document.addEventListener("webkitfullscreenchange", () => {
  if (!document.webkitFullscreenElement && screen.orientation?.unlock) {
    try { screen.orientation.unlock(); } catch (_) {}
  }
});

function getFavorites() {
  try {
    return JSON.parse(localStorage.getItem("notwin_tv_favorites") || "[]");
  } catch (_) {
    return [];
  }
}

function favoriteKey() {
  return `${contentType}-${contentId}`;
}

function updateFavoriteButton() {
  const saved = getFavorites().some(item => item.key === favoriteKey());
  favoriteBtn.classList.toggle("saved", saved);
  favoriteBtn.textContent = saved ? "♥ في المفضلة" : "♡ المفضلة";
}

favoriteBtn.addEventListener("click", () => {
  if (!contentId) return;

  const favorites = getFavorites();
  const index = favorites.findIndex(item => item.key === favoriteKey());

  if (index >= 0) {
    favorites.splice(index, 1);
  } else {
    favorites.push({
      key: favoriteKey(),
      id: contentId,
      type: contentType,
      title: titleElement.textContent
    });
  }

  try {
    localStorage.setItem("notwin_tv_favorites", JSON.stringify(favorites));
    updateFavoriteButton();
    hideMessage();
  } catch (_) {
    showMessage("تعذّر حفظ المفضلة في المتصفح.");
  }
});

function buildSeasonOptions() {
  seasonSelect.innerHTML = "";

  for (let s = 1; s <= totalSeasons; s++) {
    const option = document.createElement("option");
    option.value = s;
    option.textContent = `الموسم ${s}`;
    seasonSelect.appendChild(option);
  }

  seasonSelect.value = String(season);
}

function renderEpisodes(count) {
  episodesGrid.innerHTML = "";

  for (let e = 1; e <= count; e++) {
    const btn = document.createElement("button");
    btn.className = "episode-btn" + (e === episode ? " active" : "");
    btn.textContent = `الحلقة ${e}`;

    btn.addEventListener("click", () => {
      episode = e;
      renderEpisodes(currentEpisodeCount);
      loadPlayer();
      updateNavigationButtons();
    });

    episodesGrid.appendChild(btn);
  }
}

async function loadSeasonInfo() {
  try {
    const response = await fetch(
      `${API_BASE}/tv/${encodeURIComponent(contentId)}/season/${season}?api_key=${API_KEY}&language=ar`
    );

    if (!response.ok) throw new Error("Season unavailable");

    const data = await response.json();
    currentEpisodeCount = Array.isArray(data.episodes) && data.episodes.length
      ? data.episodes.length
      : 24;
  } catch (_) {
    currentEpisodeCount = 24;
  }

  seasonSelect.value = String(season);
  renderEpisodes(currentEpisodeCount);
  updateNavigationButtons();
}

function updateNavigationButtons() {
  previousBtn.disabled = contentType !== "tv" || (season === 1 && episode === 1);
  nextBtn.disabled = contentType !== "tv" ||
    (season === totalSeasons && episode >= currentEpisodeCount);
}

episodesBtn.addEventListener("click", async () => {
  if (contentType !== "tv") return;

  episodesPanel.classList.toggle("open");

  if (episodesPanel.classList.contains("open")) {
    await loadSeasonInfo();
  }
});

seasonSelect.addEventListener("change", async () => {
  season = Number(seasonSelect.value) || 1;
  episode = 1;
  await loadSeasonInfo();
});

previousBtn.addEventListener("click", async () => {
  if (contentType !== "tv") return;

  if (episode > 1) {
    episode--;
  } else if (season > 1) {
    season--;
    episode = 1;
  } else {
    return;
  }

  await loadSeasonInfo();
  loadPlayer();
});

nextBtn.addEventListener("click", async () => {
  if (contentType !== "tv") return;

  if (episode < currentEpisodeCount) {
    episode++;
  } else if (season < totalSeasons) {
    season++;
    episode = 1;
  } else {
    return;
  }

  await loadSeasonInfo();
  loadPlayer();
});

async function loadContentInfo() {
  if (!contentId) {
    titleElement.textContent = "المشاهدة";
    showMessage("رابط العمل ناقصه المعرّف. ارجع للرئيسية واختار العمل.");
    return;
  }

  try {
    const response = await fetch(
      `${API_BASE}/${contentType}/${encodeURIComponent(contentId)}?api_key=${API_KEY}&language=ar`
    );

    if (!response.ok) throw new Error("Title unavailable");

    const data = await response.json();
    titleElement.textContent = data.title || data.name || "المشاهدة";

    if (contentType === "tv") {
      totalSeasons = Math.max(1, Number(data.number_of_seasons) || 1);
      buildSeasonOptions();
      await loadSeasonInfo();
    }
  } catch (_) {
    titleElement.textContent = "المشاهدة";
  }

  if (contentType === "movie") {
    episodesBtn.disabled = true;
    episodesBtn.style.opacity = ".35";
  }

  updateNavigationButtons();
  updateFavoriteButton();
}

updateFavoriteButton();
loadContentInfo();
</script>
</body>
</html>
