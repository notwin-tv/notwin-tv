
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060c">
<title>المشاهدة | NOTWIN TV</title>

<style>
:root {
  --bg: #07060c;
  --panel: #110d1a;
  --purple: #a78bfa;
  --purple-dark: #211632;
  --text: #f5f2ff;
  --muted: #aaa3ba;
  --border: rgba(177, 145, 255, .17);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
  color-scheme: dark;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(90, 55, 135, .08), transparent 45%),
    var(--bg);
  color: var(--text);
  font-family: Arial, Tahoma, sans-serif;
}

button, select {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
  text-decoration: none;
}

.page {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  padding: 16px 15px 35px;
}

/* Header */
.topbar {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas:
    "brand home"
    "title title";
  align-items: center;
  gap: 15px 12px;
  margin-bottom: 21px;
}

.brand {
  grid-area: brand;
  justify-self: start;
  color: var(--purple);
  font-size: clamp(23px, 5vw, 29px);
  font-weight: 900;
  letter-spacing: -.8px;
  white-space: nowrap;
}

.home-link {
  grid-area: home;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-width: 124px;
  min-height: 48px;
  padding: 11px 17px;
  border: 1px solid rgba(167, 139, 250, .38);
  border-radius: 14px;
  background: linear-gradient(135deg, #251938, #15101f);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  box-shadow: 0 4px 15px rgba(128, 96, 217, .12);
  white-space: nowrap;
  transition: transform .15s, background .15s;
}

.home-link .home-icon {
  font-size: 22px;
  line-height: 1;
}

.home-link:active {
  transform: scale(.97);
  background: #33224d;
}

.show-title {
  grid-area: title;
  width: 100%;
  min-width: 0;
  overflow: hidden;
  padding: 12px 13px;
  border: 1px solid rgba(177, 145, 255, .10);
  border-radius: 13px;
  background: rgba(17, 13, 26, .75);
  color: #eee8fb;
  font-size: clamp(16px, 4vw, 21px);
  font-weight: 600;
  text-align: center;
  direction: ltr;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Video player */
.player-card {
  width: 100%;
  overflow: hidden;
  position: relative;
  border: 1px solid rgba(255, 255, 255, .045);
  border-radius: 19px;
  background: #000;
  box-shadow: 0 12px 34px rgba(0, 0, 0, .24);
}

.player-screen {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
}

.player-screen iframe {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
}

.player-top {
  position: absolute;
  z-index: 3;
  top: 10px;
  right: 11px;
  left: 11px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
}

.episode-label,
.fullscreen-btn {
  pointer-events: auto;
  background: rgba(0, 0, 0, .72);
  color: #fff;
  backdrop-filter: blur(8px);
}

.episode-label {
  padding: 8px 11px;
  border: 1px solid rgba(255, 255, 255, .08);
  border-radius: 10px;
  font-size: 13px;
}

.fullscreen-btn {
  display: grid;
  place-items: center;
  width: 39px;
  height: 39px;
  border: 1px solid rgba(255, 255, 255, .10);
  border-radius: 11px;
  font-size: 25px;
  cursor: pointer;
}

.player-screen:fullscreen {
  width: 100vw;
  height: 100vh;
  aspect-ratio: auto;
  border-radius: 0;
  background: #000;
}

.player-screen:fullscreen iframe {
  width: 100%;
  height: 100%;
}

/* Navigation controls */
.controls {
  display: grid;
  grid-template-columns: 1fr 1.1fr 1fr;
  gap: 10px;
  margin: 16px 0 0;
}

.control-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-width: 0;
  min-height: 72px;
  padding: 10px 5px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: var(--panel);
  color: var(--purple);
  cursor: pointer;
  transition: transform .15s, background .15s;
}

.control-btn:active {
  transform: scale(.97);
  background: #211831;
}

.control-btn:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.control-btn .symbol {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
}

.control-btn .label {
  color: #e2d9f1;
  font-size: 13px;
}

.control-btn.main {
  border-color: rgba(167, 139, 250, .28);
  background: #191124;
}

/* Seasons and episodes */
.episodes-panel {
  display: none;
  margin-top: 15px;
  padding: 15px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: #100d18;
}

.episodes-panel.open {
  display: block;
}

.selector-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.selector-group label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 13px;
}

.selector-group select {
  width: 100%;
  min-width: 0;
  padding: 12px 9px;
  border: 1px solid var(--border);
  border-radius: 11px;
  outline: none;
  background: #09070f;
  color: #fff;
}

.selector-group select:focus {
  border-color: var(--purple);
}

.episode-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(47px, 1fr));
  gap: 8px;
}

.episode-item {
  min-height: 43px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #0a0810;
  color: #ddd4ee;
  cursor: pointer;
}

.episode-item.active {
  border-color: var(--purple);
  background: #33224d;
  color: #fff;
}

.loading-text {
  padding-top: 12px;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}

.error-text {
  color: #f0b9cb;
}

@media (min-width: 650px) {
  .page {
    padding-top: 25px;
  }

  .topbar {
    grid-template-columns: 1fr auto 1fr;
    grid-template-areas: "brand title home";
    gap: 20px;
    margin-bottom: 25px;
  }

  .show-title {
    max-width: 440px;
    border: 0;
    background: transparent;
    text-align: center;
  }

  .home-link {
    justify-self: end;
  }

  .player-card {
    border-radius: 22px;
  }

  .controls {
    max-width: 490px;
    margin: 19px auto 0;
    gap: 13px;
  }

  .control-btn {
    min-height: 76px;
  }
}

@media (max-width: 380px) {
  .page {
    padding: 12px 10px 28px;
  }

  .topbar {
    gap: 12px 8px;
    margin-bottom: 15px;
  }

  .brand {
    font-size: 22px;
  }

  .home-link {
    min-width: 110px;
    min-height: 44px;
    padding: 9px 12px;
    gap: 7px;
    font-size: 13px;
  }

  .home-link .home-icon {
    font-size: 20px;
  }

  .show-title {
    padding: 10px;
    font-size: 15px;
  }

  .player-card {
    border-radius: 15px;
  }

  .controls {
    gap: 7px;
    margin-top: 12px;
  }

  .control-btn {
    min-height: 64px;
    border-radius: 12px;
  }

  .control-btn .symbol {
    font-size: 21px;
  }

  .control-btn .label {
    font-size: 12px;
  }
}
</style>
</head>

<body>
<div class="page">

  <header class="topbar">
    <a class="brand" href="./index.html">notwin tv</a>

    <div class="show-title" id="showTitle">
      جاري تحميل المسلسل...
    </div>

    <a class="home-link" href="./index.html" aria-label="العودة إلى الصفحة الرئيسية">
      <span class="home-icon" aria-hidden="true">⌂</span>
      <span>الرئيسية</span>
    </a>
  </header>

  <main>
    <section class="player-card" aria-label="مشغل المسلسل">
      <div class="player-screen" id="playerScreen">

        <div class="player-top">
          <div class="episode-label" id="episodeLabel">الحلقة 1</div>

          <button
            class="fullscreen-btn"
            id="fullscreenBtn"
            type="button"
            aria-label="ملء الشاشة"
            title="ملء الشاشة">⛶</button>
        </div>

        <iframe
          id="videoFrame"
          title="مشغل المسلسل"
          src="about:blank"
          allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
          allowfullscreen
          referrerpolicy="origin">
        </iframe>

      </div>
    </section>

    <nav class="controls" aria-label="التنقل بين الحلقات">

      <button class="control-btn" id="previousBtn" type="button">
        <span class="symbol" aria-hidden="true">|◀</span>
        <span class="label">السابقة</span>
      </button>

      <button
        class="control-btn main"
        id="episodesBtn"
        type="button"
        aria-expanded="false"
        aria-controls="episodesPanel">
        <span class="symbol" aria-hidden="true">☷</span>
        <span class="label">الحلقات</span>
      </button>

      <button class="control-btn" id="nextBtn" type="button">
        <span class="symbol" aria-hidden="true">▶|</span>
        <span class="label">التالية</span>
      </button>

    </nav>

    <section class="episodes-panel" id="episodesPanel">
      <div class="selector-row">

        <div class="selector-group">
          <label for="seasonSelect">اختيار الموسم</label>
          <select id="seasonSelect">
            <option value="1">الموسم 1</option>
          </select>
        </div>

        <div class="selector-group">
          <label for="episodeSelect">اختيار الحلقة</label>
          <select id="episodeSelect">
            <option value="1">الحلقة 1</option>
          </select>
        </div>

      </div>

      <div class="episode-list" id="episodeList"></div>
      <div class="loading-text" id="episodesStatus" aria-live="polite"></div>
    </section>
  </main>
</div>

<script>
(() => {
  "use strict";

  const TMDB_KEY = "26c5ad9f51818e110945285552c11a75";
  const TMDB_BASE = "https://api.themoviedb.org/3";
  const EMBED_BASE = "https://cinesrc.st/embed/tv/";

  const params = new URLSearchParams(location.search);
  const showId = params.get("id");

  let season = Math.max(1, parseInt(params.get("season") || "1", 10) || 1);
  let episode = Math.max(1, parseInt(params.get("episode") || "1", 10) || 1);

  const $ = id => document.getElementById(id);

  const showTitle = $("showTitle");
  const episodeLabel = $("episodeLabel");
  const videoFrame = $("videoFrame");
  const playerScreen = $("playerScreen");
  const fullscreenBtn = $("fullscreenBtn");
  const episodesBtn = $("episodesBtn");
  const episodesPanel = $("episodesPanel");
  const seasonSelect = $("seasonSelect");
  const episodeSelect = $("episodeSelect");
  const episodeList = $("episodeList");
  const episodesStatus = $("episodesStatus");
  const previousBtn = $("previousBtn");
  const nextBtn = $("nextBtn");

  let currentSeasonData = null;
  let showSeasons = [];

  function setStatus(message, isError = false) {
    episodesStatus.textContent = message;
    episodesStatus.classList.toggle("error-text", isError);
  }

  async function fetchTmdb(path) {
    const url = `${TMDB_BASE}${path}?api_key=${encodeURIComponent(TMDB_KEY)}&language=ar`;
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(`TMDB HTTP ${response.status}`);
    }

    return response.json();
  }

  function updateUrl() {
    const url = new URL(location.href);
    url.searchParams.set("season", season);
    url.searchParams.set("episode", episode);
    history.replaceState({}, "", url);
  }

  function updatePlayer() {
    episodeLabel.textContent = `الموسم ${season} · الحلقة ${episode}`;

    if (showId) {
      videoFrame.src =
        `${EMBED_BASE}${encodeURIComponent(showId)}` +
        `?s=${season}&e=${episode}`;
    }

    seasonSelect.value = String(season);
    episodeSelect.value = String(episode);

    previousBtn.disabled = season === 1 && episode <= 1;
    updateUrl();
  }

  function setEpisodeOptions(count) {
    const total = Math.max(1, Number(count) || 1);
    episodeSelect.replaceChildren();

    for (let i = 1; i <= total; i++) {
      const option = document.createElement("option");
      option.value = String(i);
      option.textContent = `الحلقة ${i}`;
      episodeSelect.appendChild(option);
    }

    if (episode > total) episode = total;
    episodeSelect.value = String(episode);
  }

  function renderEpisodeButtons(count) {
    episodeList.replaceChildren();
    const total = Math.max(1, Number(count) || 1);

    for (let i = 1; i <= total; i++) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "episode-item";
      button.textContent = String(i);
      button.setAttribute("aria-label", `الحلقة ${i}`);

      button.addEventListener("click", () => {
        episode = i;
        updatePlayer();
        syncEpisodeHighlight();
      });

      episodeList.appendChild(button);
    }

    syncEpisodeHighlight();
  }

  function syncEpisodeHighlight() {
    [...episodeList.children].forEach((button, index) => {
      button.classList.toggle("active", index + 1 === episode);
    });
  }

  async function loadSeason(seasonNumber) {
    setStatus("جاري تحميل الحلقات...");

    try {
      const data = await fetchTmdb(
        `/tv/${encodeURIComponent(showId)}/season/${seasonNumber}`
      );

      currentSeasonData = data;
      const count = data.episodes?.length || 1;

      if (data.episodes?.length) {
        const episodeExists = data.episodes.some(
          item => item.episode_number === episode
        );

        if (!episodeExists) episode = 1;
      } else {
        episode = 1;
      }

      setEpisodeOptions(count);
      renderEpisodeButtons(count);

      setStatus(
        data.episodes?.length
          ? ""
          : "لم يتم العثور على حلقات لهذا الموسم."
      );
    } catch (error) {
      console.error("Season loading error:", error);
      currentSeasonData = null;
      setEpisodeOptions(episode);
      renderEpisodeButtons(episode);
      setStatus("تعذر تحميل قائمة الحلقات. تحقق من اتصال الإنترنت.", true);
    }

    updatePlayer();
  }

  async function loadShow() {
    if (!showId) {
      showTitle.textContent = "المسلسل غير محدد";
      videoFrame.src = "about:blank";
      previousBtn.disabled = true;
      nextBtn.disabled = true;
      setStatus("افتح المسلسل من الصفحة الرئيسية أولًا.", true);
      return;
    }

    try {
      const data = await fetchTmdb(`/tv/${encodeURIComponent(showId)}`);

      showTitle.textContent =
        data.name || data.original_name || "المشاهدة";

      showSeasons = (data.seasons || [])
        .filter(item => item.season_number > 0)
        .map(item => item.season_number);

      seasonSelect.replaceChildren();

      if (showSeasons.length) {
        showSeasons.forEach(number => {
          const option = document.createElement("option");
          option.value = String(number);
          option.textContent = `الموسم ${number}`;
          seasonSelect.appendChild(option);
        });

        if (!showSeasons.includes(season)) {
          season = showSeasons[0];
        }
      } else {
        const option = document.createElement("option");
        option.value = String(season);
        option.textContent = `الموسم ${season}`;
        seasonSelect.appendChild(option);
      }

      seasonSelect.value = String(season);
      await loadSeason(season);
    } catch (error) {
      console.error("Show loading error:", error);
      showTitle.textContent = "المشاهدة";
      setStatus("تعذر تحميل معلومات المسلسل. تحقق من الاتصال.", true);
      setEpisodeOptions(episode);
      renderEpisodeButtons(episode);
      updatePlayer();
    }
  }

  previousBtn.addEventListener("click", async () => {
    if (season === 1 && episode <= 1) return;

    if (episode > 1) {
      episode--;
      updatePlayer();
      syncEpisodeHighlight();
      return;
    }

    const previousSeasons = showSeasons.filter(number => number < season);

    if (!previousSeasons.length) return;

    season = Math.max(...previousSeasons);
    episode = 1;

    await loadSeason(season);

    if (currentSeasonData?.episodes?.length) {
      episode = currentSeasonData.episodes.length;
      updatePlayer();
      syncEpisodeHighlight();
    }
  });

  nextBtn.addEventListener("click", async () => {
    const total = currentSeasonData?.episodes?.length || episodeSelect.options.length || 1;

    if (episode < total) {
      episode++;
      updatePlayer();
      syncEpisodeHighlight();
      return;
    }

    const nextSeasons = showSeasons.filter(number => number > season);

    if (!nextSeasons.length) {
      setStatus("وصلت إلى آخر حلقة متاحة.");
      return;
    }

    season = Math.min(...nextSeasons);
    episode = 1;
    await loadSeason(season);
  });

  episodesBtn.addEventListener("click", () => {
    const isOpen = episodesPanel.classList.toggle("open");

    episodesBtn.setAttribute("aria-expanded", String(isOpen));

    if (isOpen) {
      episodesPanel.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }
  });

  seasonSelect.addEventListener("change", async () => {
    season = Number(seasonSelect.value) || 1;
    episode = 1;
    await loadSeason(season);
  });

  episodeSelect.addEventListener("change", () => {
    episode = Number(episodeSelect.value) || 1;
    updatePlayer();
    syncEpisodeHighlight();
  });

  fullscreenBtn.addEventListener("click", async () => {
    try {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
        return;
      }

      if (playerScreen.requestFullscreen) {
        await playerScreen.requestFullscreen();
      } else if (videoFrame.requestFullscreen) {
        await videoFrame.requestFullscreen();
      }

      if (screen.orientation?.lock) {
        try {
          await screen.orientation.lock("landscape");
        } catch (_) {
          // Some mobile browsers do not allow orientation locking.
        }
      }
    } catch (error) {
      console.warn("Fullscreen unavailable:", error);
    }
  });

  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && screen.orientation?.unlock) {
      try {
        screen.orientation.unlock();
      } catch (_) {}
    }
  });

  loadShow();
})();
</script>
</body>
</html>
