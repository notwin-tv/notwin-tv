
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080610">
<title>المشاهدة | notwin tv</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080610;color:#f7f3ff;
 font-family:Arial,Tahoma,sans-serif
}
header{
 padding:18px;background:#100d1b;
 border-bottom:1px solid #30213f;
 display:flex;justify-content:space-between;align-items:center
}
.logo{font-size:22px;font-weight:bold;color:#c5a0ff}
a{color:#c5a0ff;text-decoration:none}
main{max-width:1000px;margin:auto;padding:18px}
h1{font-size:24px}
.muted{color:#b8adc9;line-height:1.8}
.player{
 width:100%;aspect-ratio:16/9;background:#000;
 border:1px solid #30213f;border-radius:12px;overflow:hidden
}
iframe{width:100%;height:100%;border:0}
.controls{
 display:flex;gap:10px;flex-wrap:wrap;margin:18px 0
}
button{
 background:#201532;color:#fff;border:1px solid #493363;
 padding:12px 16px;border-radius:9px;cursor:pointer
}
button:disabled{opacity:.4}
select{
 background:#100d1b;color:white;border:1px solid #493363;
 padding:12px;border-radius:9px
}
.note{
 margin-top:18px;padding:14px;background:#100d1b;
 border:1px solid #30213f;border-radius:10px
}
</style>
</head>
<body>
<header>
 <a class="logo" href="./index.html">notwin tv</a>
 <a href="./index.html">العودة للرئيسية ←</a>
</header>

<main>
 <h1 id="title">المشاهدة</h1>
 <p class="muted" id="episodeLabel">اختار الموسم والحلقة.</p>

 <div class="player" id="player">
  <p style="padding:20px">حمّل صفحة العمل لتشغيل المشغّل.</p>
 </div>

 <div class="controls">
  <select id="season" aria-label="الموسم"></select>
  <select id="episode" aria-label="الحلقة"></select>
  <button id="prev">الحلقة السابقة</button>
  <button id="next">الحلقة التالية</button>
  <button id="play">تحميل المشغّل</button>
 </div>

 <div class="note muted" id="status">
  المشغّل لا يُحمّل إلا بعد الضغط على الزر.
 </div>
 <p class="muted">
  توفر الحلقات والترجمة يعتمد على المصدر الخارجي.
 </p>
</main>

<script>
const params = new URLSearchParams(location.search);

// غيّر هذه القيم حسب العمل الذي تضيفه
const CONFIG = {
 id: params.get("id") || "",
 title: params.get("title") || "notwin tv",
 type: params.get("type") || "tv",
 seasons: Math.max(1, Number(params.get("seasons")) || 1),
 episodes: Math.max(1, Number(params.get("episodes")) || 16)
};

const seasonSelect = document.getElementById("season");
const episodeSelect = document.getElementById("episode");
const player = document.getElementById("player");
const statusBox = document.getElementById("status");
let currentSeason = Math.max(1, Number(params.get("s")) || 1);
let currentEpisode = Math.max(1, Number(params.get("e")) || 1);

document.getElementById("title").textContent = CONFIG.title;

function fillSelect(select, count, selected) {
 select.replaceChildren();
 for (let n = 1; n <= count; n++) {
  const option = document.createElement("option");
  option.value = n;
  option.textContent = n;
  option.selected = n === selected;
  select.appendChild(option);
 }
}

function updateEpisodeLabel() {
 document.getElementById("episodeLabel").textContent =
  CONFIG.type === "movie"
  ? "فيلم"
  : `الموسم ${currentSeason} — الحلقة ${currentEpisode}`;

 document.getElementById("prev").disabled =
  currentSeason === 1 && currentEpisode === 1;

 document.getElementById("next").disabled =
  currentEpisode >= CONFIG.episodes;
}

function loadPlayer() {
 if (!/^\d+$/.test(CONFIG.id)) {
  statusBox.textContent =
   "لازم تحط معرّف TMDB رقمي صحيح للعمل قبل التشغيل.";
  return;
 }

 const src = CONFIG.type === "movie"
  ? `https://cinesrc.st/embed/movie/${CONFIG.id}?color=%23c5a0ff`
  : `https://cinesrc.st/embed/tv/${CONFIG.id}?s=${currentSeason}&e=${currentEpisode}&color=%23c5a0ff&autonext=false`;

 const frame = document.createElement("iframe");
 frame.src = src;
 frame.title = "مشغّل الفيديو";
 frame.allow = "autoplay; fullscreen; picture-in-picture";
 frame.allowFullscreen = true;
 frame.referrerPolicy = "strict-origin-when-cross-origin";

 player.replaceChildren(frame);
 statusBox.textContent =
  "تم طلب المشغّل. إذا ما خدمش، جرّب التحقق من توفر الحلقة.";

 updateEpisodeLabel();
}

fillSelect(seasonSelect, CONFIG.seasons, currentSeason);
fillSelect(episodeSelect, CONFIG.episodes, currentEpisode);
updateEpisodeLabel();

seasonSelect.addEventListener("change", () => {
 currentSeason = Number(seasonSelect.value);
 currentEpisode = 1;
 fillSelect(episodeSelect, CONFIG.episodes, 1);
 updateEpisodeLabel();
 loadPlayer();
});

episodeSelect.addEventListener("change", () => {
 currentEpisode = Number(episodeSelect.value);
 updateEpisodeLabel();
 loadPlayer();
});

document.getElementById("play").addEventListener("click", loadPlayer);

document.getElementById("prev").addEventListener("click", () => {
 if (currentEpisode > 1) {
  currentEpisode--;
 } else if (currentSeason > 1) {
  currentSeason--;
  currentEpisode = CONFIG.episodes;
 }
 fillSelect(seasonSelect, CONFIG.seasons, currentSeason);
 fillSelect(episodeSelect, CONFIG.episodes, currentEpisode);
 updateEpisodeLabel();
 loadPlayer();
});

document.getElementById("next").addEventListener("click", () => {
 if (currentEpisode < CONFIG.episodes) {
  currentEpisode++;
  fillSelect(episodeSelect, CONFIG.episodes, currentEpisode);
  updateEpisodeLabel();
  loadPlayer();
 }
});
</script>
</body>
</html>
