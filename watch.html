
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05050b">
<title>NOTWIN TV</title>

<style>
:root {
  --bg:#05050b;
  --video:#100e16;
  --purple:#b49dff;
  --text:#e9e4f4;
  --muted:#a49caf;
}
* { box-sizing:border-box; }
html,body {
  margin:0;
  min-height:100%;
  background:#000;
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
}
button,select { font:inherit; }
button { cursor:pointer; }
a { color:inherit;text-decoration:none; }

.page {
  width:min(100%,1200px);
  min-height:100vh;
  margin:auto;
  padding:20px 3%;
  background:var(--bg);
}
.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:32px;
}
.home-link {
  flex-shrink:0;
  color:#c9c2d6;
  font-size:15px;
  white-space:nowrap;
}
#showTitle {
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:clamp(17px,3.5vw,30px);
  font-weight:400;
  color:#c9c2d6;
}
.logo {
  flex-shrink:0;
  color:var(--purple);
  font-size:clamp(21px,4vw,36px);
  font-weight:900;
  white-space:nowrap;
}

.player-card {
  background:#000;
  border-radius:28px;
  padding:18px;
}
.player-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:25px;
}
#episodeLabel {
  color:#cfc8da;
  font-size:clamp(20px,3.5vw,32px);
}
.fullscreen-btn {
  width:32px;
  height:32px;
  padding:0;
  display:grid;
  place-items:center;
  border:0;
  background:transparent;
  color:#eee;
  font-size:23px;
  border-radius:7px;
}
.fullscreen-btn:active { background:#21182d; }

.video-box {
  width:100%;
  aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
  border-radius:25px;
  background:var(--video);
}
#videoFrame {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:var(--video);
}
.video-placeholder {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  background:var(--video);
  color:#b5adbf;
  font-size:clamp(19px,3.4vw,32px);
  text-align:center;
  pointer-events:none;
}
.video-placeholder.hidden { display:none; }
.play-circle {
  width:70px;
  height:70px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#a982e7;
  color:#100b18;
  font-size:32px;
}

.controls {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin-top:24px;
}
.control-btn {
  min-width:0;
  min-height:105px;
  padding:12px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  border:1px solid #21152e;
  border-radius:19px;
  background:#191025;
  color:#e8e0f5;
  font-size:19px;
}
.control-btn svg {
  width:30px;
  height:30px;
  stroke:var(--purple);
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
  fill:none;
}
.control-btn:active { background:#29183b; }
.control-btn:disabled { opacity:.35;cursor:not-allowed; }

.episodes-panel {
  display:none;
  margin-top:18px;
  padding:16px;
  border:1px solid #30223f;
  border-radius:18px;
  background:#100c18;
}
.episodes-panel.open { display:block; }
.panel-title {
  margin:0 0 15px;
  font-size:19px;
  color:var(--purple);
}
.select-row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.select-group label {
  display:block;
  margin-bottom:8px;
  color:var(--muted);
  font-size:14px;
}
.select-group select {
  width:100%;
  min-width:0;
  padding:12px 9px;
  border:1px solid #352746;
  border-radius:12px;
  color:var(--text);
  background:#1a1225;
}
#status {
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}
#status:empty { display:none; }
.error { color:#ff9dbb!important; }

#videoBox:fullscreen {
  width:100vw;
  height:100vh;
  aspect-ratio:auto;
  border-radius:0;
  background:#000;
}
#videoBox:fullscreen #videoFrame {
  width:100%;
  height:100%;
}
#videoBox:-webkit-full-screen {
  width:100vw;
  height:100vh;
  aspect-ratio:auto;
  border-radius:0;
}
#videoBox:-webkit-full-screen #videoFrame {
  width:100%;
  height:100%;
}

body.fallback-fullscreen { overflow:hidden; }
body.fallback-fullscreen .page {
  position:fixed;
  inset:0;
  z-index:9999;
  width:100%;
  padding:0;
}
body.fallback-fullscreen .topbar,
body.fallback-fullscreen .controls,
body.fallback-fullscreen .episodes-panel,
body.fallback-fullscreen #status {
  display:none!important;
}
body.fallback-fullscreen .player-card {
  position:absolute;
  inset:0;
  padding:0;
  border-radius:0;
}
body.fallback-fullscreen .player-head {
  position:absolute;
  top:env(safe-area-inset-top,0px);
  right:12px;
  left:12px;
  z-index:5;
  margin:0;
}
body.fallback-fullscreen .video-box {
  width:100%;
  height:100%;
  aspect-ratio:auto;
  border-radius:0;
}
body.fallback-fullscreen #videoFrame {
  width:100%;
  height:100%;
}

@media(max-width:600px) {
  .page { padding:16px 3%; }
  .topbar { gap:8px;margin-bottom:28px; }
  .home-link { font-size:12px; }
  #showTitle { font-size:16px; }
  .logo { font-size:21px; }
  .player-card { padding:12px;border-radius:23px; }
  .player-head { margin-bottom:20px; }
  .video-box { border-radius:20px; }
  .play-circle { width:60px;height:60px;font-size:28px; }
  .controls { gap:9px;margin-top:20px; }
  .control-btn {
    min-height:92px;
    padding:10px 4px;
    gap:11px;
    border-radius:16px;
    font-size:16px;
  }
  .control-btn svg { width:26px;height:26px; }
  .episodes-panel { padding:12px; }
  .select-row { gap:8px; }
  .select-group select { font-size:13px; }
}
@media(max-width:350px) {
  .home-link { font-size:11px; }
  #showTitle { font-size:14px; }
  .logo { font-size:18px; }
  .control-btn { font-size:14px; }
}

/* زر الرجوع للرئيسية يظهر دائمًا خارج وضع ملء الشاشة */
</style>
</head>

<body>
<div class="page">
  <header class="topbar">
    <a class="home-link" href="./index.html">← الرئيسية</a>
    <div id="showTitle">جاري التحميل...</div>
    <a class="logo" href="./index.html">notwin tv</a>
  </header>

  <section class="player-card">
    <div class="player-head">
      <button class="fullscreen-btn" id="fullscreenBtn"
        type="button" aria-label="ملء الشاشة" title="ملء الشاشة">⛶</button>
      <div id="episodeLabel">الحلقة 1</div>
    </div>

    <div class="video-box" id="videoBox">
      <iframe id="videoFrame"
        title="مشغل الفيديو"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"></iframe>

      <div class="video-placeholder" id="placeholder">
        <span class="play-circle">▶</span>
        <span id="placeholderText">مشغل الفيديو</span>
      </div>
    </div>
  </section>

  <div class="controls">
    <button class="control-btn" id="nextBtn" type="button">
      <svg viewBox="0 0 24 24">
        <path d="M5 5v14l10-7z"></path>
        <path d="M19 5v14"></path>
      </svg>
      <span>التالية</span>
    </button>

    <button class="control-btn" id="episodesBtn" type="button">
      <svg viewBox="0 0 24 24">
        <path d="M4 5h16M4 11h11M4 17h11"></path>
        <path d="m17 14 4 3-4 3z"></path>
      </svg>
      <span>الحلقات</span>
    </button>

    <button class="control-btn" id="previousBtn" type="button">
      <svg viewBox="0 0 24 24">
        <path d="M19 5v14L9 12z"></path>
        <path d="M5 5v14"></path>
      </svg>
      <span>السابقة</span>
    </button>
  </div>

  <section class="episodes-panel" id="episodesPanel">
    <h2 class="panel-title">المواسم والحلقات</h2>
    <div class="select-row">
      <div class="select-group">
        <label for="seasonSelect">الموسم</label>
        <select id="seasonSelect"></select>
      </div>
      <div class="select-group">
        <label for="episodeSelect">الحلقة</label>
        <select id="episodeSelect"></select>
      </div>
    </div>
  </section>

  <div id="status"></div>
</div>

<script>
"use strict";

const TMDB_API_KEY = "26c5ad9f51818e110945285552c11a75";
const TMDB_API = "https://api.themoviedb.org/3";
const PLAYER_URL = "https://cinesrc.st/embed/tv/";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const showId = Number(params.get("id"));

let seasons = [];
let episodes = [];
let seasonNumber = Number(params.get("season")) || 1;
let episodeNumber = Number(params.get("episode")) || 1;
let requestNumber = 0;
let fallbackFullscreen = false;

async function tmdb(path) {
  const url = new URL(TMDB_API + path);
  url.searchParams.set("api_key", TMDB_API_KEY);
  url.searchParams.set("language", "ar-SA");

  const response = await fetch(url);
  if (!response.ok) {
    if (response.status === 401) throw new Error("مفتاح TMDB غير صالح.");
    if (response.status === 404) throw new Error("لم يتم العثور على المحتوى.");
    throw new Error("تعذر تحميل البيانات. تحقق من الإنترنت.");
  }
  return response.json();
}

function setStatus(message, error = false) {
  $("status").textContent = message;
  $("status").classList.toggle("error", error);
}

function setPlaceholder(message) {
  $("placeholderText").textContent = message;
  $("placeholder").classList.remove("hidden");
}

function updateLink() {
  const url = new URL(location.href);
  url.searchParams.set("id", String(showId));
  url.searchParams.set("season", String(seasonNumber));
  url.searchParams.set("episode", String(episodeNumber));
  history.replaceState(null, "", url);
}

function playEpisode() {
  $("episodeLabel").textContent = "الحلقة " + episodeNumber;
  setPlaceholder("جاري تجهيز الفيديو...");

  $("videoFrame").src =
    PLAYER_URL + encodeURIComponent(String(showId)) +
    "?s=" + encodeURIComponent(String(seasonNumber)) +
    "&e=" + encodeURIComponent(String(episodeNumber));

  updateLink();
  updateNavigation();
}

function updateNavigation() {
  const index = episodes.findIndex(
    item => item.episode_number === episodeNumber
  );
  $("previousBtn").disabled = index <= 0 &&
    !seasons.some(s => s.season_number > 0 && s.season_number < seasonNumber);
  $("nextBtn").disabled = index < 0 ||
    (index === episodes.length - 1 &&
     !seasons.some(s => s.season_number > seasonNumber));
}

async function loadSeason(number, wantedEpisode = 1) {
  const currentRequest = ++requestNumber;
  seasonNumber = number;
  $("episodeSelect").replaceChildren();
  $("episodeSelect").disabled = true;
  setPlaceholder("جاري تجهيز الفيديو...");

  try {
    const data = await tmdb("/tv/" + showId + "/season/" + seasonNumber);
    if (currentRequest !== requestNumber) return;

    episodes = data.episodes || [];
    if (!episodes.length) throw new Error("لا توجد حلقات في هذا الموسم.");

    episodeNumber = episodes.some(
      item => item.episode_number === wantedEpisode
    ) ? wantedEpisode : episodes[0].episode_number;

    for (const item of episodes) {
      const option = document.createElement("option");
      option.value = String(item.episode_number);
      option.textContent = "الحلقة " + item.episode_number;
      $("episodeSelect").appendChild(option);
    }

    $("episodeSelect").value = String(episodeNumber);
    $("episodeSelect").disabled = false;
    $("seasonSelect").value = String(seasonNumber);
    playEpisode();
    setStatus("");
  } catch (error) {
    if (currentRequest !== requestNumber) return;
    setPlaceholder("تعذر تحميل الفيديو");
    setStatus(error.message, true);
  }
}

async function goToEpisode(direction) {
  const index = episodes.findIndex(
    item => item.episode_number === episodeNumber
  );
  const target = episodes[index + direction];

  if (target) {
    episodeNumber = target.episode_number;
    $("episodeSelect").value = String(episodeNumber);
    playEpisode();
    return;
  }

  const validSeasons = seasons
    .filter(s => s.season_number > 0)
    .sort((a,b) => a.season_number - b.season_number);

  const seasonIndex = validSeasons.findIndex(
    s => s.season_number === seasonNumber
  );
  const otherSeason = validSeasons[seasonIndex + direction];
  if (!otherSeason) return;

  try {
    const data = await tmdb(
      "/tv/" + showId + "/season/" + otherSeason.season_number
    );
    const list = data.episodes || [];
    if (!list.length) return;

    const wanted = direction > 0
      ? list[0].episode_number
      : list[list.length - 1].episode_number;

    await loadSeason(otherSeason.season_number, wanted);
  } catch (error) {
    setStatus(error.message, true);
  }
}

$("episodesBtn").addEventListener("click", () => {
  $("episodesPanel").classList.toggle("open");
});

$("previousBtn").addEventListener("click", () => goToEpisode(-1));
$("nextBtn").addEventListener("click", () => goToEpisode(1));

$("seasonSelect").addEventListener("change", event => {
  loadSeason(Number(event.target.value), 1);
});

$("episodeSelect").addEventListener("change", event => {
  episodeNumber = Number(event.target.value);
  playEpisode();
});

$("videoFrame").addEventListener("load", () => {
  $("placeholder").classList.add("hidden");
});

async function enterFullscreen() {
  const box = $("videoBox");
  try {
    if (box.requestFullscreen) {
      await box.requestFullscreen();
    } else if (box.webkitRequestFullscreen) {
      box.webkitRequestFullscreen();
    } else {
      fallbackFullscreen = true;
      document.body.classList.add("fallback-fullscreen");
    }

    if (screen.orientation && screen.orientation.lock) {
      try { await screen.orientation.lock("landscape"); }
      catch (_) {}
    }
  } catch (_) {
    setStatus("ملء الشاشة غير مدعوم في هذا المتصفح.", true);
  }
}

async function exitFullscreen() {
  try {
    if (document.fullscreenElement && document.exitFullscreen) {
      await document.exitFullscreen();
    } else if (document.webkitFullscreenElement &&
               document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  } catch (_) {}

  fallbackFullscreen = false;
  document.body.classList.remove("fallback-fullscreen");

  if (screen.orientation && screen.orientation.unlock) {
    try { screen.orientation.unlock(); }
    catch (_) {}
  }
}

$("fullscreenBtn").addEventListener("click", async () => {
  const active = document.fullscreenElement ||
    document.webkitFullscreenElement || fallbackFullscreen;
  if (active) await exitFullscreen();
  else await enterFullscreen();
});

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement &&
      screen.orientation && screen.orientation.unlock) {
    try { screen.orientation.unlock(); }
    catch (_) {}
  }
});

async function init() {
  if (!Number.isInteger(showId) || showId <= 0) {
    $("showTitle").textContent = "NOTWIN TV";
    setPlaceholder("المسلسل غير محدد");
    setStatus("افتح صفحة المشاهدة من رابط مسلسل صحيح.", true);
    return;
  }

  try {
    const show = await tmdb("/tv/" + showId);
    $("showTitle").textContent = show.name || show.original_name || "NOTWIN TV";
    document.title = $("showTitle").textContent + " | NOTWIN TV";

    seasons = (show.seasons || []).filter(s => s.season_number > 0);
    if (!seasons.length) throw new Error("لا توجد مواسم لهذا المسلسل.");

    const select = $("seasonSelect");
    select.replaceChildren();

    for (const item of seasons) {
      const option = document.createElement("option");
      option.value = String(item.season_number);
      option.textContent = item.name || "الموسم " + item.season_number;
      select.appendChild(option);
    }

    if (!seasons.some(s => s.season_number === seasonNumber)) {
      seasonNumber = seasons[0].season_number;
    }

    select.value = String(seasonNumber);
    await loadSeason(seasonNumber, episodeNumber);
  } catch (error) {
    $("showTitle").textContent = "NOTWIN TV";
    setPlaceholder("تعذر تحميل الفيديو");
    setStatus(error.message || "حدث خطأ.", true);
  }
}

init();
</script>
</body>
</html>
