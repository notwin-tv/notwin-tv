
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060c">
<title>المشاهدة | NOTWIN TV</title>

<style>
:root {
  --bg: #07060c;
  --panel: #100d19;
  --purple: #a78bfa;
  --purple2: #8060d9;
  --text: #f5f2ff;
  --muted: #aaa3ba;
  --border: rgba(177, 145, 255, .13);
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
  color-scheme: dark;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Tahoma, sans-serif;
}

button, select {
  font: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

.page {
  width: min(100%, 1000px);
  margin: auto;
  padding: 17px 16px 35px;
}

/* Header */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 48px;
  margin-bottom: 22px;
}

.brand {
  flex: 0 0 auto;
  color: var(--purple);
  font-size: clamp(19px, 4.5vw, 27px);
  font-weight: 900;
  letter-spacing: -.7px;
}

.home-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 11px;
  color: var(--muted);
  font-size: 13px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #100d17;
}

.home-link:active {
  color: white;
  background: #20172e;
}

.show-title {
  min-width: 0;
  flex: 1;
  overflow: hidden;
  color: #e8e2f4;
  font-size: clamp(15px, 3.6vw, 21px);
  font-weight: 600;
  text-align: left;
  direction: ltr;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Player */
.player-card {
  width: 100%;
  overflow: hidden;
  position: relative;
  background: #000;
  border: 1px solid rgba(255,255,255,.035);
  border-radius: 20px;
  box-shadow: 0 12px 35px rgba(0,0,0,.22);
}

.player-top {
  position: absolute;
  z-index: 2;
  top: 12px;
  left: 13px;
  right: 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
}

.player-top > * {
  pointer-events: auto;
}

.episode-label {
  padding: 7px 10px;
  border-radius: 9px;
  background: rgba(0,0,0,.68);
  color: #f3efff;
  font-size: 13px;
  backdrop-filter: blur(8px);
}

.fullscreen-btn {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 10px;
  background: rgba(0,0,0,.68);
  color: white;
  font-size: 25px;
  cursor: pointer;
}

.player-screen {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  min-height: 190px;
  background: #000;
}

.player-screen iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  border: 0;
  background: #000;
}

.player-screen:fullscreen {
  width: 100vw;
  height: 100vh;
  aspect-ratio: auto;
  background: #000;
}

.player-screen:fullscreen iframe {
  width: 100%;
  height: 100%;
}

.player-screen:fullscreen .player-top {
  top: max(14px, env(safe-area-inset-top));
}

/* Navigation buttons */
.controls {
  display: grid;
  grid-template-columns: 1fr 1.1fr 1fr;
  gap: 10px;
  margin: 17px 0 0;
}

.control-btn {
  min-width: 0;
  min-height: 70px;
  padding: 11px 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: var(--panel);
  color: var(--purple);
  cursor: pointer;
  transition: background .15s, transform .15s;
}

.control-btn:active {
  transform: scale(.97);
  background: #211831;
}

.control-btn:disabled {
  opacity: .38;
  cursor: not-allowed;
}

.control-btn .symbol {
  font-size: 24px;
  line-height: 1;
  font-weight: 700;
}

.control-btn .label {
  color: #ded6ed;
  font-size: 13px;
}

.control-btn.main {
  background: #171022;
  border-color: rgba(167,139,250,.2);
}

/* Episodes selector - hidden until clicked */
.episodes-panel {
  display: none;
  margin-top: 15px;
  padding: 15px;
  background: #100d18;
  border: 1px solid var(--border);
  border-radius: 16px;
}

.episodes-panel.open {
  display: block;
}

.selector-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 13px;
}

.selector-group label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 12px;
}

.selector-group select {
  width: 100%;
  min-width: 0;
  padding: 11px 9px;
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
  background: #09070f;
  color: white;
}

.episode-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
  gap: 8px;
}

.episode-item {
  min-height: 42px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #0a0810;
  color: #d9d1e9;
  cursor: pointer;
}

.episode-item.active {
  color: #fff;
  border-color: var(--purple);
  background: #33224d;
}

.loading-text {
  padding: 15px 0;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}

.error-text {
  color: #e9b8c8;
}

@media (min-width: 700px) {
  .page {
    padding-top: 25px;
  }

  .topbar {
    margin-bottom: 25px;
  }

  .player-card {
    border-radius: 22px;
  }

  .controls {
    max-width: 490px;
    margin: 18px auto 0;
    gap: 13px;
  }

  .control-btn {
    min-height: 76px;
  }
}

@media (max-width: 380px) {
  .page {
    padding-inline: 11px;
  }

  .topbar {
    gap: 8px;
  }

  .home-link {
    padding: 7px 8px;
    font-size: 12px;
  }

  .control-btn {
    min-height: 65px;
  }

  .control-btn .label {
    font-size: 12px;
  }
}
</style>
</head>

<body>
<div class="page">

  <header class="topbar">
    <a class="brand" href="./index.html">notwin tv</a>
    <div class="show-title" id="showTitle">جاري تحميل المسلسل...</div>
    <a class="home-link" href="./index.html" aria-label="العودة للرئيسية">
      <span>⌂</span> الرئيسية
    </a>
  </header>

  <main>
    <section class="player-card" id="playerCard" aria-label="مشغل المسلسل">
      <div class="player-screen" id="playerScreen">

        <div class="player-top">
          <div class="episode-label" id="episodeLabel">الحلقة 1</div>
          <button class="fullscreen-btn" id="fullscreenBtn"
            type="button" aria-label="ملء الشاشة" title="ملء الشاشة">⛶</button>
        </div>

        <iframe
          id="videoFrame"
          title="مشغل المسلسل"
          src="about:blank"
          allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
          allowfullscreen
          referrerpolicy="origin">
        </iframe>

      </div>
    </section>

    <nav class="controls" aria-label="التنقل بين الحلقات">
      <button class="control-btn" id="previousBtn" type="button">
        <span class="symbol">|◀</span>
        <span class="label">السابقة</span>
      </button>

      <button class="control-btn main" id="episodesBtn"
        type="button" aria-expanded="false" aria-controls="episodesPanel">
        <span class="symbol">☷</span>
        <span class="label">الحلقات</span>
      </button>

      <button class="control-btn" id="nextBtn" type="button">
        <span class="symbol">▶|</span>
        <span class="label">التالية</span>
      </button>
    </nav>

    <section class="episodes-panel" id="episodesPanel">
      <div class="selector-row">
        <div class="selector-group">
          <label for="seasonSelect">الموسم</label>
          <select id="seasonSelect">
            <option value="1">الموسم 1</option>
          </select>
        </div>

        <div class="selector-group">
          <label for="episodeSelect">الحلقة</label>
          <select id="episodeSelect">
            <option value="1">الحلقة 1</option>
          </select>
        </div>
      </div>

      <div class="episode-list" id="episodeList"></div>
      <div class="loading-text" id="episodesStatus" aria-live="polite"></div>
    </section>
  </main>
</div>

<script>
(() => {
  "use strict";

  /*
    NOTWIN TV watch page.
    TMDB API key is used only to retrieve show/season details.
    Public frontend keys can be viewed by site visitors.
  */

  const TMDB_KEY = "26c5ad9f51818e110945285552c11a75";
  const TMDB_BASE = "https://api.themoviedb.org/3";
  const EMBED_BASE = "https://cinesrc.st/embed/tv/";

  const params = new URLSearchParams(location.search);
  const showId = params.get("id");
  let season = Math.max(1, parseInt(params.get("season") || "1", 10) || 1);
  let episode = Math.max(1, parseInt(params.get("episode") || "1", 10) || 1);

  const $ = (id) => document.getElementById(id);

  const showTitle = $("showTitle");
  const episodeLabel = $("episodeLabel");
  const videoFrame = $("videoFrame");
  const playerScreen = $("playerScreen");
  const episodesBtn = $("episodesBtn");
  const episodesPanel = $("episodesPanel");
  const seasonSelect = $("seasonSelect");
  const episodeSelect = $("episodeSelect");
  const episodeList = $("episodeList");
  const episodesStatus = $("episodesStatus");
  const previousBtn = $("previousBtn");
  const nextBtn = $("nextBtn");
  const fullscreenBtn = $("fullscreenBtn");

  let showData = null;
  let currentSeasonData = null;

  function setStatus(message, isError = false) {
    episodesStatus.textContent = message;
    episodesStatus.classList.toggle("error-text", isError);
  }

  function makeTmdbUrl(path) {
    const separator = path.includes("?") ? "&" : "?";
    return `${TMDB_BASE}${path}${separator}api_key=${encodeURIComponent(TMDB_KEY)}&language=ar`;
  }

  async function fetchTmdb(path) {
    const response = await fetch(makeTmdbUrl(path));
    if (!response.ok) {
      throw new Error(`TMDB HTTP ${response.status}`);
    }
    return response.json();
  }

  function updateUrl() {
    const url = new URL(location.href);
    url.searchParams.set("season", season);
    url.searchParams.set("episode", episode);
    history.replaceState({}, "", url);
  }

  function updatePlayer() {
    episode = Math.max(1, episode);
    season = Math.max(1, season);

    episodeLabel.textContent = `الموسم ${season} · الحلقة ${episode}`;
    videoFrame.src =
      `${EMBED_BASE}${encodeURIComponent(showId || "")}` +
      `?s=${season}&e=${episode}`;

    seasonSelect.value = String(season);
    episodeSelect.value = String(episode);

    previousBtn.disabled = season === 1 && episode <= 1;
    updateUrl();
  }

  function setEpisodeOptions(count) {
    const total = Math.max(1, Number(count) || 1);

    episodeSelect.replaceChildren();

    for (let i = 1; i <= total; i++) {
      const option = document.createElement("option");
      option.value = String(i);
      option.textContent = `الحلقة ${i}`;
      episodeSelect.appendChild(option);
    }

    if (episode > total) episode = total;
    episodeSelect.value = String(episode);
  }

  function renderEpisodeButtons(count) {
    episodeList.replaceChildren();

    const total = Math.max(1, Number(count) || 1);

    for (let i = 1; i <= total; i++) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "episode-item" + (i === episode ? " active" : "");
      button.textContent = i;
      button.setAttribute("aria-label", `الحلقة ${i}`);

      button.addEventListener("click", () => {
        episode = i;
        updatePlayer();
        syncEpisodeHighlight();
      });

      episodeList.appendChild(button);
    }
  }

  function syncEpisodeHighlight() {
    [...episodeList.children].forEach((button, index) => {
      button.classList.toggle("active", index + 1 === episode);
    });
  }

  async function loadSeason(seasonNumber) {
    setStatus("جاري تحميل الحلقات...");

    try {
      const data = await fetchTmdb(
        `/tv/${encodeURIComponent(showId)}/season/${seasonNumber}`
      );

      currentSeasonData = data;
      const count = data.episodes?.length || 1;

      setEpisodeOptions(count);
      renderEpisodeButtons(count);
      setStatus(data.episodes?.length ? "" : "لم يتم العثور على حلقات لهذا الموسم.");

      if (data.episodes?.length) {
        const exists = data.episodes.some(item => item.episode_number === episode);
        if (!exists) episode = 1;
        episodeSelect.value = String(episode);
        syncEpisodeHighlight();
      }
    } catch (error) {
      console.error("Season loading error:", error);
      setEpisodeOptions(episode);
      renderEpisodeButtons(episode);
      setStatus("تعذر تحميل قائمة الحلقات. تحقق من اتصال الإنترنت.", true);
    }

    updatePlayer();
  }

  async function loadShow() {
    if (!showId) {
      showTitle.textContent = "المسلسل غير محدد";
      setStatus("افتح المسلسل من الصفحة الرئيسية أولًا.", true);
      videoFrame.src = "about:blank";
      previousBtn.disabled = true;
      nextBtn.disabled = true;
      return;
    }

    try {
      const data = await fetchTmdb(`/tv/${encodeURIComponent(showId)}`);
      showData = data;
      showTitle.textContent = data.name || data.original_name || "المشاهدة";

      const seasons = (data.seasons || []).filter(item => item.season_number > 0);
      seasonSelect.replaceChildren();

      if (seasons.length) {
        seasons.forEach(item => {
          const option = document.createElement("option");
          option.value = String(item.season_number);
          option.textContent = `الموسم ${item.season_number}`;
          seasonSelect.appendChild(option);
        });

        if (!seasons.some(item => item.season_number === season)) {
          season = seasons[0].season_number;
        }
      } else {
        const option = document.createElement("option");
        option.value = String(season);
        option.textContent = `الموسم ${season}`;
        seasonSelect.appendChild(option);
      }

      seasonSelect.value = String(season);
      await loadSeason(season);
    } catch (error) {
      console.error("Show loading error:", error);
      showTitle.textContent = "المشاهدة";
      seasonSelect.value = String(season);
      setEpisodeOptions(episode);
      renderEpisodeButtons(episode);
      setStatus("تعذر تحميل معلومات المسلسل؛ يمكنك تجربة المشغل رغم ذلك.", true);
      updatePlayer();
    }
  }

  previousBtn.addEventListener("click", async () => {
    if (season === 1 && episode <= 1) return;

    if (episode > 1) {
      episode--;
      updatePlayer();
      syncEpisodeHighlight();
      episodeSelect.value = String(episode);
    } else {
      const previousSeason = season - 1;
      season = previousSeason;
      episode = 1;

      await loadSeason(season);

      if (currentSeasonData?.episodes?.length) {
        episode = currentSeasonData.episodes.length;
        updatePlayer();
        episodeSelect.value = String(episode);
        syncEpisodeHighlight();
      }
    }
  });

  nextBtn.addEventListener("click", async () => {
    const total = currentSeasonData?.episodes?.length || Number(episodeSelect.options.length) || 1;

    if (episode < total) {
      episode++;
      updatePlayer();
      episodeSelect.value = String(episode);
      syncEpisodeHighlight();
    } else {
      const availableSeasons = [...seasonSelect.options].map(o => Number(o.value));
      const nextSeason = availableSeasons.find(s => s > season);

      if (nextSeason) {
        season = nextSeason;
        episode = 1;
        await loadSeason(season);
      } else {
        setStatus("وصلت لآخر حلقة متاحة في القائمة.");
        episodesPanel.classList.add("open");
        episodesBtn.setAttribute("aria-expanded", "true");
      }
    }
  });

  episodesBtn.addEventListener("click", () => {
    const isOpen = episodesPanel.classList.toggle("open");
    episodesBtn.setAttribute("aria-expanded", String(isOpen));

    if (isOpen) {
      episodesPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  });

  seasonSelect.addEventListener("change", async () => {
    season = Number(seasonSelect.value) || 1;
    episode = 1;
    await loadSeason(season);
  });

  episodeSelect.addEventListener("change", () => {
    episode = Number(episodeSelect.value) || 1;
    updatePlayer();
    syncEpisodeHighlight();
  });

  fullscreenBtn.addEventListener("click", async () => {
    try {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
        return;
      }

      if (playerScreen.requestFullscreen) {
        await playerScreen.requestFullscreen();
      } else if (videoFrame.requestFullscreen) {
        await videoFrame.requestFullscreen();
      }

      // Orientation locking is supported only by some browsers/devices.
      if (screen.orientation && screen.orientation.lock) {
        try {
          await screen.orientation.lock("landscape");
        } catch (_) {
          // Fullscreen still works if orientation lock is unsupported.
        }
      }
    } catch (error) {
      console.warn("Fullscreen unavailable:", error);
    }
  });

  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && screen.orientation?.unlock) {
      try { screen.orientation.unlock(); } catch (_) {}
    }
  });

  loadShow();
})();
</script>
</body>
</html>
